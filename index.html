<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Catalog EFS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22402C">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --track:#C1440E;
    --track-dark:#9A350A;
    --infield:#22402C;
    --infield-dark:#182E20;
    --chalk:#F6F4EE;
    --card:#FFFFFF;
    --ink:#1E211D;
    --muted:#6E7268;
    --border:#E2DECF;
    --yellow:#E3A23C;
    --danger:#B23A32;
    --ok:#3D7A4E;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--chalk);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',system-ui,sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  /* ---------- HEADER ---------- */
  header{
    background:var(--infield);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    flex-shrink:0;
    border-bottom:4px solid var(--track);
  }
  header .title{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:22px;
    color:#fff;
  }
  header .subtitle{
    font-size:13px;
    color:#C9D6C7;
    font-family:'Inter',sans-serif;
    text-transform:none;
    letter-spacing:0;
  }
  header .date{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    color:#E3D9C4;
    text-transform:capitalize;
  }
  /* ---------- LAYOUT ---------- */
  .body-wrap{
    flex:1;
    display:flex;
    overflow:hidden;
  }
  nav.sidebar{
    width:190px;
    background:var(--infield-dark);
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    padding:10px 0;
    overflow-y:auto;
  }
  nav.sidebar button{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    border:none;
    background:transparent;
    color:#CFE0CC;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    padding:14px 18px;
    cursor:pointer;
    text-align:left;
    border-left:4px solid transparent;
  }
  nav.sidebar button svg{flex-shrink:0;width:20px;height:20px;}
  nav.sidebar button.active{
    background:var(--infield);
    color:#fff;
    border-left:4px solid var(--track);
  }
  nav.sidebar button:not(.active):hover{
    background:rgba(255,255,255,0.06);
  }
  main{
    flex:1;
    overflow-y:auto;
    padding:22px 26px 80px;
  }
  main h2{
    font-size:22px;
    margin:0 0 4px;
    color:var(--infield);
  }
  .tab-desc{
    color:var(--muted);
    font-size:14px;
    margin:0 0 20px;
  }
  /* ---------- BOTTOM TAB BAR (narrow screens) ---------- */
  nav.bottombar{
    display:none;
  }
  @media (max-width:760px){
    nav.sidebar{display:none;}
    .body-wrap{flex-direction:column;}
    main{padding:16px 14px 90px;}
    nav.bottombar{
      display:flex;
      position:fixed;
      bottom:0; left:0; right:0;
      background:var(--infield-dark);
      border-top:3px solid var(--track);
      z-index:20;
    }
    nav.bottombar button{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:3px;
      background:transparent;
      border:none;
      color:#CFE0CC;
      font-size:10px;
      font-weight:600;
      padding:8px 2px 10px;
    }
    nav.bottombar button svg{width:19px;height:19px;}
    nav.bottombar button.active{color:#fff;}
    nav.bottombar button.active svg{stroke:var(--track);}
  }
  /* ---------- MOD COMPACT PE ECRAN ÎN PORTRET (tabletă) — mai mulți elevi vizibili pe pagină ---------- */
  @media (orientation: portrait){
    header{padding:8px 14px;}
    header h1{font-size:17px;}
    header .subtitle{display:none;}
    header .date{display:none;}
    main{padding:10px 12px 80px;}
    main h2{font-size:17px; margin-bottom:2px;}
    .tab-desc{font-size:12px; margin-bottom:10px;}
    .card{padding:10px; margin-bottom:10px;}
    .row{gap:6px;}
    input[type=text], input[type=date], input[type=number], select{
      min-height:36px; padding:7px 9px; font-size:14px;
    }
    button.btn{min-height:36px; padding:8px 12px; font-size:13px;}
    table th{padding:5px 6px; font-size:11px;}
    table td{padding:5px 6px; font-size:13px;}
    nav.sidebar button{padding:9px 14px; font-size:13px;}
    nav.sidebar{width:150px;}
    input.grade-input{width:78px; min-height:34px; padding:5px 7px; font-size:14px;}
  }
  /* ---------- GENERIC UI ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em;}
  input[type=text], input[type=date], input[type=number], select{
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:10px 12px;
    border:1.5px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    min-height:44px;
  }
  input:focus, select:focus{outline:2px solid var(--track); outline-offset:1px;}
  button.btn{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:11px 18px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    min-height:44px;
    white-space:nowrap;
  }
  button.btn-primary{background:var(--track); color:#fff;}
  button.btn-primary:hover{background:var(--track-dark);}
  button.btn-secondary{background:#fff; color:var(--infield); border:1.5px solid var(--infield);}
  button.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger); padding:8px 12px; font-size:13px; min-height:36px;}
  button.btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border); padding:8px 12px; font-size:13px; min-height:36px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{
    text-align:left;
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
    border-bottom:2px solid var(--border);
    padding:8px 8px;
  }
  td{padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
  }
  .empty .display{font-size:17px; color:var(--infield); margin-bottom:6px;}
  .pill{
    display:inline-block;
    padding:3px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
  }
  .pill-yellow{background:#FBEBD3; color:#8A5A16;}
  .pill-danger{background:#F6DCDA; color:var(--danger);}
  .pill-ok{background:#DCEBDF; color:var(--ok);}
  .pill-blue{background:#D9E6F5; color:#1D5A9E;}
  .pill-ghost{background:#EDEBE3; color:var(--muted);}
  .class-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px;}
  .class-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    border-top:4px solid var(--infield);
  }
  .class-card h3{margin:0 0 4px; font-size:18px; color:var(--infield);}
  .class-card .count{color:var(--muted); font-size:13px; margin-bottom:12px;}
  .class-card .actions{display:flex; gap:8px;}
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--infield);
    color:#fff;
    padding:10px 20px;
    border-radius:30px;
    font-size:14px;
    font-weight:600;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  input.grade-input{width:100px; text-align:center;}
  .student-name{font-weight:600;}
  .exempt-note{font-style:italic; color:var(--yellow); font-size:13px;}
  select.absence-select{min-width:170px;}
  .settings-btn{
    background:transparent;
    border:none;
    color:#C9D6C7;
    cursor:pointer;
    padding:6px;
  }
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
  }
  .modal{
    background:#fff; border-radius:12px; padding:24px;
    width:min(420px,90vw);
  }
  .modal h3{margin-top:0; color:var(--infield);}
  .modal .row{margin-bottom:14px;}
  .top-actions{display:flex; justify-content:flex-end; gap:8px; margin-bottom:14px;}
  .count-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:22px; height:22px; padding:0 6px;
    border-radius:11px; background:var(--track); color:#fff;
    font-size:12px; font-weight:700;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CATALOG EFS — catalog personal pentru profesorul de educație fizică
   Stocare persistentă locală (localStorage), 100% pe dispozitiv, fără internet.
   ============================================================ */

const STORAGE_KEY = 'catalog_efs_state_v1';
const UI_STORAGE_KEY = 'catalog_efs_ui_v1';

let state = {
  settings: { titlu: 'Catalogul meu EFS', anScolar: '2026-2027', urmatorulCodElev: 1 },
  clase: [],      // {id, nume, an: 'IX'|'X'|'XI'|'XII'}
  elevi: [],      // {id, claseId, nume, prenume, sex, scutit, motivScutire}
  probe: [],      // {id, nume, claseId ('all' sau id clasă), data}
  note: [],       // {id, eleviId, probaId, valoare, notaCalculata, data}
  absente: [],    // {id, eleviId, claseId, data, stare} stare: 'prezent'|'motivat'|'nemotivat'
  bareme: [],     // {id, nume, directie:'desc'|'asc', praguri:{IX:{M:{9..4},F:{9..4}}, X:{...}, XI:{...}, XII:{...}}}
  observatiiCustom: []  // observații suplimentare adăugate de profesor, pe lângă cele predefinite
};

const ANI = ['IX','X','XI','XII'];

let currentTab = 'clase';
let ui = {
  eleviClasa: null,
  notareClasa: null, notareProba: null,
  absenteClasa: null, absenteData: todayISO(),
  baremeSelectat: null, baremeAn: 'IX',
  sintezaClasa: null,
  scutiriClasa: null,
  istoricClasa: null, istoricElev: null,
  practicaClasa: null,
};

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// pune automat majusculă la începutul fiecărui cuvânt dintr-un nume (funcționează cu diacritice și nume compuse cu cratimă)
function capitalizeazaNume(s){
  return String(s ?? '').toLowerCase().replace(/(^|[\s-])\p{L}/gu, m => m.toUpperCase());
}

/* ---------------- STORAGE ----------------
   Salvare 100% locală, în browserul dispozitivului (localStorage).
   Nu are nevoie de internet — funcționează și fără semnal, pe teren.
   Singura limită: datele rămân pe DISPOZITIVUL pe care le-ai introdus.
   Pentru a le muta pe alt dispozitiv (laptop <-> tabletă), folosește
   Setări -> Exportă backup / Importă backup.
------------------------------------------------ */
async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){
    console.log('Nicio dată salvată anterior pe acest dispozitiv, pornim de la zero.');
  }
  migreazaDate();
  loadUIState();
}
// ține minte tab-ul curent și selecțiile (clasă/elev/probă) din fiecare secțiune,
// ca la redeschidere să continui exact de unde ai rămas
function loadUIState(){
  try{
    const raw = localStorage.getItem(UI_STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.currentTab) currentTab = parsed.currentTab;
      if(parsed.ui) ui = Object.assign(ui, parsed.ui);
    }
  }catch(e){ /* nimic salvat încă, pornim cu valorile implicite */ }
  // data la Absențe se actualizează mereu la ziua curentă la o deschidere nouă a aplicației,
  // indiferent pe ce dată ai rămas ultima oară
  ui.absenteData = todayISO();
}
function saveUIState(){
  try{ localStorage.setItem(UI_STORAGE_KEY, JSON.stringify({currentTab, ui})); }catch(e){}
}
// aduce datele mai vechi la formatele noi (probe cu o singură clasă -> listă de clase; tip de notare implicit; note cu moment implicit)
function migreazaDate(){
  (state.probe || []).forEach(p=>{
    if(!p.claseIds){
      p.claseIds = p.claseId ? [p.claseId] : ['all'];
    }
    if(!p.tipNotare) p.tipNotare = 'nota';
  });
  (state.elevi || []).forEach(e=>{
    if(e.inaltime===undefined) e.inaltime = null;
    if(e.greutate===undefined) e.greutate = null;
    // scutire veche (doar boolean + motiv) -> se consideră "totală anuală" implicit
    if(e.scutit && !e.scutireTip) e.scutireTip = 'totala_anuala';
    if(e.scutireTip===undefined) e.scutireTip = null;
    if(e.scutireSubTip===undefined) e.scutireSubTip = null;
    if(e.scutireStart===undefined) e.scutireStart = null;
    if(e.scutireEnd===undefined) e.scutireEnd = null;
    if(e.dataNasterii===undefined) e.dataNasterii = null;
    if(!e.codUnic) e.codUnic = genereazaCodElev();
  });
  (state.note || []).forEach(n=>{
    if(!n.moment) n.moment = 'initial';
  });
  (state.clase || []).forEach(c=>{
    if(!c.practica) c.practica = [];
    if(c.arhivata===undefined) c.arhivata = false;
    if(!c.anScolar) c.anScolar = state.settings.anScolar;
  });
  (state.bareme || []).forEach(b=>{
    if(!b.categorie) b.categorie = 'Altele';
  });
  if(!state.settings.anScolar) state.settings.anScolar = '2026-2027';
  if(!state.settings.urmatorulCodElev) state.settings.urmatorulCodElev = 1;
  if(!state.observatiiCustom) state.observatiiCustom = [];
}
// generează un cod unic secvențial pentru un elev nou, legat de anul școlar curent (ex: EFS2026-001)
function genereazaCodElev(){
  const anStart = (state.settings.anScolar || '2026-2027').split('-')[0];
  const nr = state.settings.urmatorulCodElev || 1;
  state.settings.urmatorulCodElev = nr + 1;
  return `EFS${anStart}-${String(nr).padStart(3,'0')}`;
}
// clasele active (nearhivate) — folosite peste tot unde alegi o clasă de lucru
function claseActive(){
  return state.clase.filter(c=>!c.arhivata);
}
// perioada de practică comasată activă AZI pentru o clasă, dacă există (o clasă poate avea mai multe perioade în an)
function practicaActiva(claseId){
  const c = state.clase.find(c=>c.id===claseId);
  if(!c || !c.practica || !c.practica.length) return null;
  const azi = todayISO();
  return c.practica.find(p=>azi>=p.start && azi<=p.end) || null;
}
// bannerul de atenționare afișat în orice secțiune unde e selectată o clasă aflată în practică
function bannerPracticaHTML(claseId){
  const p = practicaActiva(claseId);
  if(!p) return '';
  return `<div class="card" style="background:#FBEBD3; border-color:#E3A23C; display:flex; align-items:center; gap:10px;">
    <span style="font-size:20px;">🧳</span>
    <div>
      <strong>Clasa este în practică comasată</strong> (${formatDataRo(p.start)} – ${formatDataRo(p.end)})${p.nume ? ' — '+escapeHtml(p.nume) : ''}.
      Poți nota sau bifa în continuare, doar ai grijă că elevii nu sunt fizic la oră.
    </div>
  </div>`;
}
// scutirea e activă azi? (o scutire temporară expiră automat singură, elevul redevine apt)
function esteScutitActiv(e){
  if(!e.scutit || !e.scutireTip) return false;
  if(e.scutireTip==='temporara'){
    if(!e.scutireStart || !e.scutireEnd) return true;
    const azi = todayISO();
    return azi>=e.scutireStart && azi<=e.scutireEnd;
  }
  return true; // totală anuală sau parțială -> activă până e anulată manual
}
// scutirea PARȚIALĂ (permanentă sau temporară) nu blochează notarea — elevul poate fi notat
// la probele pe care profesorul consideră că le poate efectua. Doar scutirea TOTALĂ blochează.
function blocheazaNotarea(e){
  if(!esteScutitActiv(e)) return false;
  if(e.scutireTip==='partiala') return false;
  if(e.scutireTip==='temporara' && e.scutireSubTip==='partiala') return false;
  return true;
}
function scutirePartialaActiva(e){
  return esteScutitActiv(e) && !blocheazaNotarea(e);
}
function scutirePillHTML(e){
  if(!e.scutit || !e.scutireTip) return '—';
  const activa = esteScutitActiv(e);
  if(e.scutireTip==='totala_anuala'){
    return activa ? '<span class="pill pill-danger">Scutit — Totală anuală</span>' : '—';
  }
  if(e.scutireTip==='partiala'){
    return activa ? '<span class="pill pill-blue">Scutit — Parțială</span>' : '—';
  }
  if(e.scutireTip==='temporara'){
    const fel = e.scutireSubTip==='partiala' ? 'parțială' : 'totală';
    if(activa){
      return `<span class="pill pill-yellow">Scutit — Temporară (${fel}), ${formatDataRo(e.scutireStart)}–${formatDataRo(e.scutireEnd)}</span>`;
    }
    return `<span class="pill pill-ghost">Temporară expirată (${formatDataRo(e.scutireStart)}–${formatDataRo(e.scutireEnd)}) — apt</span>`;
  }
  return '—';
}
// pentru un elev + o probă, alege nota testării finale dacă există, altfel cea a testării inițiale
function notaPentruSinteza(eleviId, probaId){
  const final = state.note.find(n=>n.eleviId===eleviId && n.probaId===probaId && n.moment==='final');
  if(final) return final;
  return state.note.find(n=>n.eleviId===eleviId && n.probaId===probaId && n.moment!=='final') || null;
}
let saveTimer = null;
let ultimaSalvare = null;
function saveStateNow(){
  clearTimeout(saveTimer);
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    ultimaSalvare = new Date();
    return true;
  }catch(e){
    return false;
  }
}
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if(!saveStateNow()) showToast('Nu am putut salva pe acest dispozitiv (spațiu insuficient?).');
    updateSaveIndicator();
  }, 150);
}
function updateSaveIndicator(){
  const el = document.getElementById('save-indicator');
  if(el) el.textContent = ultimaSalvare ? ('Salvat ' + ultimaSalvare.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',second:'2-digit'})) : '';
}
// dacă închizi sau navighezi din pagină, forțăm salvarea imediată a oricărei modificări netrimise încă
window.addEventListener('beforeunload', ()=>{ saveStateNow(); });
window.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveStateNow(); });

/* ---------------- EXPORT / IMPORT (sincronizare manuală între dispozitive) ---------------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayISO();
  a.href = url;
  a.download = `catalog-efs-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importBackupFile(file, onDone){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('format invalid');
      state = Object.assign({settings:{titlu:'Catalogul meu EFS'}, clase:[], elevi:[], probe:[], note:[], absente:[], bareme:[], observatiiCustom:[]}, parsed);
      migreazaDate();
      saveState();
      onDone(true);
    }catch(e){
      onDone(false);
    }
  };
  reader.onerror = () => onDone(false);
  reader.readAsText(file);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- HELPERS DE DATE ---------------- */
function claseNume(id){
  const c = state.clase.find(c=>c.id===id);
  return c ? c.nume : '—';
}
function eleviDinClasa(claseId){
  return state.elevi.filter(e=>e.claseId===claseId).sort((a,b)=>a.nume.localeCompare(b.nume,'ro'));
}
function formatDataRo(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('ro-RO', {day:'2-digit', month:'2-digit', year:'numeric'});
}

            const observatii = absElev.filter(a=>a.nota && a.nota.trim())

                                       .map(a=>`${formatDataRo(a.data)} (${labelStare(a.stare)}): ${escapeHtml(a.nota)}`)
                                       .join('<br>');
            return `<tr>
              <td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td>
              <td>${motivate>0?`<span class="pill pill-yellow">${motivate}</span>`:'—'}</td>
              <td>${nemotivate>0?`<span class="pill pill-danger">${nemotivate}</span>`:'—'}</td>
              <td style="font-size:13px;">${observatii || '<span style="color:var(--muted);">—</span>'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    `}
  `;
  document.getElementById('select-sinteza-clasa').addEventListener('change', e=>{
    ui.sintezaClasa = e.target.value; render();
  });
  document.getElementById('btn-raport-clasa').addEventListener('click', ()=>{
    genereazaRaportClasa(claseId);
  });
  document.getElementById('btn-raport-excel').addEventListener('click', ()=>{
    genereazaRaportExcelClasa(claseId);
  });
}

/* ================= RAPORT DE CLASĂ (printabil / salvabil ca PDF) ================= */
function genereazaRaportClasa(claseId){
  const clasa = state.clase.find(c=>c.id===claseId);
  const lista = eleviDinClasa(claseId);
  const probeClasa = state.probe.filter(p=>probaSeAplicaClasei(p, claseId)).sort((a,b)=>a.data.localeCompare(b.data));

  const randuriNote = lista.map(e=>{
    const noteNumerice = [];
    const celule = probeClasa.map(p=>{
      if(blocheazaNotarea(e)) return 'scutit';
      const rec = notaPentruSinteza(e.id, p.id);
      if(!rec) return '—';
      const eticheta = rec.moment==='final' ? 'F' : 'I';
      const dataStr = formatDataRo(rec.data);
      if(rec.notaCalculata!=null){ noteNumerice.push(rec.notaCalculata); return `${rec.valoare} [${eticheta}, ${dataStr}] (${rec.notaCalculata})`; }
      const numeric = parseFloat(String(rec.valoare).replace(',','.'));
      if(!isNaN(numeric) && numeric>=1 && numeric<=10) noteNumerice.push(numeric);
      return `${rec.valoare} [${eticheta}, ${dataStr}]`;
    });
    const medie = noteNumerice.length ? (noteNumerice.reduce((a,b)=>a+b,0)/noteNumerice.length).toFixed(2) : '—';
    return `<tr>
      <td>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td>
      ${celule.map(c=>`<td>${escapeHtml(String(c))}</td>`).join('')}
      <td><strong>${medie}</strong></td>
    </tr>`;
  }).join('');

  const randuriAbsente = lista.map(e=>{
    const absElev = state.absente.filter(a=>a.eleviId===e.id);
    const motivate = absElev.filter(a=>a.stare==='motivat').length;
    const nemotivate = absElev.filter(a=>a.stare==='nemotivat').length;
    const observatii = absElev.filter(a=>a.nota && a.nota.trim())
                               .sort((a,b)=>a.data.localeCompare(b.data))
                               .map(a=>`${formatDataRo(a.data)} (${labelStare(a.stare)}): ${a.nota}`)
                               .join('; ');
    return `<tr>
      <td>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td>
      <td>${motivate}</td>
      <td>${nemotivate}</td>
      <td>${escapeHtml(observatii)}</td>
    </tr>`;
  }).join('');

  const randuriAntropo = lista.map(e=>{
    const imc = (e.inaltime && e.greutate) ? (e.greutate / ((e.inaltime/100)*(e.inaltime/100))).toFixed(1) : '—';
    const catIMC = imc!=='—' ? categorieIMC(parseFloat(imc), claseAn(e.claseId), e.sex) : null;
    return `<tr>
      <td>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td>
      <td>${e.inaltime || '—'}</td>
      <td>${e.greutate || '—'}</td>
      <td>${imc}</td>
      <td>${catIMC ? catIMC.eticheta : '—'}</td>
    </tr>`;
  }).join('');

  const html = `<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8">
<title>Raport ${escapeHtml(clasa ? clasa.nume : '')} — Catalog EFS</title>
<style>
  body{font-family: Arial, sans-serif; color:#1a1a1a; padding:24px; max-width:1100px; margin:0 auto;}
  h1{font-size:22px; margin-bottom:2px;}
  .sub{color:#555; margin-bottom:24px; font-size:13px;}
  h2{font-size:16px; margin-top:32px; border-bottom:2px solid #22402C; padding-bottom:4px; color:#22402C;}
  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:12px;}
  th,td{border:1px solid #ccc; padding:6px 8px; text-align:left;}
  th{background:#f0efe9;}
  .btn-print{
    position:fixed; top:16px; right:16px; background:#C1440E; color:#fff; border:none;
    padding:10px 18px; border-radius:6px; font-weight:700; cursor:pointer; font-size:14px;
  }
  @media print{ .btn-print{ display:none; } body{ padding:0; } }
</style>
</head>
<body>
  <button class="btn-print" onclick="window.print()">🖨 Printează / Salvează PDF</button>
  <h1>Raport clasă — ${escapeHtml(clasa ? clasa.nume : '')}</h1>
  <div class="sub">Generat la ${formatDataRo(todayISO())}, ora ${new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}</div>

  <h2>Note pe probe</h2>
  <p style="font-size:12px; color:#666;">[I] = rezultatul testării inițiale, [F] = rezultatul testării finale (apare finala, dacă există).</p>
  ${probeClasa.length===0 ? '<p>Nicio probă înregistrată.</p>' : `
  <table>
    <thead><tr><th>Elev</th>${probeClasa.map(p=>`<th>${escapeHtml(p.nume)}</th>`).join('')}<th>Medie</th></tr></thead>
    <tbody>${randuriNote}</tbody>
  </table>`}

  <h2>Absențe și observații</h2>
  <table>
    <thead><tr><th>Elev</th><th>Motivate</th><th>Nemotivate</th><th>Observații</th></tr></thead>
    <tbody>${randuriAbsente}</tbody>
  </table>

  <h2>Date antropometrice</h2>
  <p style="font-size:11px; color:#888;">Categoria IMC e orientativă, pe grupe de vârstă și sex — nu înlocuiește o evaluare medicală.</p>
  <table>
    <thead><tr><th>Elev</th><th>Înălțime (cm)</th><th>Greutate (kg)</th><th>IMC</th><th>Categorie</th></tr></thead>
    <tbody>${randuriAntropo}</tbody>
  </table>
</body></html>`;

  const w = window.open('', '_blank');
  if(!w){ showToast('Permite ferestrele pop-up ca să vezi raportul.'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

/* ================= RAPORT EXCEL PE CLASĂ ================= */
function genereazaRaportExcelClasa(claseId){
  if(typeof XLSX==='undefined'){ showToast('Nu am putut încărca motorul de Excel — verifică internetul și încearcă din nou.'); return; }
  const clasa = state.clase.find(c=>c.id===claseId);
  const lista = eleviDinClasa(claseId);
  const probeClasa = state.probe.filter(p=>probaSeAplicaClasei(p, claseId)).sort((a,b)=>a.data.localeCompare(b.data));

  // Foaia 1: Note pe probe
  const antetNote = ['Elev', ...probeClasa.map(p=>p.nume), 'Medie'];
  const randuriNote = lista.map(e=>{
    const noteNumerice = [];
    const celule = probeClasa.map(p=>{
      if(blocheazaNotarea(e)) return 'scutit';
      const rec = notaPentruSinteza(e.id, p.id);
      if(!rec) return '';
      const eticheta = rec.moment==='final' ? 'F' : 'I';
      if(rec.notaCalculata!=null){ noteNumerice.push(rec.notaCalculata); return `${rec.valoare} [${eticheta}] (${rec.notaCalculata})`; }
      const numeric = parseFloat(String(rec.valoare).replace(',','.'));
      if(!isNaN(numeric) && numeric>=1 && numeric<=10) noteNumerice.push(numeric);
      return `${rec.valoare} [${eticheta}]`;
    });
    const medie = noteNumerice.length ? Number((noteNumerice.reduce((a,b)=>a+b,0)/noteNumerice.length).toFixed(2)) : '';
    return [`${e.nume} ${e.prenume}`, ...celule, medie];
  });

  // Foaia 2: Absențe și observații
  const antetAbsente = ['Elev', 'Motivate', 'Nemotivate', 'Observații'];
  const randuriAbsente = lista.map(e=>{
    const absElev = state.absente.filter(a=>a.eleviId===e.id);
    const motivate = absElev.filter(a=>a.stare==='motivat').length;
    const nemotivate = absElev.filter(a=>a.stare==='nemotivat').length;
    const observatii = absElev.filter(a=>a.nota && a.nota.trim())
                               .sort((a,b)=>a.data.localeCompare(b.data))
                               .map(a=>`${formatDataRo(a.data)} (${labelStare(a.stare)}): ${a.nota}`)
                               .join('; ');
    return [`${e.nume} ${e.prenume}`, motivate, nemotivate, observatii];
  });

  // Foaia 3: Date antropometrice
  const antetAntropo = ['Elev', 'Cod unic', 'Data nașterii', 'Înălțime (cm)', 'Greutate (kg)', 'IMC', 'Categorie'];
  const randuriAntropo = lista.map(e=>{
    const imc = (e.inaltime && e.greutate) ? Number((e.greutate / ((e.inaltime/100)*(e.inaltime/100))).toFixed(1)) : '';
    const catIMC = imc!=='' ? categorieIMC(imc, claseAn(e.claseId), e.sex) : null;
    return [`${e.nume} ${e.prenume}`, e.codUnic||'', e.dataNasterii ? formatDataRo(e.dataNasterii) : '', e.inaltime||'', e.greutate||'', imc, catIMC ? catIMC.eticheta : ''];
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetNote, ...randuriNote]), 'Note');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetAbsente, ...randuriAbsente]), 'Absente');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetAntropo, ...randuriAntropo]), 'Antropometrice');
  XLSX.writeFile(wb, `Raport_${(clasa?clasa.nume:'clasa').replace(/\s+/g,'_')}.xlsx`);
}

/* ================= RAPORT EXCEL — TOT CATALOGUL ================= */
function genereazaRaportExcelGeneral(){
  if(typeof XLSX==='undefined'){ showToast('Nu am putut încărca motorul de Excel — verifică internetul și încearcă din nou.'); return; }

  // Foaia 1: Elevi
  const antetElevi = ['Cod unic', 'Nume', 'Prenume', 'Clasă', 'An', 'Sex', 'Data nașterii', 'Înălțime', 'Greutate', 'Scutire'];
  const randuriElevi = state.elevi.map(e=>{
    const c = state.clase.find(cl=>cl.id===e.claseId);
    return [
      e.codUnic||'', e.nume, e.prenume, c?c.nume:'—', c?c.an:'—', e.sex==='M'?'Băiat':'Fată',
      e.dataNasterii?formatDataRo(e.dataNasterii):'', e.inaltime||'', e.greutate||'',
      esteScutitActiv(e) ? (e.scutireTip==='partiala'?'Parțială':e.scutireTip==='temporara'?'Temporară':'Totală anuală') : ''
    ];
  });

  // Foaia 2: Note (toate, pe toate clasele)
  const antetNote = ['Elev', 'Clasă', 'Probă', 'Moment', 'Valoare', 'Notă', 'Data'];
  const randuriNote = state.note.map(n=>{
    const e = state.elevi.find(el=>el.id===n.eleviId);
    const p = state.probe.find(pr=>pr.id===n.probaId);
    const c = e ? state.clase.find(cl=>cl.id===e.claseId) : null;
    return [
      e?`${e.nume} ${e.prenume}`:'—', c?c.nume:'—', p?p.nume:'—',
      n.moment==='final'?'Finală':'Inițială', n.valoare, n.notaCalculata!=null?n.notaCalculata:'', formatDataRo(n.data)
    ];
  });

  // Foaia 3: Absențe (toate, pe toate clasele)
  const antetAbsente = ['Elev', 'Clasă', 'Data', 'Stare', 'Observație'];
  const randuriAbsente = state.absente.map(a=>{
    const e = state.elevi.find(el=>el.id===a.eleviId);
    const c = e ? state.clase.find(cl=>cl.id===e.claseId) : null;
    return [e?`${e.nume} ${e.prenume}`:'—', c?c.nume:'—', formatDataRo(a.data), labelStare(a.stare), a.nota||''];
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetElevi, ...randuriElevi]), 'Elevi');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetNote, ...randuriNote]), 'Note');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetAbsente, ...randuriAbsente]), 'Absente');
  XLSX.writeFile(wb, `Catalog_EFS_${state.settings.anScolar}.xlsx`);
}

const CALIFICATIVE = [
  {cod:'FB*', nota:10, label:'FB* — Foarte bine cu stea'},

function pragGol(){ return {9:null,8:null,7:null,6:null,5:null,4:null}; }
const CATEGORII_BAREM = ['Atletism', 'Forță', 'Gimnastică', 'Sărituri', 'Jocuri sportive', 'Altele'];
function baremNou(nume, directie, categorie){
  return {

    praguri: { IX:{M:pragGol(),F:pragGol()}, X:{M:pragGol(),F:pragGol()}, XI:{M:pragGol(),F:pragGol()}, XII:{M:pragGol(),F:pragGol()} }
  };
}
function claseAn(claseId){

// Praguri orientative de IMC pe vârstă (an de studiu) și sex, aproximate după curbele de creștere
// standard pentru adolescenți (14-18 ani). Sunt un reper general, nu un diagnostic medical.
const IMC_PRAGURI = {
  IX:  { M:{sub:16.5, sup:22.6, obez:26.4}, F:{sub:16.3, sup:23.4, obez:27.8} },
  X:   { M:{sub:17.0, sup:23.2, obez:27.4}, F:{sub:16.9, sup:23.9, obez:28.5} },
  XI:  { M:{sub:17.5, sup:23.9, obez:28.2}, F:{sub:17.3, sup:24.3, obez:29.1} },
  XII: { M:{sub:17.9, sup:24.5, obez:28.9}, F:{sub:17.7, sup:24.7, obez:29.6} },
};
function categorieIMC(imc, an, sex){
  const p = IMC_PRAGURI[an] && IMC_PRAGURI[an][sex];
  if(!p || imc==null || isNaN(imc)) return null;
  if(imc < p.sub) return {eticheta:'Subponderal', clasa:'pill-blue'};
  if(imc < p.sup) return {eticheta:'Normal', clasa:'pill-ok'};
  if(imc < p.obez) return {eticheta:'Supraponderal', clasa:'pill-yellow'};
  return {eticheta:'Obez', clasa:'pill-danger'};
}
function findBaremForProba(probaNume){
  if(!probaNume) return null;
  const target = probaNume.trim().toLowerCase();
  return state.bareme.find(b=>b.nume.trim().toLowerCase()===target) || null;
}
// Întoarce nota calculată (10..4) sau null dacă nu există prag definit / rezultatul e sub baremul minim.
function calculeazaNota(barem, an, sex, valoareStr){
  if(!barem) return null;
  const v = parseFloat(String(valoareStr).replace(',','.'));
  if(isNaN(v)) return null;
  const praguri = barem.praguri[an] && barem.praguri[an][sex];
  if(!praguri) return null;
  const ordine = [9,8,7,6,5,4];
  const areCevaDefinit = ordine.some(n=>praguri[n]!=null);
  if(!areCevaDefinit) return null; // baremul nu are încă niciun prag completat
  if(barem.directie==='desc'){ // valoare mai mică = notă mai mare (ex: timp)
    if(praguri[9]!=null && v < praguri[9]) return 10;
    for(const n of ordine){ if(praguri[n]!=null && v <= praguri[n]) return n; }
  } else { // valoare mai mare = notă mai mare (ex: distanță, repetări)
    if(praguri[9]!=null && v > praguri[9]) return 10;
    for(const n of ordine){ if(praguri[n]!=null && v >= praguri[n]) return n; }
  }
  // rezultat mai slab decât toate pragurile definite -> nota minimă din barem (4), nu sub ea
  return 4;
}
// diferența dintre testul inițial și cel final, ca pastilă colorată (verde = progres, roșu = regres)
function calculeazaDiferentaHTML(valoareInitiala, valoareFinala, barem){
  const vI = valoareInitiala!=='' && valoareInitiala!=null ? parseFloat(String(valoareInitiala).replace(',','.')) : NaN;
  const vF = valoareFinala!=='' && valoareFinala!=null ? parseFloat(String(valoareFinala).replace(',','.')) : NaN;
  if(isNaN(vI) || isNaN(vF)) return '<span style="color:var(--muted);">—</span>';
  const diff = (barem && barem.directie==='asc') ? (vF - vI) : (vI - vF); // implicit: valoare mai mică (timp) = mai bine
  const bun = diff>0, rau = diff<0;
  const semn = diff>0 ? '+' : '';
  return `<span class="pill ${bun?'pill-ok':rau?'pill-danger':'pill-ghost'}">${semn}${diff.toFixed(2).replace('.',',')}</span>`;
}

      <table>
        <thead><tr><th>Nr.</th><th>Elev</th><th>Test inițial</th><th>Test final</th><th>Diferență</th></tr></thead>

          ${lista.map((e,idx)=>{
            const numarOrdine = `<td style="color:var(--muted); text-align:center;">${idx+1}</td>`;
            if(blocheazaNotarea(e)){
              return `<tr>${numarOrdine}<td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td><td colspan="3"><span class="exempt-note">Scutit medical</span></td></tr>`;
            }
            const numeCuTagPartial = `${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${scutirePartialaActiva(e)?`<span class="pill pill-blue" title="${escapeHtml(e.motivScutire||'')}" style="margin-left:4px; padding:1px 6px;">scutire parțială</span>`:''}`;
            const an = claseAn(e.claseId);
            const recInitial = state.note.find(n=>n.eleviId===e.id && n.probaId===ui.notareProba && n.moment==='initial');
            const recFinal = state.note.find(n=>n.eleviId===e.id && n.probaId===ui.notareProba && n.moment==='final');
            const notaInitial = barem ? calculeazaNota(barem, an, e.sex, recInitial ? recInitial.valoare : '') : null;
            const notaFinal = barem ? calculeazaNota(barem, an, e.sex, recFinal ? recFinal.valoare : '') : null;

            function celulaMoment(rec, nota, momentStr){
              return `<td style="padding:4px 6px;"><div style="display:flex; align-items:center; gap:5px; white-space:nowrap;">
                <input type="text" inputmode="decimal" class="grade-input" data-elev="${e.id}" data-sex="${e.sex}" data-an="${an}" data-moment="${momentStr}" value="${rec ? escapeHtml(rec.valoare) : ''}" placeholder="—" style="width:58px; min-height:32px; padding:4px 6px;"/>
                ${barem ? `<span class="pill pill-ok nota-calc" data-nota-for="${e.id}" data-moment-for="${momentStr}" style="padding:1px 6px;">${nota!=null?nota:'—'}</span>` : ''}
                ${rec ? `<button class="btn btn-ghost btn-sterge-nota" data-elev="${e.id}" data-moment="${momentStr}" title="Șterge" style="padding:3px 6px; min-height:28px;">${ICONS.trash}</button>` : ''}
              </div></td>`;
            }

            const diferentaHTML = calculeazaDiferentaHTML(recInitial ? recInitial.valoare : '', recFinal ? recFinal.valoare : '', barem);

            return `<tr>
              ${numarOrdine}
              <td class="student-name">${numeCuTagPartial}</td>
              ${celulaMoment(recInitial, notaInitial, 'initial')}
              ${celulaMoment(recFinal, notaFinal, 'final')}
              <td data-diff-for="${e.id}">${diferentaHTML}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <p class="tab-desc" style="margin-top:10px;">✓ Salvare automată — nu mai există buton de „Salvează”.</p>
    ` : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Nr.</th><th>Elev</th><th>${tipNotare==='calificativ' ? 'Calificativ' : 'Notă'}</th></tr></thead>
        <tbody>
          ${lista.map((e,idx)=>{
            const numarOrdine = `<td style="color:var(--muted); text-align:center;">${idx+1}</td>`;
            const existing = state.note.find(n=>n.eleviId===e.id && n.probaId===ui.notareProba && n.moment===moment);
            if(blocheazaNotarea(e)){
              return `<tr>${numarOrdine}<td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td><td><span class="exempt-note">Scutit medical</span></td></tr>`;
            }
            const numeCuTagPartial = `${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${scutirePartialaActiva(e)?`<span class="pill pill-blue" title="${escapeHtml(e.motivScutire||'')}" style="margin-left:4px; padding:1px 6px;">scutire parțială</span>`:''}`;
            if(tipNotare==='calificativ'){
              const valExist = existing ? existing.valoare : '';
              const notaExist = valExist ? notaDinCalificativ(valExist) : null;
              return `<tr>
                ${numarOrdine}
                <td class="student-name">${numeCuTagPartial}</td>
                <td><div style="display:flex; align-items:center; gap:8px;">
                  <select class="calificativ-input" data-elev="${e.id}">
                    <option value="">—</option>
                    ${CALIFICATIVE.map(c=>`<option value="${c.cod}" title="${escapeHtml(c.label)}" ${valExist===c.cod?'selected':''}>${c.cod}</option>`).join('')}
                  </select>
                  <span class="pill pill-ok nota-calc-calif" data-nota-for="${e.id}">${notaExist!=null?notaExist:'—'}</span>
                  ${existing ? `<button class="btn btn-ghost btn-sterge-nota" data-elev="${e.id}" title="Șterge nota" style="padding:6px 10px; min-height:34px;">${ICONS.trash}</button>` : ''}
                </div></td>
              </tr>`;
            }
            return `<tr>
              ${numarOrdine}
              <td class="student-name">${numeCuTagPartial}</td>
              <td><div style="display:flex; align-items:center; gap:8px;">
                <input type="text" inputmode="decimal" class="grade-input" data-elev="${e.id}" value="${existing ? escapeHtml(existing.valoare) : ''}" placeholder="—"/>
                ${existing ? `<button class="btn btn-ghost btn-sterge-nota" data-elev="${e.id}" title="Șterge nota" style="padding:6px 10px; min-height:34px;">${ICONS.trash}</button>` : ''}
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <p class="tab-desc" style="margin-top:10px;">✓ Salvare automată — nu mai există buton de „Salvează”.</p>
    `}
  `;
  document.getElementById('select-notare-clasa').addEventListener('change', e=>{ ui.notareClasa = e.target.value; ui.notareProba = null; render(); });
  const selProba = document.getElementById('select-notare-proba');
  if(selProba) selProba.addEventListener('change', e=>{ ui.notareProba = e.target.value; render(); });
  const selMoment = document.getElementById('select-notare-moment');
  if(selMoment) selMoment.addEventListener('change', e=>{ ui.notareMoment = e.target.value; render(); });
  const btnJump = document.getElementById('btn-jump-barem');
  if(btnJump) btnJump.addEventListener('click', ()=>{
    const nb = baremNou(probaSelectata.nume, 'desc');
    state.bareme.push(nb);
    ui.baremeSelectat = nb.id;
    saveState();
    currentTab = 'bareme'; render();
  });
  // notă directă / barem: salvare automată pe fiecare tastă + actualizare live a pastilei cu nota (fără să redesenăm tot tabelul, ca să nu pierdem focusul din câmp)
  main.querySelectorAll('.grade-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const val = inp.value.trim();
      const momentCurent = inp.dataset.moment || moment;
      const notaCalc = barem ? calculeazaNota(barem, inp.dataset.an, inp.dataset.sex, val) : null;
      if(barem){
        const cell = afisareDubla
          ? main.querySelector(`.nota-calc[data-nota-for="${inp.dataset.elev}"][data-moment-for="${momentCurent}"]`)
          : main.querySelector(`.nota-calc[data-nota-for="${inp.dataset.elev}"]`);
        if(cell) cell.textContent = notaCalc!=null ? notaCalc : '—';
      }
      upsertNota(inp.dataset.elev, momentCurent, val, notaCalc);
      if(afisareDubla){
        // recalculăm live pastila de Diferență, fără să redesenăm tabelul (ca să nu pierdem focusul)
        const rândCurent = inp.closest('tr');
        const inputInitial = rândCurent.querySelector('.grade-input[data-moment="initial"]');
        const inputFinal = rândCurent.querySelector('.grade-input[data-moment="final"]');
        const diffCell = rândCurent.querySelector(`[data-diff-for="${inp.dataset.elev}"]`);
        if(diffCell && inputInitial && inputFinal){
          diffCell.innerHTML = calculeazaDiferentaHTML(inputInitial.value.trim(), inputFinal.value.trim(), barem);
        }
      }
    });
  });
  // calificativ: salvare automată la fiecare selecție
  if(tipNotare==='calificativ'){
    main.querySelectorAll('.calificativ-input').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const val = sel.value;
        const notaCalc = val ? notaDinCalificativ(val) : null;
        const cell = main.querySelector(`.nota-calc-calif[data-nota-for="${sel.dataset.elev}"]`);
        if(cell) cell.textContent = notaCalc!=null ? notaCalc : '—';
        upsertNota(sel.dataset.elev, moment, val, notaCalc);
        render();
      });
    });
  }
  // notă directă simplă (fără barem, fără calificativ) foloseste deja listener-ul general de mai sus
  // Enter -> trece la câmpul următor, ca într-un tabel Excel
  const campuriNotare = Array.from(main.querySelectorAll('.grade-input[data-elev]'));
  campuriNotare.forEach((inp, idx)=>{
    inp.addEventListener('keydown', (ev)=>{
      if(ev.key==='Enter'){
        ev.preventDefault();
        const urmator = campuriNotare[idx+1];
        if(urmator){ urmator.focus(); urmator.select(); }
        else{ inp.blur(); render(); }
      }
    });
  });
  // Ștergere rapidă a unei note deja salvate, dintr-un click
  main.querySelectorAll('.btn-sterge-nota').forEach(b=>{
    b.addEventListener('click', ()=>{
      const eleviId = b.dataset.elev;
      const momentDeSters = b.dataset.moment || moment;
      if(!confirm('Ștergi nota salvată pentru acest elev, la această probă?')) return;
      state.note = state.note.filter(n=>!(n.eleviId===eleviId && n.probaId===ui.notareProba && n.moment===momentDeSters));
      saveState(); render(); showToast('Notă ștearsă.');
    });
  });
}

/* ================= TAB: ABSENȚE ================= */
const OBSERVATII_PREDEFINITE = [
  'A întârziat la oră',
  'Nu s-a prezentat la oră în echipament sportiv',
  'Nu participă la ore din motive medicale',
  'Refuză participarea la oră',
  'Nu respectă sarcinile date de profesor',
];
function labelStare(stare){
  if(stare==='motivat') return 'absent motivat';
  if(stare==='nemotivat') return 'absent nemotivat';
  return 'prezent';
}
function starePillHTML(stare){
  if(stare==='motivat') return '<span class="pill pill-yellow">Absent motivat</span>';
  if(stare==='nemotivat') return '<span class="pill pill-danger">Absent nemotivat</span>';
  return '<span class="pill pill-ok">Prezent</span>';
}
function toateObservatiile(){
  return [...OBSERVATII_PREDEFINITE, ...state.observatiiCustom];
}
// pastila cu totalul de absențe; apăsată/atinsă, arată lista de date dedesubt
function totalBadgeHTML(eleviId){
  const inregistrari = state.absente.filter(a=>a.eleviId===eleviId && a.stare!=='prezent').sort((a,b)=>a.data.localeCompare(b.data));
  const total = inregistrari.length;
  if(total===0) return '<span class="pill pill-ok">0</span>';
  const listaDate = inregistrari.map(a=>`${formatDataRo(a.data)} — ${labelStare(a.stare)}`).join('<br>');
  return `<span class="pill pill-danger total-abs-badge" data-elev="${eleviId}" style="cursor:pointer;" title="Atinge pentru date">${total}</span>
          <div class="total-abs-list" data-elev="${eleviId}" style="display:none; margin-top:6px; font-size:12px; color:var(--muted); text-align:left; white-space:nowrap;">${listaDate}</div>`;
}
function renderAbsente(main){
  if(claseActive().length===0){
    main.innerHTML = `<h2>Absențe</h2>` + emptyState('Nu ai nicio clasă.', 'Adaugă mai întâi o clasă în tabul „Clase”.');
    return;
  }
  if(!ui.absenteClasa || !claseActive().find(c=>c.id===ui.absenteClasa)) ui.absenteClasa = claseActive()[0].id;
  const lista = eleviDinClasa(ui.absenteClasa);

  main.innerHTML = `
    <h2>Absențe</h2>
    <p class="tab-desc">Bifează rapid absențele. Alege o observație din listă (sau scrie una proprie). Se salvează automat, imediat.</p>
    ${bannerPracticaHTML(ui.absenteClasa)}
    <div class="row" style="margin-bottom:16px;">
      <div class="field">
        <label>Clasă</label>
        <select id="select-absente-clasa">
          ${claseActive().map(c=>`<option value="${c.id}" ${c.id===ui.absenteClasa?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Data orei</label>
        <input type="date" id="input-absente-data" value="${ui.absenteData}"/>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:700; color:var(--infield); margin-bottom:8px;">Lista de observații</div>
      <div class="row" style="margin-bottom:10px;">
        <div class="field" style="flex:1; min-width:220px;">
          <label>Observație nouă</label>
          <input type="text" id="input-observatie-noua" placeholder="ex: A plecat fără voie de la oră"/>
        </div>
        <button class="btn btn-secondary" id="btn-add-observatie">+ Adaugă la listă</button>
      </div>
      ${state.observatiiCustom.length ? `
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          ${state.observatiiCustom.map((o,idx)=>`
            <span class="pill pill-yellow" style="display:flex; align-items:center; gap:6px;">
              ${escapeHtml(o)}
              <button data-del-observatie="${idx}" style="border:none; background:transparent; cursor:pointer; color:#8A5A16; font-weight:700; padding:0;">✕</button>
            </span>
          `).join('')}
        </div>
      ` : `<div class="tab-desc" style="margin:0;">Nicio observație proprie adăugată încă — cele 5 de bază sunt mereu disponibile.</div>`}
    </div>

    ${lista.length===0 ? emptyState('Niciun elev în această clasă.', 'Adaugă elevi în tabul „Elevi”.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Nr.</th><th>Elev</th><th>Stare</th><th>Absent</th><th>Motivat</th><th>Observație</th><th>Total absențe</th></tr></thead>
        <tbody>
          ${lista.map((e,idx)=>{
            const rec = state.absente.find(a=>a.eleviId===e.id && a.data===ui.absenteData);
            const stare = rec ? rec.stare : 'prezent';
            const esteAbsent = stare!=='prezent';
            const esteMotivat = stare==='motivat';
            const nota = rec ? (rec.nota || '') : '';
            const esteCustom = nota && !toateObservatiile().includes(nota);
            const total = state.absente.filter(a=>a.eleviId===e.id && a.stare!=='prezent').length;
            return `<tr data-row-elev="${e.id}">
              <td style="color:var(--muted); text-align:center;">${idx+1}</td>
              <td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${esteScutitActiv(e)?'<span class=\"pill pill-yellow\" style=\"margin-left:6px;\">scutit</span>':''}</td>
              <td class="stare-badge-cell">${starePillHTML(stare)}</td>
              <td style="text-align:center;">
                <input type="checkbox" class="chk-absent" data-elev="${e.id}" ${esteAbsent?'checked':''} style="width:22px; height:22px; cursor:pointer;"/>
              </td>
              <td style="text-align:center;">
                <input type="checkbox" class="chk-motivat" data-elev="${e.id}" ${esteMotivat?'checked':''} ${esteAbsent?'':'disabled'} style="width:22px; height:22px; cursor:pointer;"/>
              </td>
              <td style="max-width:150px;">
                <select class="select-observatie" data-elev="${e.id}" style="max-width:150px;">
                  <option value="">— fără observație —</option>
                  ${toateObservatiile().map(o=>`<option value="${escapeHtml(o)}" ${nota===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
                  <option value="__custom__" ${esteCustom?'selected':''}>Altă observație...</option>
                </select>
                <input type="text" class="input-observatie-custom" data-elev="${e.id}" value="${esteCustom?escapeHtml(nota):''}"
                  style="width:100%; max-width:150px; margin-top:5px; display:${esteCustom?'block':'none'};" placeholder="scrie observația ta"/>
              </td>
              <td>${totalBadgeHTML(e.id)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    `}
  `;
  document.getElementById('select-absente-clasa').addEventListener('change', e=>{ ui.absenteClasa = e.target.value; render(); });
  main.addEventListener('click', (ev)=>{
    const badge = ev.target.closest('.total-abs-badge');
    if(!badge) return;
    const lista = main.querySelector(`.total-abs-list[data-elev="${badge.dataset.elev}"]`);
    if(lista) lista.style.display = lista.style.display==='none' ? 'block' : 'none';
  });
  document.getElementById('input-absente-data').addEventListener('change', e=>{ ui.absenteData = e.target.value; render(); });

  document.getElementById('btn-add-observatie').addEventListener('click', ()=>{
    const inp = document.getElementById('input-observatie-noua');
    const text = inp.value.trim();
    if(!text) return showToast('Scrie observația mai întâi.');
    if(toateObservatiile().some(o=>o.toLowerCase()===text.toLowerCase())) return showToast('Există deja în listă.');
    state.observatiiCustom.push(text);
    saveState(); render(); showToast('Observație adăugată la listă.');
  });
  main.querySelectorAll('[data-del-observatie]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = parseInt(b.dataset.delObservatie, 10);
      if(!confirm('Ștergi această observație din listă? (nu afectează observațiile deja salvate la elevi)')) return;
      state.observatiiCustom.splice(idx,1);
      saveState(); render(); showToast('Observație ștearsă din listă.');
    });
  });

  function upsertAbsenta(eleviId, patch){
    let rec = state.absente.find(a=>a.eleviId===eleviId && a.data===ui.absenteData);
    if(!rec){
      rec = {id:uid(), eleviId, claseId:ui.absenteClasa, data:ui.absenteData, stare:'prezent', nota:''};
      state.absente.push(rec);
    }
    Object.assign(rec, patch);
    if(rec.stare==='prezent' && !rec.nota){
      state.absente = state.absente.filter(a=>a!==rec);
    }
    saveState();
  }

  main.querySelectorAll('.chk-absent').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const eleviId = chk.dataset.elev;
      const row = main.querySelector(`tr[data-row-elev="${eleviId}"]`);
      const chkMotivat = row.querySelector('.chk-motivat');
      let stareNoua;
      if(chk.checked){
        chkMotivat.disabled = false;
        stareNoua = chkMotivat.checked ? 'motivat' : 'nemotivat';
      } else {
        chkMotivat.checked = false;
        chkMotivat.disabled = true;
        stareNoua = 'prezent';
      }
      upsertAbsenta(eleviId, {stare: stareNoua});
      row.children[2].innerHTML = starePillHTML(stareNoua);
      row.children[6].innerHTML = totalBadgeHTML(eleviId);
    });
  });
  main.querySelectorAll('.chk-motivat').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const eleviId = chk.dataset.elev;
      const stareNoua = chk.checked ? 'motivat' : 'nemotivat';
      upsertAbsenta(eleviId, {stare: stareNoua});
      const row = main.querySelector(`tr[data-row-elev="${eleviId}"]`);
      row.children[2].innerHTML = starePillHTML(stareNoua);
      row.children[6].innerHTML = totalBadgeHTML(eleviId);
    });
  });
  main.querySelectorAll('.select-observatie').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const eleviId = sel.dataset.elev;
      const row = main.querySelector(`tr[data-row-elev="${eleviId}"]`);
      const customInput = row.querySelector('.input-observatie-custom');
      if(sel.value==='__custom__'){
        customInput.style.display = 'block';
        customInput.focus();
        upsertAbsenta(eleviId, {nota: customInput.value.trim()});
      } else {
        customInput.style.display = 'none';
        customInput.value = '';
        upsertAbsenta(eleviId, {nota: sel.value});
      }
    });
  });
  main.querySelectorAll('.input-observatie-custom').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      upsertAbsenta(inp.dataset.elev, {nota: inp.value.trim()});
    });
  });
}

/* ================= TAB: ISTORIC ELEV ================= */
function renderIstoric(main){

      const inregistrari = state.absente.filter(a=>a.eleviId===elev.id).sort((a,b)=>a.data.localeCompare(b.data));
      const totalMotivate = inregistrari.filter(a=>a.stare==='motivat').length;
      const totalNemotivate = inregistrari.filter(a=>a.stare==='nemotivat').length;
      let cumulat = 0;
      const randuri = inregistrari.map(a=>{
        if(a.stare!=='prezent') cumulat++;
        return `<tr data-istoric-id="${a.id}">
          <td>${formatDataRo(a.data)}</td>
          <td>
            <select class="istoric-stare" data-id="${a.id}">
              <option value="prezent" ${a.stare==='prezent'?'selected':''}>prezent</option>
              <option value="motivat" ${a.stare==='motivat'?'selected':''}>absent motivat</option>
              <option value="nemotivat" ${a.stare==='nemotivat'?'selected':''}>absent nemotivat</option>
            </select>
          </td>
          <td><input type="text" class="istoric-observatie" data-id="${a.id}" value="${escapeHtml(a.nota||'')}" placeholder="—" style="min-width:200px;"/></td>
          <td><strong>${cumulat}</strong></td>
          <td><button class="btn btn-danger" data-del-istoric="${a.id}">${ICONS.trash}</button></td>
        </tr>`;
      }).join('');
      return `
        <div class="row" style="margin-bottom:16px; gap:10px;">
          <span class="pill pill-yellow">Motivate: ${totalMotivate}</span>
          <span class="pill pill-danger">Nemotivate: ${totalNemotivate}</span>
          <span class="pill pill-ok">Total absențe: ${totalMotivate+totalNemotivate}</span>
          ${esteScutitActiv(elev) ? scutirePillHTML(elev) : ''}
        </div>
        ${inregistrari.length===0 ? emptyState('Niciun eveniment înregistrat.', 'Absențele și observațiile pentru acest elev vor apărea aici, pe măsură ce le adaugi în tabul „Absențe”.') : `
        <p class="tab-desc" style="margin-top:-6px;">Poți corecta direct aici starea sau observația unei zile trecute, sau șterge complet o înregistrare greșită.</p>
        <div class="card" style="padding:0; overflow-x:auto;">
          <table>
            <thead><tr><th>Data</th><th>Stare</th><th>Observație</th><th>Total absențe până la această dată</th><th></th></tr></thead>
            <tbody>${randuri}</tbody>
          </table>
        </div>`}
      `;
    })()}
  `;
  document.getElementById('select-istoric-clasa').addEventListener('change', e=>{
    ui.istoricClasa = e.target.value; ui.istoricElev = null; render();
  });
  const selElev = document.getElementById('select-istoric-elev');
  if(selElev) selElev.addEventListener('change', e=>{ ui.istoricElev = e.target.value; render(); });

  main.querySelectorAll('.istoric-stare').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const rec = state.absente.find(a=>a.id===sel.dataset.id);
      if(!rec) return;
      if(sel.value==='prezent' && !rec.nota){
        // fără observație și fără absență -> înregistrarea nu mai are rost, o ștergem
        state.absente = state.absente.filter(a=>a.id!==rec.id);
      } else {
        rec.stare = sel.value;
      }
      saveState(); render(); showToast('Actualizat.');
    });
  });
  main.querySelectorAll('.istoric-observatie').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const rec = state.absente.find(a=>a.id===inp.dataset.id);
      if(!rec) return;
      const val = inp.value.trim();
      if(rec.stare==='prezent' && !val){
        state.absente = state.absente.filter(a=>a.id!==rec.id);
      } else {
        rec.nota = val;
      }
      saveState(); render(); showToast('Actualizat.');
    });
  });
  main.querySelectorAll('[data-del-istoric]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('Ștergi complet această înregistrare (absență/observație)?')) return;
      state.absente = state.absente.filter(a=>a.id!==b.dataset.delIstoric);
      saveState(); render(); showToast('Înregistrare ștearsă.');
    });
  });
  const btnRaportElev = document.getElementById('btn-raport-elev');
  if(btnRaportElev) btnRaportElev.addEventListener('click', ()=>genereazaRaportElev(elev.id));
}

/* ================= RAPORT INDIVIDUAL PE ELEV (printabil) ================= */
function genereazaRaportElev(eleviId){
  const e = state.elevi.find(el=>el.id===eleviId);
  if(!e) return;
  const clasa = state.clase.find(c=>c.id===e.claseId);
  const probeElev = state.probe.filter(p=>probaSeAplicaClasei(p, e.claseId)).sort((a,b)=>a.data.localeCompare(b.data));

  const randuriNote = probeElev.map(p=>{
    const rec = notaPentruSinteza(e.id, p.id);
    if(!rec) return `<tr><td>${escapeHtml(p.nume)}</td><td>—</td><td>—</td><td>—</td></tr>`;
    const eticheta = rec.moment==='final' ? 'Finală' : 'Inițială';
    return `<tr>
      <td>${escapeHtml(p.nume)}</td>
      <td>${eticheta}</td>
      <td>${escapeHtml(String(rec.valoare))}</td>
      <td>${rec.notaCalculata!=null ? rec.notaCalculata : '—'}</td>
    </tr>`;
  }).join('');

  const inregistrari = state.absente.filter(a=>a.eleviId===e.id).sort((a,b)=>a.data.localeCompare(b.data));
  const totalMotivate = inregistrari.filter(a=>a.stare==='motivat').length;
  const totalNemotivate = inregistrari.filter(a=>a.stare==='nemotivat').length;
  const randuriAbsente = inregistrari.map(a=>`<tr>
    <td>${formatDataRo(a.data)}</td>
    <td>${labelStare(a.stare)}</td>
    <td>${escapeHtml(a.nota || '—')}</td>
  </tr>`).join('');

  const imc = (e.inaltime && e.greutate) ? (e.greutate / ((e.inaltime/100)*(e.inaltime/100))).toFixed(1) : '—';
  const catIMC = imc!=='—' ? categorieIMC(parseFloat(imc), claseAn(e.claseId), e.sex) : null;

  const html = `<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8">
<title>Raport ${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} — Catalog EFS</title>
<style>
  body{font-family: Arial, sans-serif; color:#1a1a1a; padding:24px; max-width:900px; margin:0 auto;}
  h1{font-size:22px; margin-bottom:2px;}
  .sub{color:#555; margin-bottom:24px; font-size:13px;}
  .info{display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; margin-bottom:20px; font-size:14px;}
  .info b{color:#22402C;}
  h2{font-size:16px; margin-top:28px; border-bottom:2px solid #22402C; padding-bottom:4px; color:#22402C;}
  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
  th,td{border:1px solid #ccc; padding:6px 8px; text-align:left;}
  th{background:#f0efe9;}
  .btn-print{
    position:fixed; top:16px; right:16px; background:#C1440E; color:#fff; border:none;
    padding:10px 18px; border-radius:6px; font-weight:700; cursor:pointer; font-size:14px;
  }
  @media print{ .btn-print{ display:none; } body{ padding:0; } }
</style>
</head>
<body>
  <button class="btn-print" onclick="window.print()">🖨 Printează / Salvează PDF</button>
  <h1>Raport individual — ${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</h1>
  <div class="sub">Generat la ${formatDataRo(todayISO())}, ora ${new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}</div>

  <div class="info">
    <div><b>Cod unic:</b> ${escapeHtml(e.codUnic||'—')}</div>
    <div><b>Clasă:</b> ${escapeHtml(clasa ? clasa.nume : '—')}</div>
    <div><b>Sex:</b> ${e.sex==='M'?'Băiat':'Fată'}</div>
    <div><b>Data nașterii:</b> ${e.dataNasterii ? formatDataRo(e.dataNasterii) : '—'}</div>
    <div><b>Înălțime / Greutate:</b> ${e.inaltime||'—'} cm / ${e.greutate||'—'} kg</div>
    <div><b>IMC:</b> ${imc}${catIMC ? ' — '+catIMC.eticheta : ''}</div>
    <div><b>Scutire medicală:</b> ${esteScutitActiv(e) ? (e.scutireTip==='partiala' ? 'Parțială' : e.scutireTip==='temporara' ? 'Temporară' : 'Totală anuală') : 'Nu'}</div>
  </div>

  <h2>Note pe probe</h2>
  ${probeElev.length===0 ? '<p>Nicio probă înregistrată pentru clasa acestui elev.</p>' : `
  <table>
    <thead><tr><th>Probă</th><th>Moment</th><th>Rezultat</th><th>Notă</th></tr></thead>
    <tbody>${randuriNote}</tbody>
  </table>`}

  <h2>Absențe și observații (Motivate: ${totalMotivate} · Nemotivate: ${totalNemotivate})</h2>
  ${inregistrari.length===0 ? '<p>Niciun eveniment înregistrat.</p>' : `
  <table>
    <thead><tr><th>Data</th><th>Stare</th><th>Observație</th></tr></thead>
    <tbody>${randuriAbsente}</tbody>
  </table>`}
</body></html>`;

  const w = window.open('', '_blank');
  if(!w){ showToast('Permite ferestrele pop-up ca să vezi raportul.'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

/* ================= TAB: PRACTICĂ COMASATĂ ================= */
function renderPractica(main){
  if(claseActive().length===0){
    main.innerHTML = `<h2>Practică comasată</h2>` + emptyState('Nu ai nicio clasă.', 'Adaugă mai întâi o clasă în tabul „Clase”.');
    return;
  }
  if(!ui.practicaClasa || !claseActive().find(c=>c.id===ui.practicaClasa)) ui.practicaClasa = claseActive()[0].id;
  const clasa = claseActive().find(c=>c.id===ui.practicaClasa);
  const perioade = [...(clasa.practica||[])].sort((a,b)=>a.start.localeCompare(b.start));
  const azi = todayISO();

  main.innerHTML = `
    <h2>Practică comasată</h2>
    <p class="tab-desc">Trece perioadele în care clasa e la agenți economici, nu la școală. O clasă poate avea mai multe perioade în an — le adaugi pe rând mai jos.</p>
    <div class="row" style="margin-bottom:16px;">
      <div class="field">
        <label>Clasă</label>
        <select id="select-practica-clasa">
          ${claseActive().map(c=>`<option value="${c.id}" ${c.id===ui.practicaClasa?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div class="field">
          <label>De la</label>
          <input type="date" id="input-practica-start" value="${todayISO()}"/>
        </div>
        <div class="field">
          <label>Până la</label>
          <input type="date" id="input-practica-end" value="${todayISO()}"/>
        </div>
        <div class="field" style="flex:1; min-width:200px;">
          <label>Motiv / agent economic (opțional)</label>
          <input type="text" id="input-practica-motiv" placeholder="ex: SC Exemplu SRL"/>
        </div>
        <button class="btn btn-primary" id="btn-add-practica">+ Adaugă perioadă</button>
      </div>
    </div>

    ${perioade.length===0 ? emptyState('Nicio perioadă de practică pentru această clasă.', 'Adaugă una mai sus.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>De la</th><th>Până la</th><th>Motiv</th><th>Stare</th><th></th></tr></thead>
        <tbody>
          ${perioade.map(p=>{
            let stare;
            if(azi<p.start) stare = '<span class="pill pill-blue">urmează</span>';
            else if(azi>p.end) stare = '<span class="pill pill-ghost">încheiată</span>';
            else stare = '<span class="pill pill-yellow">activă acum</span>';
            return `<tr>
              <td>${formatDataRo(p.start)}</td>
              <td>${formatDataRo(p.end)}</td>
              <td>${escapeHtml(p.nume) || '—'}</td>
              <td>${stare}</td>
              <td><button class="btn btn-danger" data-del-practica="${p.id}">${ICONS.trash}</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`}
  `;
  document.getElementById('select-practica-clasa').addEventListener('change', e=>{
    ui.practicaClasa = e.target.value; render();
  });
  document.getElementById('btn-add-practica').addEventListener('click', ()=>{
    const start = document.getElementById('input-practica-start').value;
    const end = document.getElementById('input-practica-end').value;
    const nume = document.getElementById('input-practica-motiv').value.trim();
    if(!start || !end) return showToast('Completează ambele date.');
    if(end<start) return showToast('Data „până la” nu poate fi înainte de „de la”.');
    clasa.practica.push({id:uid(), start, end, nume});
    saveState(); render(); showToast('Perioadă adăugată.');
  });
  main.querySelectorAll('[data-del-practica]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('Ștergi această perioadă de practică?')) return;
      clasa.practica = clasa.practica.filter(p=>p.id!==b.dataset.delPractica);
      saveState(); render(); showToast('Perioadă ștearsă.');
    });
  });
}

    ui.scutiriClasa = claseActive().length ? claseActive()[0].id : null;
  }
  if(!ui.scutireTipNou) ui.scutireTipNou = 'totala_anuala';
  const eleviNescutitiClasa = ui.scutiriClasa ? eleviDinClasa(ui.scutiriClasa).filter(e=>!(e.scutit && e.scutireTip)) : [];
  main.innerHTML = `
    <h2>Scutiri medicale</h2>

            ${claseActive().length===0 ? '<option>Nicio clasă</option>' :
              claseActive().map(c=>`<option value="${c.id}" ${c.id===ui.scutiriClasa?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:220px;">

          <select id="select-scutire-elev" ${eleviNescutitiClasa.length===0?'disabled':''}>
            <option value="">${eleviNescutitiClasa.length===0 ? 'Niciun elev disponibil' : 'Alege un elev...'}</option>
            ${eleviNescutitiClasa.map(e=>`<option value="${e.id}">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:200px;">
          <label>Fel de scutire</label>
          <select id="select-scutire-tip">
            <option value="totala_anuala" ${ui.scutireTipNou==='totala_anuala'?'selected':''}>Totală anuală</option>
            <option value="partiala" ${ui.scutireTipNou==='partiala'?'selected':''}>Parțială</option>
            <option value="temporara" ${ui.scutireTipNou==='temporara'?'selected':''}>Temporară</option>
          </select>
        </div>
      </div>
      ${ui.scutireTipNou==='temporara' ? `
      <div class="row" style="margin-top:10px;">
        <div class="field" style="min-width:160px;">
          <label>Fel (în perioada temporară)</label>
          <select id="select-scutire-subtip">
            <option value="totala">Totală</option>
            <option value="partiala">Parțială</option>
          </select>
        </div>
        <div class="field">
          <label>De la</label>
          <input type="date" id="input-scutire-start" value="${todayISO()}"/>
        </div>
        <div class="field">
          <label>Până la</label>
          <input type="date" id="input-scutire-end" value="${todayISO()}"/>
        </div>
      </div>
      ` : ''}
      <div class="row" style="margin-top:10px;">
        <div class="field" style="flex:1; min-width:220px;">
          <label>Motiv scutire</label>
          <input type="text" id="input-scutire-motiv" placeholder="ex: scutire medicală pe semestrul I"/>
        </div>
        <button class="btn btn-primary" id="btn-add-scutire">+ Marchează scutit</button>
      </div>
    </div>
    ${scutiti.length===0 ? emptyState('Niciun elev scutit momentan.', 'Adaugă o scutire folosind formularul de mai sus.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Elev</th><th>Clasă</th><th>Fel</th><th>Motiv</th><th></th></tr></thead>
        <tbody>
          ${scutiti.map(e=>`
            <tr>
              <td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td>
              <td>${escapeHtml(claseNume(e.claseId))}</td>
              <td>${scutirePillHTML(e)}</td>
              <td>${escapeHtml(e.motivScutire) || '—'}</td>
              <td><button class="btn btn-ghost" data-unscutire="${e.id}">Anulează scutirea</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`}
  `;
  document.getElementById('select-scutire-clasa').addEventListener('change', e=>{
    ui.scutiriClasa = e.target.value; render();
  });
  document.getElementById('select-scutire-tip').addEventListener('change', e=>{
    ui.scutireTipNou = e.target.value; render();
  });
  document.getElementById('btn-add-scutire').addEventListener('click', ()=>{
    const id = document.getElementById('select-scutire-elev').value;
    const motiv = document.getElementById('input-scutire-motiv').value.trim();
    const tip = ui.scutireTipNou;
    if(!id) return showToast('Alege un elev.');
    const e = state.elevi.find(e=>e.id===id);
    e.scutit = true;
    e.scutireTip = tip;
    e.motivScutire = motiv;
    if(tip==='temporara'){
      const subTip = document.getElementById('select-scutire-subtip').value;
      const start = document.getElementById('input-scutire-start').value;
      const end = document.getElementById('input-scutire-end').value;
      if(!start || !end) return showToast('Completează perioada (de la - până la).');
      if(end<start) return showToast('Data „până la” nu poate fi înainte de „de la”.');
      e.scutireSubTip = subTip; e.scutireStart = start; e.scutireEnd = end;
    } else {
      e.scutireSubTip = null; e.scutireStart = null; e.scutireEnd = null;
    }
    saveState(); render(); showToast('Scutire înregistrată.');
  });
  main.querySelectorAll('[data-unscutire]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const e = state.elevi.find(e=>e.id===b.dataset.unscutire);
      e.scutit = false; e.motivScutire = ''; e.scutireTip = null; e.scutireSubTip = null; e.scutireStart = null; e.scutireEnd = null;
      saveState(); render(); showToast('Scutire anulată.');
    });
  });
}

          <button class="btn btn-secondary" id="modal-import-btn">⭱ Importă backup</button>
          <input type="file" id="modal-import-input" accept="application/json" style="display:none;"/>
        </div>
      </div>

      <div class="row" style="justify-content:space-between; margin-top:6px;">
        <button class="btn btn-danger" id="modal-reset">Golește toate datele</button>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" id="modal-cancel">Renunță</button>
          <button class="btn btn-primary" id="modal-save">Salvează</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('modal-cancel').addEventListener('click', ()=>backdrop.remove());

  document.getElementById('modal-save').addEventListener('click', ()=>{

    if(!confirm('Sigur ștergi toate datele (clase, elevi, note, absențe, probe, bareme)? Nu se poate anula.')) return;
    state = { settings:{titlu:state.settings.titlu}, clase:[], elevi:[], probe:[], note:[], absente:[], bareme:[] };
    saveState(); backdrop.remove(); render(); showToast('Toate datele au fost șterse.');
  });
  document.getElementById('modal-export').addEventListener('click', ()=>{
    exportBackup();
    showToast('Backup descărcat.');
  });
  const importInput = document.getElementById('modal-import-input');
  document.getElementById('modal-import-btn').addEventListener('click', ()=> importInput.click());
  importInput.addEventListener('change', ()=>{
    const file = importInput.files[0];
    if(!file) return;
    if(!confirm('Importarea unui backup înlocuiește TOATE datele curente de pe acest dispozitiv cu cele din fișier. Continui?')) return;
    importBackupFile(file, (ok)=>{
      if(ok){ backdrop.remove(); render(); showToast('Backup importat cu succes.'); }
      else{ showToast('Fișierul nu pare un backup valid.'); }
    });
  });
}

/* ---------------- UI HELPERS ---------------- */
function emptyState(title, sub){
  return `<div class="empty"><div class="display">${escapeHtml(title)}</div><div>${escapeHtml(sub)}</div></div>`;
}

/* ---------------- BOOT ---------------- */
(async function init(){
  await loadState();
  render();
})();

// Activează modul offline real (PWA): odată încărcată o dată cu internet,
// aplicația rămâne disponibilă chiar și fără semnal, oricât timp ar trece.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{
      // dacă nu există încă fișierul pe server, aplicația funcționează normal, doar fără cache offline garantat
    });
  });
}
</script>
</body>
</html>
