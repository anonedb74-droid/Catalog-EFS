<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Catalog EFS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22402C">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --track:#C1440E;
    --track-dark:#9A350A;
    --infield:#22402C;
    --infield-dark:#182E20;
    --chalk:#F6F4EE;
    --card:#FFFFFF;
    --ink:#1E211D;
    --muted:#6E7268;
    --border:#E2DECF;
    --yellow:#E3A23C;
    --danger:#B23A32;
    --ok:#3D7A4E;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--chalk);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',system-ui,sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  /* ---------- HEADER ---------- */
  header{
    background:var(--infield);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    flex-shrink:0;
    border-bottom:4px solid var(--track);
  }
  header .title{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:22px;
    color:#fff;
  }
  header .subtitle{
    font-size:13px;
    color:#C9D6C7;
    font-family:'Inter',sans-serif;
    text-transform:none;
    letter-spacing:0;
  }
  header .date{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    color:#E3D9C4;
    text-transform:capitalize;
  }
  /* ---------- LAYOUT ---------- */
  .body-wrap{
    flex:1;
    display:flex;
    overflow:hidden;
  }
  nav.sidebar{
    width:190px;
    background:var(--infield-dark);
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    padding:10px 0;
    overflow-y:auto;
  }
  nav.sidebar button{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    border:none;
    background:transparent;
    color:#CFE0CC;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    padding:14px 18px;
    cursor:pointer;
    text-align:left;
    border-left:4px solid transparent;
  }
  nav.sidebar button svg{flex-shrink:0;width:20px;height:20px;}
  nav.sidebar button.active{
    background:var(--infield);
    color:#fff;
    border-left:4px solid var(--track);
  }
  nav.sidebar button:not(.active):hover{
    background:rgba(255,255,255,0.06);
  }
  main{
    flex:1;
    overflow-y:auto;
    padding:22px 26px 80px;
  }
  main h2{
    font-size:22px;
    margin:0 0 4px;
    color:var(--infield);
  }
  .tab-desc{
    color:var(--muted);
    font-size:14px;
    margin:0 0 20px;
  }
  /* ---------- BOTTOM TAB BAR (narrow screens) ---------- */
  nav.bottombar{
    display:none;
  }
  @media (max-width:760px){
    nav.sidebar{display:none;}
    .body-wrap{flex-direction:column;}
    main{padding:16px 14px 90px;}
    nav.bottombar{
      display:flex;
      position:fixed;
      bottom:0; left:0; right:0;
      background:var(--infield-dark);
      border-top:3px solid var(--track);
      z-index:20;
    }
    nav.bottombar button{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:3px;
      background:transparent;
      border:none;
      color:#CFE0CC;
      font-size:10px;
      font-weight:600;
      padding:8px 2px 10px;
    }
    nav.bottombar button svg{width:19px;height:19px;}
    nav.bottombar button.active{color:#fff;}
    nav.bottombar button.active svg{stroke:var(--track);}
  }
  /* ---------- MOD COMPACT PE ECRAN ÎN PORTRET (tabletă) — mai mulți elevi vizibili pe pagină ---------- */
  @media (orientation: portrait){
    header{padding:8px 14px;}
    header h1{font-size:17px;}
    header .subtitle{display:none;}
    header .date{display:none;}
    main{padding:10px 12px 80px;}
    main h2{font-size:17px; margin-bottom:2px;}
    .tab-desc{font-size:12px; margin-bottom:10px;}
    .card{padding:10px; margin-bottom:10px;}
    .row{gap:6px;}
    input[type=text], input[type=date], input[type=number], select{
      min-height:36px; padding:7px 9px; font-size:14px;
    }
    button.btn{min-height:36px; padding:8px 12px; font-size:13px;}
    table th{padding:5px 6px; font-size:11px;}
    table td{padding:5px 6px; font-size:13px;}
    nav.sidebar button{padding:9px 14px; font-size:13px;}
    nav.sidebar{width:150px;}
    input.grade-input{width:78px; min-height:34px; padding:5px 7px; font-size:14px;}
  }
  /* ---------- GENERIC UI ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em;}
  input[type=text], input[type=date], input[type=number], select{
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:10px 12px;
    border:1.5px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    min-height:44px;
  }
  input:focus, select:focus{outline:2px solid var(--track); outline-offset:1px;}
  button.btn{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:11px 18px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    min-height:44px;
    white-space:nowrap;
  }
  button.btn-primary{background:var(--track); color:#fff;}
  button.btn-primary:hover{background:var(--track-dark);}
  button.btn-secondary{background:#fff; color:var(--infield); border:1.5px solid var(--infield);}
  button.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger); padding:8px 12px; font-size:13px; min-height:36px;}
  button.btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border); padding:8px 12px; font-size:13px; min-height:36px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{
    text-align:left;
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
    border-bottom:2px solid var(--border);
    padding:8px 8px;
  }
  td{padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
  }
  .empty .display{font-size:17px; color:var(--infield); margin-bottom:6px;}
  .pill{
    display:inline-block;
    padding:3px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
  }
  .pill-yellow{background:#FBEBD3; color:#8A5A16;}
  .pill-danger{background:#F6DCDA; color:var(--danger);}
  .pill-ok{background:#DCEBDF; color:var(--ok);}
  .class-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px;}
  .class-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    border-top:4px solid var(--infield);
  }
  .class-card h3{margin:0 0 4px; font-size:18px; color:var(--infield);}
  .class-card .count{color:var(--muted); font-size:13px; margin-bottom:12px;}
  .class-card .actions{display:flex; gap:8px;}
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--infield);
    color:#fff;
    padding:10px 20px;
    border-radius:30px;
    font-size:14px;
    font-weight:600;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  input.grade-input{width:100px; text-align:center;}
  .student-name{font-weight:600;}
  .exempt-note{font-style:italic; color:var(--yellow); font-size:13px;}
  select.absence-select{min-width:170px;}
  .settings-btn{
    background:transparent;
    border:none;
    color:#C9D6C7;
    cursor:pointer;
    padding:6px;
  }
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
  }
  .modal{
    background:#fff; border-radius:12px; padding:24px;
    width:min(420px,90vw);
  }
  .modal h3{margin-top:0; color:var(--infield);}
  .modal .row{margin-bottom:14px;}
  .top-actions{display:flex; justify-content:flex-end; gap:8px; margin-bottom:14px;}
  .count-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:22px; height:22px; padding:0 6px;
    border-radius:11px; background:var(--track); color:#fff;
    font-size:12px; font-weight:700;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CATALOG EFS — catalog personal pentru profesorul de educație fizică
   Stocare persistentă locală (localStorage), 100% pe dispozitiv, fără internet.
   ============================================================ */

const STORAGE_KEY = 'catalog_efs_state_v1';

let state = {
  settings: { titlu: 'Catalogul meu EFS' },
  clase: [],      // {id, nume, an: 'IX'|'X'|'XI'|'XII'}
  elevi: [],      // {id, claseId, nume, prenume, sex, scutit, motivScutire}
  probe: [],      // {id, nume, claseId ('all' sau id clasă), data}
  note: [],       // {id, eleviId, probaId, valoare, notaCalculata, data}
  absente: [],    // {id, eleviId, claseId, data, stare} stare: 'prezent'|'motivat'|'nemotivat'
  bareme: [],     // {id, nume, directie:'desc'|'asc', praguri:{IX:{M:{9..4},F:{9..4}}, X:{...}, XI:{...}, XII:{...}}}
  observatiiCustom: []  // observații suplimentare adăugate de profesor, pe lângă cele predefinite
};

const ANI = ['IX','X','XI','XII'];

let currentTab = 'clase';
let ui = {
  eleviClasa: null,
  notareClasa: null, notareProba: null,
  absenteClasa: null, absenteData: todayISO(),
  baremeSelectat: null, baremeAn: 'IX',
  sintezaClasa: null,
  scutiriClasa: null,
  istoricClasa: null, istoricElev: null,
};

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- STORAGE ----------------
   Salvare 100% locală, în browserul dispozitivului (localStorage).
   Nu are nevoie de internet — funcționează și fără semnal, pe teren.
   Singura limită: datele rămân pe DISPOZITIVUL pe care le-ai introdus.
   Pentru a le muta pe alt dispozitiv (laptop <-> tabletă), folosește
   Setări -> Exportă backup / Importă backup.
------------------------------------------------ */
async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){
    console.log('Nicio dată salvată anterior pe acest dispozitiv, pornim de la zero.');
  }
  migreazaDate();
}
// aduce datele mai vechi la formatele noi (probe cu o singură clasă -> listă de clase; tip de notare implicit)
function migreazaDate(){
  (state.probe || []).forEach(p=>{
    if(!p.claseIds){
      p.claseIds = p.claseId ? [p.claseId] : ['all'];
    }
    if(!p.tipNotare) p.tipNotare = 'nota';
    if(!p.moment) p.moment = 'initial';
  });
  (state.elevi || []).forEach(e=>{
    if(e.inaltime===undefined) e.inaltime = null;
    if(e.greutate===undefined) e.greutate = null;
  });
  if(!state.observatiiCustom) state.observatiiCustom = [];
}
// pentru fiecare denumire de probă din clasă, alege testarea finală dacă există, altfel cea inițială
function probeRelevantePentruSinteza(claseId){
  const probeClasa = state.probe.filter(p=>probaSeAplicaClasei(p, claseId));
  const grupuri = {};
  probeClasa.forEach(p=>{
    if(!grupuri[p.nume]) grupuri[p.nume] = [];
    grupuri[p.nume].push(p);
  });
  const rezultat = [];
  Object.keys(grupuri).forEach(nume=>{
    const instante = grupuri[nume];
    const finale = instante.filter(p=>p.moment==='final').sort((a,b)=>b.data.localeCompare(a.data));
    const initiale = instante.filter(p=>p.moment!=='final').sort((a,b)=>b.data.localeCompare(a.data));
    rezultat.push(finale.length ? finale[0] : initiale[0]);
  });
  return rezultat.sort((a,b)=>a.data.localeCompare(b.data));
}
let saveTimer = null;
let ultimaSalvare = null;
function saveStateNow(){
  clearTimeout(saveTimer);
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    ultimaSalvare = new Date();
    return true;
  }catch(e){
    return false;
  }
}
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if(!saveStateNow()) showToast('Nu am putut salva pe acest dispozitiv (spațiu insuficient?).');
    updateSaveIndicator();
  }, 150);
}
function updateSaveIndicator(){
  const el = document.getElementById('save-indicator');
  if(el) el.textContent = ultimaSalvare ? ('Salvat ' + ultimaSalvare.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',second:'2-digit'})) : '';
}
// dacă închizi sau navighezi din pagină, forțăm salvarea imediată a oricărei modificări netrimise încă
window.addEventListener('beforeunload', ()=>{ saveStateNow(); });
window.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveStateNow(); });

/* ---------------- EXPORT / IMPORT (sincronizare manuală între dispozitive) ---------------- */
function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayISO();
  a.href = url;
  a.download = `catalog-efs-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importBackupFile(file, onDone){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('format invalid');
      state = Object.assign({settings:{titlu:'Catalogul meu EFS'}, clase:[], elevi:[], probe:[], note:[], absente:[], bareme:[], observatiiCustom:[]}, parsed);
      migreazaDate();
      saveState();
      onDone(true);
    }catch(e){
      onDone(false);
    }
  };
  reader.onerror = () => onDone(false);
  reader.readAsText(file);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- ICONS (inline SVG, stroke style) ---------------- */
const ICONS = {
  clase: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>',
  elevi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15 20c0-2.6 1-4.6 3-5.5"/></svg>',
  probe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/><path d="M12 2v3"/></svg>',
  notare: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11l2 2 4-4"/></svg>',
  absente: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18"/><path d="M9 14l2 2 4-4"/></svg>',
  scutiri: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 5-3.2 7.8-7 9-3.8-1.2-7-4-7-9V6z"/><path d="M12 9v5"/><path d="M9.5 11.5h5"/></svg>',
  bareme: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16"/><path d="M6 20V10l4-6 4 6v10"/><path d="M6 14h8"/><path d="M17 20v-7l2-3 2 3v7"/></svg>',
  sinteza: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.2"/><rect x="14" y="3" width="7" height="5" rx="1.2"/><rect x="14" y="12" width="7" height="9" rx="1.2"/><rect x="3" y="16" width="7" height="5" rx="1.2"/></svg>',
  istoric: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3"/><path d="M7 21v-8h10v8"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.5-2-3.4-2.3.9a7.7 7.7 0 00-1.7-1L15 3h-6l-.4 2.9a7.7 7.7 0 00-1.7 1l-2.3-.9-2 3.4L4.6 11a7.6 7.6 0 000 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.8 1.7 1L9 21h6l.4-2.9c.6-.2 1.2-.6 1.7-1l2.3.9 2-3.4z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>',
};

const TABS = [
  {id:'clase', label:'Clase'},
  {id:'sinteza', label:'Sinteză'},
  {id:'elevi', label:'Elevi'},
  {id:'probe', label:'Probe'},
  {id:'bareme', label:'Bareme'},
  {id:'notare', label:'Notare'},
  {id:'absente', label:'Absențe'},
  {id:'istoric', label:'Istoric elev'},
  {id:'scutiri', label:'Scutiri'},
];

/* ---------------- HELPERS DE DATE ---------------- */
function claseNume(id){
  const c = state.clase.find(c=>c.id===id);
  return c ? c.nume : '—';
}
function eleviDinClasa(claseId){
  return state.elevi.filter(e=>e.claseId===claseId).sort((a,b)=>a.nume.localeCompare(b.nume,'ro'));
}
function formatDataRo(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('ro-RO', {day:'2-digit', month:'2-digit', year:'numeric'});
}

/* ================= RENDER PRINCIPAL ================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <div class="title">
        <h1 id="titlu-app">${escapeHtml(state.settings.titlu)}</h1>
        <span class="subtitle">Educație fizică și sport</span>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="date" id="save-indicator" style="min-width:110px; text-align:right;">${ultimaSalvare ? ('Salvat ' + ultimaSalvare.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',second:'2-digit'})) : ''}</span>
        <button class="btn btn-primary" id="btn-save-now" style="padding:8px 14px; min-height:36px; display:flex; align-items:center; gap:6px;">${ICONS.save} Salvează</button>
        <button class="settings-btn" id="btn-settings" title="Setări">${ICONS.gear}</button>
      </div>
    </header>
    <div class="body-wrap">
      <nav class="sidebar">
        ${TABS.map(t=>`<button data-tab="${t.id}" class="${currentTab===t.id?'active':''}">${ICONS[t.id]}<span>${t.label}</span></button>`).join('')}
      </nav>
      <main id="main"></main>
    </div>
    <nav class="bottombar">
      ${TABS.map(t=>`<button data-tab="${t.id}" class="${currentTab===t.id?'active':''}">${ICONS[t.id]}<span>${t.label}</span></button>`).join('')}
    </nav>
  `;
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.addEventListener('click', ()=>{ currentTab = b.dataset.tab; render(); });
  });
  document.getElementById('btn-settings').addEventListener('click', openSettingsModal);
  document.getElementById('btn-save-now').addEventListener('click', ()=>{
    const ok = saveStateNow();
    updateSaveIndicator();
    showToast(ok ? 'Salvat ✓' : 'Nu am putut salva.');
  });
  renderTab();
}

function renderTab(){
  const main = document.getElementById('main');
  if(currentTab==='clase') return renderClase(main);
  if(currentTab==='sinteza') return renderSinteza(main);
  if(currentTab==='elevi') return renderElevi(main);
  if(currentTab==='probe') return renderProbe(main);
  if(currentTab==='bareme') return renderBareme(main);
  if(currentTab==='notare') return renderNotare(main);
  if(currentTab==='absente') return renderAbsente(main);
  if(currentTab==='istoric') return renderIstoric(main);
  if(currentTab==='scutiri') return renderScutiri(main);
}

/* ================= TAB: CLASE ================= */
function renderClase(main){
  main.innerHTML = `
    <h2>Clase</h2>
    <p class="tab-desc">Adaugă clasele la care predai. Fiecare clasă își are propria listă de elevi.</p>
    <div class="card">
      <div class="row">
        <div class="field" style="flex:1; min-width:180px;">
          <label>Nume clasă</label>
          <input type="text" id="input-clasa-nume" placeholder="ex: a IX-a A" />
        </div>
        <div class="field">
          <label>An de studiu</label>
          <select id="input-clasa-an">${ANI.map(a=>`<option value="${a}">${a}</option>`).join('')}</select>
        </div>
        <button class="btn btn-primary" id="btn-add-clasa">+ Adaugă clasă</button>
      </div>
    </div>
    ${state.clase.length===0 ? emptyState('Nicio clasă adăugată încă.', 'Adaugă prima clasă mai sus ca să poți începe să treci elevi.') : `
      <div class="class-grid">
        ${state.clase.map(c=>{
          const nr = eleviDinClasa(c.id).length;
          return `<div class="class-card">
            <h3>${escapeHtml(c.nume)}</h3>
            <div class="row" style="margin:0 0 8px; align-items:center;">
              <span style="font-size:12px; color:var(--muted); font-weight:600;">AN:</span>
              <select data-an-clasa="${c.id}" style="min-height:32px; padding:4px 8px; font-size:13px;">
                ${ANI.map(a=>`<option value="${a}" ${c.an===a?'selected':''}>${a}</option>`).join('')}
              </select>
            </div>
            <div class="count">${nr} elev${nr===1?'':'i'}</div>
            <div class="actions">
              <button class="btn btn-ghost" data-rename="${c.id}">Redenumește</button>
              <button class="btn btn-danger" data-del-clasa="${c.id}">${ICONS.trash} Șterge</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    `}
  `;
  document.getElementById('btn-add-clasa').addEventListener('click', ()=>{
    const inp = document.getElementById('input-clasa-nume');
    const an = document.getElementById('input-clasa-an').value;
    const nume = inp.value.trim();
    if(!nume) return showToast('Scrie numele clasei.');
    state.clase.push({id:uid(), nume, an});
    saveState(); render(); showToast('Clasă adăugată.');
  });
  main.querySelectorAll('[data-rename]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const c = state.clase.find(c=>c.id===b.dataset.rename);
      const nou = prompt('Nume nou pentru clasă:', c.nume);
      if(nou && nou.trim()){ c.nume = nou.trim(); saveState(); render(); }
    });
  });
  main.querySelectorAll('[data-an-clasa]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const c = state.clase.find(c=>c.id===sel.dataset.anClasa);
      c.an = sel.value; saveState(); showToast('An actualizat.');
    });
  });
  main.querySelectorAll('[data-del-clasa]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.delClasa;
      const nr = eleviDinClasa(id).length;
      const msg = nr>0
        ? `Această clasă are ${nr} elev(i). Ștergând clasa, se șterg și elevii, notele, absențele și probele asociate. Continui?`
        : 'Ștergi această clasă?';
      if(!confirm(msg)) return;
      const eleviIds = state.elevi.filter(e=>e.claseId===id).map(e=>e.id);
      state.clase = state.clase.filter(c=>c.id!==id);
      state.elevi = state.elevi.filter(e=>e.claseId!==id);
      state.probe = state.probe.filter(p=>p.claseId!==id);
      state.note = state.note.filter(n=>!eleviIds.includes(n.eleviId));
      state.absente = state.absente.filter(a=>!eleviIds.includes(a.eleviId));
      saveState(); render(); showToast('Clasă ștearsă.');
    });
  });
}

/* ================= TAB: SINTEZĂ (vedere generală pe clasă) ================= */
function renderSinteza(main){

  const lista = eleviDinClasa(claseId);
  const probeClasa = probeRelevantePentruSinteza(claseId);

  main.innerHTML = `
    <h2>Sinteză</h2>
    <p class="tab-desc">O imagine de ansamblu pe clasă: toate probele, notele, absențele și observațiile.</p>
    <div class="row" style="margin-bottom:16px; align-items:flex-end;">
      <div class="field">
        <label>Clasă</label>
        <select id="select-sinteza-clasa">
          ${state.clase.map(c=>`<option value="${c.id}" ${c.id===claseId?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-secondary" id="btn-raport-clasa">🖨 Printează raport clasă</button>
    </div>

    ${lista.length===0 ? emptyState('Niciun elev în această clasă.', 'Adaugă elevi în tabul „Elevi”.') : `

    <h3 style="font-size:16px; color:var(--infield); margin-bottom:8px;">Note pe probe</h3>
    <p class="tab-desc" style="margin-top:-4px;">Pentru fiecare probă apare testarea finală, dacă există — altfel testarea inițială.</p>
    ${probeClasa.length===0 ? `<div class="tab-desc" style="margin-bottom:16px;">Nicio probă dată încă la această clasă.</div>` : `
    <div class="card" style="padding:0; overflow-x:auto; margin-bottom:24px;">
      <table>
        <thead><tr>
          <th style="position:sticky; left:0; background:var(--card);">Elev</th>
          ${probeClasa.map(p=>`<th>${escapeHtml(p.nume)}<br><span style="font-weight:400; text-transform:none; font-size:11px;">${p.moment==='final'?'finală':'inițială'} · ${formatDataRo(p.data)}</span></th>`).join('')}
          <th>Medie</th>
        </tr></thead>
        <tbody>
          ${lista.map(e=>{
            const noteNumerice = [];
            const celule = probeClasa.map(p=>{
              if(e.scutit) return '<span class="exempt-note">scutit</span>';
              const rec = state.note.find(n=>n.eleviId===e.id && n.probaId===p.id);
              if(!rec) return '<span style="color:var(--muted);">—</span>';

              if(rec.notaCalculata!=null){
                afisaj = `${rec.valoare} <span class="pill pill-ok" style="margin-left:4px;">${rec.notaCalculata}</span>`;
                noteNumerice.push(rec.notaCalculata);
              } else {
                const numeric = parseFloat(String(rec.valoare).replace(',','.'));
                if(!isNaN(numeric) && numeric>=1 && numeric<=10) noteNumerice.push(numeric);
              }
              return escapeHtmlKeepPill(afisaj);
            });
            const medie = noteNumerice.length ? (noteNumerice.reduce((a,b)=>a+b,0)/noteNumerice.length).toFixed(2) : '—';
            return `<tr>
              <td class="student-name" style="position:sticky; left:0; background:var(--card);">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td>
              ${celule.map(c=>`<td>${c}</td>`).join('')}
              <td><strong>${medie}</strong></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <h3 style="font-size:16px; color:var(--infield); margin-bottom:8px;">Absențe și observații</h3>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Elev</th><th>Motivate</th><th>Nemotivate</th><th>Observații</th></tr></thead>
        <tbody>
          ${lista.map(e=>{
            const absElev = state.absente.filter(a=>a.eleviId===e.id);
            const motivate = absElev.filter(a=>a.stare==='motivat').length;
            const nemotivate = absElev.filter(a=>a.stare==='nemotivat').length;
            const observatii = absElev.filter(a=>a.nota && a.nota.trim())
                                       .sort((a,b)=>a.data.localeCompare(b.data))
                                       .map(a=>`${formatDataRo(a.data)} (${labelStare(a.stare)}): ${escapeHtml(a.nota)}`)
                                       .join('<br>');

            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    `}

  document.getElementById('select-sinteza-clasa').addEventListener('change', e=>{
    ui.sintezaClasa = e.target.value; render();

  document.getElementById('btn-raport-clasa').addEventListener('click', ()=>{
    genereazaRaportClasa(claseId);
  });
}

/* ================= RAPORT DE CLASĂ (printabil / salvabil ca PDF) ================= */
function genereazaRaportClasa(claseId){
  const clasa = state.clase.find(c=>c.id===claseId);
  const lista = eleviDinClasa(claseId);
  const probeClasa = probeRelevantePentruSinteza(claseId);

  const randuriNote = lista.map(e=>{
    const noteNumerice = [];
    const celule = probeClasa.map(p=>{
      if(e.scutit) return 'scutit';
      const rec = state.note.find(n=>n.eleviId===e.id && n.probaId===p.id);
      if(!rec) return '—';
      if(rec.notaCalculata!=null){ noteNumerice.push(rec.notaCalculata); return `${rec.valoare} (${rec.notaCalculata})`; }
      const numeric = parseFloat(String(rec.valoare).replace(',','.'));
      if(!isNaN(numeric) && numeric>=1 && numeric<=10) noteNumerice.push(numeric);
      return String(rec.valoare);
    });
    const medie = noteNumerice.length ? (noteNumerice.reduce((a,b)=>a+b,0)/noteNumerice.length).toFixed(2) : '—';
    return `<tr>
      <td>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td>
      ${celule.map(c=>`<td>${escapeHtml(String(c))}</td>`).join('')}
      <td><strong>${medie}</strong></td>
    </tr>`;
  }).join('');

  const randuriAbsente = lista.map(e=>{
    const absElev = state.absente.filter(a=>a.eleviId===e.id);
    const motivate = absElev.filter(a=>a.stare==='motivat').length;
    const nemotivate = absElev.filter(a=>a.stare==='nemotivat').length;
    const observatii = absElev.filter(a=>a.nota && a.nota.trim())
                               .sort((a,b)=>a.data.localeCompare(b.data))
                               .map(a=>`${formatDataRo(a.data)} (${labelStare(a.stare)}): ${a.nota}`)
                               .join('; ');
    return `<tr>
      <td>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td>
      <td>${motivate}</td>
      <td>${nemotivate}</td>
      <td>${escapeHtml(observatii)}</td>
    </tr>`;
  }).join('');

  const randuriAntropo = lista.map(e=>{
    const imc = (e.inaltime && e.greutate) ? (e.greutate / ((e.inaltime/100)*(e.inaltime/100))).toFixed(1) : '—';
    return `<tr>
      <td>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td>
      <td>${e.inaltime || '—'}</td>
      <td>${e.greutate || '—'}</td>
      <td>${imc}</td>
    </tr>`;
  }).join('');

  const html = `<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8">
<title>Raport ${escapeHtml(clasa ? clasa.nume : '')} — Catalog EFS</title>
<style>
  body{font-family: Arial, sans-serif; color:#1a1a1a; padding:24px; max-width:1100px; margin:0 auto;}
  h1{font-size:22px; margin-bottom:2px;}
  .sub{color:#555; margin-bottom:24px; font-size:13px;}
  h2{font-size:16px; margin-top:32px; border-bottom:2px solid #22402C; padding-bottom:4px; color:#22402C;}
  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:12px;}
  th,td{border:1px solid #ccc; padding:6px 8px; text-align:left;}
  th{background:#f0efe9;}
  .btn-print{
    position:fixed; top:16px; right:16px; background:#C1440E; color:#fff; border:none;
    padding:10px 18px; border-radius:6px; font-weight:700; cursor:pointer; font-size:14px;
  }
  @media print{ .btn-print{ display:none; } body{ padding:0; } }
</style>
</head>
<body>
  <button class="btn-print" onclick="window.print()">🖨 Printează / Salvează PDF</button>
  <h1>Raport clasă — ${escapeHtml(clasa ? clasa.nume : '')}</h1>
  <div class="sub">Generat la ${formatDataRo(todayISO())}, ora ${new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}</div>

  <h2>Note pe probe</h2>
  ${probeClasa.length===0 ? '<p>Nicio probă înregistrată.</p>' : `
  <table>
    <thead><tr><th>Elev</th>${probeClasa.map(p=>`<th>${escapeHtml(p.nume)} (${p.moment==='final'?'finală':'inițială'})</th>`).join('')}<th>Medie</th></tr></thead>
    <tbody>${randuriNote}</tbody>
  </table>`}

  <h2>Absențe și observații</h2>
  <table>
    <thead><tr><th>Elev</th><th>Motivate</th><th>Nemotivate</th><th>Observații</th></tr></thead>
    <tbody>${randuriAbsente}</tbody>
  </table>

  <h2>Date antropometrice</h2>
  <table>
    <thead><tr><th>Elev</th><th>Înălțime (cm)</th><th>Greutate (kg)</th><th>IMC</th></tr></thead>
    <tbody>${randuriAntropo}</tbody>
  </table>
</body></html>`;

  const w = window.open('', '_blank');
  if(!w){ showToast('Permite ferestrele pop-up ca să vezi raportul.'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}
// notele de mai sus pot conține deja un <span> pill — nu îl mai scăpăm prin escapeHtml a doua oară
function escapeHtmlKeepPill(html){ return html; }

const TIPURI_NOTARE = [

  {v:'calificativ', label:'Calificativ (FB, B, S, NS)'},
  {v:'barem', label:'Cu barem (calculează din timp/rezultat)'},
];
function tipNotareLabel(v){
  return (TIPURI_NOTARE.find(t=>t.v===v) || TIPURI_NOTARE[0]).label;
}
function claseleProbei(p){
  // compatibilitate: probele vechi au claseId (un singur id sau 'all'); cele noi au claseIds (listă)
  if(p.claseIds && p.claseIds.length) return p.claseIds;
  if(p.claseId) return [p.claseId];
  return ['all'];
}
function probaSeAplicaClasei(p, claseId){
  const ids = claseleProbei(p);
  return ids.includes('all') || ids.includes(claseId);
}
function numeClaseleProbei(p){
  const ids = claseleProbei(p);
  if(ids.includes('all')) return 'Toate clasele';
  return ids.map(id=>claseNume(id)).join(', ');
}

const CALIFICATIVE = [
  {cod:'FB*', nota:10, label:'FB* — Foarte bine cu stea'},
  {cod:'FB',  nota:9,  label:'FB — Foarte bine'},
  {cod:'B*',  nota:8,  label:'B* — Bine cu stea'},
  {cod:'B',   nota:7,  label:'B — Bine'},
  {cod:'S*',  nota:6,  label:'S* — Suficient cu stea'},
  {cod:'S',   nota:5,  label:'S — Suficient'},
  {cod:'NS*', nota:4,  label:'NS* — Nesatisfăcător cu stea'},
  {cod:'NS',  nota:3,  label:'NS — Nesatisfăcător'},
];
function notaDinCalificativ(cod){
  const c = CALIFICATIVE.find(c=>c.cod===cod);
  return c ? c.nota : null;
}
function pragGol(){ return {9:null,8:null,7:null,6:null,5:null,4:null}; }
function baremNou(nume, directie){
  return {
    id: uid(), nume, directie: directie || 'desc',
    praguri: { IX:{M:pragGol(),F:pragGol()}, X:{M:pragGol(),F:pragGol()}, XI:{M:pragGol(),F:pragGol()}, XII:{M:pragGol(),F:pragGol()} }
  };
}
function claseAn(claseId){
  const c = state.clase.find(c=>c.id===claseId);
  return (c && c.an) ? c.an : 'IX';
}
function findBaremForProba(probaNume){
  if(!probaNume) return null;
  const target = probaNume.trim().toLowerCase();
  return state.bareme.find(b=>b.nume.trim().toLowerCase()===target) || null;
}
// Întoarce nota calculată (10..4) sau null dacă nu există prag definit / rezultatul e sub baremul minim.
function calculeazaNota(barem, an, sex, valoareStr){
  if(!barem) return null;
  const v = parseFloat(String(valoareStr).replace(',','.'));
  if(isNaN(v)) return null;
  const praguri = barem.praguri[an] && barem.praguri[an][sex];
  if(!praguri) return null;
  const ordine = [9,8,7,6,5,4];
  if(barem.directie==='desc'){ // valoare mai mică = notă mai mare (ex: timp)
    if(praguri[9]!=null && v < praguri[9]) return 10;
    for(const n of ordine){ if(praguri[n]!=null && v <= praguri[n]) return n; }
  } else { // valoare mai mare = notă mai mare (ex: distanță, repetări)
    if(praguri[9]!=null && v > praguri[9]) return 10;
    for(const n of ordine){ if(praguri[n]!=null && v >= praguri[n]) return n; }
  }
  return null; // sub pragul minim definit (4)
}

  }

  const lista = eleviDinClasa(ui.absenteClasa);

  main.innerHTML = `
    <h2>Absențe</h2>
    <p class="tab-desc">Bifează rapid absențele. Alege o observație din listă (sau scrie una proprie). Se salvează automat, imediat.</p>
    <div class="row" style="margin-bottom:16px;">
      <div class="field">
        <label>Clasă</label>
        <select id="select-absente-clasa">
          ${state.clase.map(c=>`<option value="${c.id}" ${c.id===ui.absenteClasa?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Data orei</label>
        <input type="date" id="input-absente-data" value="${ui.absenteData}"/>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:700; color:var(--infield); margin-bottom:8px;">Lista de observații</div>
      <div class="row" style="margin-bottom:10px;">
        <div class="field" style="flex:1; min-width:220px;">
          <label>Observație nouă</label>
          <input type="text" id="input-observatie-noua" placeholder="ex: A plecat fără voie de la oră"/>
        </div>
        <button class="btn btn-secondary" id="btn-add-observatie">+ Adaugă la listă</button>
      </div>
      ${state.observatiiCustom.length ? `
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          ${state.observatiiCustom.map((o,idx)=>`
            <span class="pill pill-yellow" style="display:flex; align-items:center; gap:6px;">
              ${escapeHtml(o)}
              <button data-del-observatie="${idx}" style="border:none; background:transparent; cursor:pointer; color:#8A5A16; font-weight:700; padding:0;">✕</button>
            </span>
          `).join('')}
        </div>
      ` : `<div class="tab-desc" style="margin:0;">Nicio observație proprie adăugată încă — cele 5 de bază sunt mereu disponibile.</div>`}
    </div>

    ${lista.length===0 ? emptyState('Niciun elev în această clasă.', 'Adaugă elevi în tabul „Elevi”.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Elev</th><th>Absent</th><th>Motivat</th><th>Observație</th><th>Total absențe</th></tr></thead>
        <tbody>
          ${lista.map(e=>{
            const rec = state.absente.find(a=>a.eleviId===e.id && a.data===ui.absenteData);
            const stare = rec ? rec.stare : 'prezent';
            const esteAbsent = stare!=='prezent';
            const esteMotivat = stare==='motivat';
            const nota = rec ? (rec.nota || '') : '';
            const esteCustom = nota && !toateObservatiile().includes(nota);
            const total = state.absente.filter(a=>a.eleviId===e.id && a.stare!=='prezent').length;
            return `<tr data-row-elev="${e.id}">
              <td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${e.scutit?'<span class=\"pill pill-yellow\" style=\"margin-left:6px;\">scutit</span>':''}</td>
              <td style="text-align:center;">
                <input type="checkbox" class="chk-absent" data-elev="${e.id}" ${esteAbsent?'checked':''} style="width:22px; height:22px; cursor:pointer;"/>
              </td>
              <td style="text-align:center;">
                <input type="checkbox" class="chk-motivat" data-elev="${e.id}" ${esteMotivat?'checked':''} ${esteAbsent?'':'disabled'} style="width:22px; height:22px; cursor:pointer;"/>
              </td>
              <td style="min-width:220px;">
                <select class="select-observatie" data-elev="${e.id}">
                  <option value="">— fără observație —</option>
                  ${toateObservatiile().map(o=>`<option value="${escapeHtml(o)}" ${nota===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
                  <option value="__custom__" ${esteCustom?'selected':''}>Altă observație...</option>
                </select>
                <input type="text" class="input-observatie-custom" data-elev="${e.id}" value="${esteCustom?escapeHtml(nota):''}"
                  style="width:100%; min-width:200px; margin-top:5px; display:${esteCustom?'block':'none'};" placeholder="scrie observația ta"/>
              </td>
              <td>${total>0 ? `<span class="pill pill-danger">${total}</span>` : '<span class="pill pill-ok">0</span>'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    `}
  `;
  document.getElementById('select-absente-clasa').addEventListener('change', e=>{ ui.absenteClasa = e.target.value; render(); });
  document.getElementById('input-absente-data').addEventListener('change', e=>{ ui.absenteData = e.target.value; render(); });

  document.getElementById('btn-add-observatie').addEventListener('click', ()=>{
    const inp = document.getElementById('input-observatie-noua');
    const text = inp.value.trim();
    if(!text) return showToast('Scrie observația mai întâi.');
    if(toateObservatiile().some(o=>o.toLowerCase()===text.toLowerCase())) return showToast('Există deja în listă.');
    state.observatiiCustom.push(text);
    saveState(); render(); showToast('Observație adăugată la listă.');
  });
  main.querySelectorAll('[data-del-observatie]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = parseInt(b.dataset.delObservatie, 10);
      if(!confirm('Ștergi această observație din listă? (nu afectează observațiile deja salvate la elevi)')) return;
      state.observatiiCustom.splice(idx,1);
      saveState(); render(); showToast('Observație ștearsă din listă.');
    });
  });

  function upsertAbsenta(eleviId, patch){
    let rec = state.absente.find(a=>a.eleviId===eleviId && a.data===ui.absenteData);
    if(!rec){
      rec = {id:uid(), eleviId, claseId:ui.absenteClasa, data:ui.absenteData, stare:'prezent', nota:''};
      state.absente.push(rec);
    }
    Object.assign(rec, patch);
    if(rec.stare==='prezent' && !rec.nota){
      state.absente = state.absente.filter(a=>a!==rec);
    }
    saveState();
  }

  main.querySelectorAll('.chk-absent').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const eleviId = chk.dataset.elev;
      const row = main.querySelector(`tr[data-row-elev="${eleviId}"]`);
      const chkMotivat = row.querySelector('.chk-motivat');
      if(chk.checked){
        chkMotivat.disabled = false;
        upsertAbsenta(eleviId, {stare: chkMotivat.checked ? 'motivat' : 'nemotivat'});
      } else {
        chkMotivat.checked = false;
        chkMotivat.disabled = true;
        upsertAbsenta(eleviId, {stare:'prezent'});
      }
      const totalCell = row.children[4];
      const total = state.absente.filter(a=>a.eleviId===eleviId && a.stare!=='prezent').length;
      totalCell.innerHTML = total>0 ? `<span class="pill pill-danger">${total}</span>` : '<span class="pill pill-ok">0</span>';
    });
  });
  main.querySelectorAll('.chk-motivat').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      upsertAbsenta(chk.dataset.elev, {stare: chk.checked ? 'motivat' : 'nemotivat'});
    });
  });
  main.querySelectorAll('.select-observatie').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const eleviId = sel.dataset.elev;
      const row = main.querySelector(`tr[data-row-elev="${eleviId}"]`);
      const customInput = row.querySelector('.input-observatie-custom');
      if(sel.value==='__custom__'){
        customInput.style.display = 'block';
        customInput.focus();
        upsertAbsenta(eleviId, {nota: customInput.value.trim()});
      } else {
        customInput.style.display = 'none';
        customInput.value = '';
        upsertAbsenta(eleviId, {nota: sel.value});
      }
    });
  });
  main.querySelectorAll('.input-observatie-custom').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      upsertAbsenta(inp.dataset.elev, {nota: inp.value.trim()});
    });
  });
}

/* ================= TAB: ISTORIC ELEV ================= */
function renderIstoric(main){
  if(state.clase.length===0){
    main.innerHTML = `<h2>Istoric elev</h2>` + emptyState('Nu ai nicio clasă.', 'Adaugă mai întâi o clasă în tabul „Clase”.');
    return;
  }
  if(!ui.istoricClasa || !state.clase.find(c=>c.id===ui.istoricClasa)) ui.istoricClasa = state.clase[0].id;
  const eleviClasa = eleviDinClasa(ui.istoricClasa);
  if(!ui.istoricElev || !eleviClasa.find(e=>e.id===ui.istoricElev)){
    ui.istoricElev = eleviClasa.length ? eleviClasa[0].id : null;
  }
  const elev = ui.istoricElev ? state.elevi.find(e=>e.id===ui.istoricElev) : null;

  main.innerHTML = `
    <h2>Istoric elev</h2>
    <p class="tab-desc">Alege clasa și elevul ca să vezi tot istoricul: absențe, observații, cu data fiecăreia și totalul cumulat.</p>
    <div class="row" style="margin-bottom:16px;">
      <div class="field">
        <label>Clasă</label>
        <select id="select-istoric-clasa">
          ${state.clase.map(c=>`<option value="${c.id}" ${c.id===ui.istoricClasa?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="min-width:220px;">
        <label>Elev</label>
        <select id="select-istoric-elev" ${eleviClasa.length===0?'disabled':''}>
          ${eleviClasa.length===0 ? '<option>Niciun elev în această clasă</option>' :
            eleviClasa.map(e=>`<option value="${e.id}" ${e.id===ui.istoricElev?'selected':''}>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</option>`).join('')}
        </select>
      </div>
    </div>
    ${!elev ? emptyState('Niciun elev în această clasă.', 'Adaugă elevi în tabul „Elevi”.') : (()=>{
      const inregistrari = state.absente.filter(a=>a.eleviId===elev.id).sort((a,b)=>a.data.localeCompare(b.data));
      const totalMotivate = inregistrari.filter(a=>a.stare==='motivat').length;
      const totalNemotivate = inregistrari.filter(a=>a.stare==='nemotivat').length;
      let cumulat = 0;
      const randuri = inregistrari.map(a=>{
        if(a.stare!=='prezent') cumulat++;
        return `<tr>
          <td>${formatDataRo(a.data)}</td>
          <td>${a.stare==='motivat' ? '<span class="pill pill-yellow">absent motivat</span>' : a.stare==='nemotivat' ? '<span class="pill pill-danger">absent nemotivat</span>' : '<span class="pill pill-ok">prezent</span>'}</td>
          <td>${escapeHtml(a.nota) || '<span style="color:var(--muted);">—</span>'}</td>
          <td><strong>${cumulat}</strong></td>
        </tr>`;
      }).join('');
      return `
        <div class="row" style="margin-bottom:16px; gap:10px;">
          <span class="pill pill-yellow">Motivate: ${totalMotivate}</span>
          <span class="pill pill-danger">Nemotivate: ${totalNemotivate}</span>
          <span class="pill pill-ok">Total absențe: ${totalMotivate+totalNemotivate}</span>
          ${elev.scutit ? `<span class="pill pill-yellow">Scutit medical${elev.motivScutire?' — '+escapeHtml(elev.motivScutire):''}</span>` : ''}
        </div>
        ${inregistrari.length===0 ? emptyState('Niciun eveniment înregistrat.', 'Absențele și observațiile pentru acest elev vor apărea aici, pe măsură ce le adaugi în tabul „Absențe”.') : `
        <div class="card" style="padding:0; overflow-x:auto;">
          <table>
            <thead><tr><th>Data</th><th>Stare</th><th>Observație</th><th>Total absențe până la această dată</th></tr></thead>
            <tbody>${randuri}</tbody>
          </table>
        </div>`}
      `;
    })()}
  `;
  document.getElementById('select-istoric-clasa').addEventListener('change', e=>{
    ui.istoricClasa = e.target.value; ui.istoricElev = null; render();
  });
  const selElev = document.getElementById('select-istoric-elev');
  if(selElev) selElev.addEventListener('change', e=>{ ui.istoricElev = e.target.value; render(); });
}

/* ================= TAB: SCUTIRI MEDICALE ================= */
function renderScutiri(main){
  const scutiti = state.elevi.filter(e=>e.scutit);
  if(!ui.scutiriClasa || !state.clase.find(c=>c.id===ui.scutiriClasa)){
    ui.scutiriClasa = state.clase.length ? state.clase[0].id : null;
  }
  const eleviNescutitiClasa = ui.scutiriClasa ? eleviDinClasa(ui.scutiriClasa).filter(e=>!e.scutit) : [];
  main.innerHTML = `
    <h2>Scutiri medicale</h2>
    <p class="tab-desc">Vezi toți elevii scutiți, indiferent de clasă, și gestionează scutirile.</p>
    <div class="card">
      <div class="row">
        <div class="field" style="min-width:180px;">
          <label>Clasă</label>
          <select id="select-scutire-clasa" ${state.clase.length===0?'disabled':''}>
            ${state.clase.length===0 ? '<option>Nicio clasă</option>' :
              state.clase.map(c=>`<option value="${c.id}" ${c.id===ui.scutiriClasa?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:220px;">
          <label>Elev</label>
          <select id="select-scutire-elev" ${eleviNescutitiClasa.length===0?'disabled':''}>
            <option value="">${eleviNescutitiClasa.length===0 ? 'Niciun elev disponibil' : 'Alege un elev...'}</option>
            ${eleviNescutitiClasa.map(e=>`<option value="${e.id}">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:1; min-width:220px;">
          <label>Motiv scutire</label>
          <input type="text" id="input-scutire-motiv" placeholder="ex: scutire medicală pe semestrul I"/>
        </div>
        <button class="btn btn-primary" id="btn-add-scutire">+ Marchează scutit</button>
      </div>
    </div>
    ${scutiti.length===0 ? emptyState('Niciun elev scutit momentan.', 'Adaugă o scutire folosind formularul de mai sus.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Elev</th><th>Clasă</th><th>Motiv</th><th></th></tr></thead>
        <tbody>
          ${scutiti.map(e=>`
            <tr>
              <td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td>
              <td>${escapeHtml(claseNume(e.claseId))}</td>
              <td>${escapeHtml(e.motivScutire) || '—'}</td>
              <td><button class="btn btn-ghost" data-unscutire="${e.id}">Anulează scutirea</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`}
  `;
  document.getElementById('select-scutire-clasa').addEventListener('change', e=>{
    ui.scutiriClasa = e.target.value; render();
  });
  document.getElementById('btn-add-scutire').addEventListener('click', ()=>{
    const id = document.getElementById('select-scutire-elev').value;
    const motiv = document.getElementById('input-scutire-motiv').value.trim();
    if(!id) return showToast('Alege un elev.');
    const e = state.elevi.find(e=>e.id===id);
    e.scutit = true; e.motivScutire = motiv;
    saveState(); render(); showToast('Scutire înregistrată.');
  });
  main.querySelectorAll('[data-unscutire]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const e = state.elevi.find(e=>e.id===b.dataset.unscutire);
      e.scutit = false; e.motivScutire = '';
      saveState(); render(); showToast('Scutire anulată.');
    });
  });
}

/* ================= SETĂRI ================= */
function openSettingsModal(){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Setări</h3>
      <div class="row">
        <div class="field" style="flex:1;">
          <label>Titlul catalogului</label>
          <input type="text" id="modal-titlu" value="${escapeHtml(state.settings.titlu)}"/>
        </div>
      </div>

      <div style="border-top:1px solid var(--border); margin:18px 0 14px; padding-top:14px;">
        <div style="font-weight:700; color:var(--infield); margin-bottom:4px;">Sincronizare între dispozitive</div>
        <div style="font-size:13px; color:var(--muted); margin-bottom:12px;">
          Datele stau doar pe acest dispozitiv, fără internet. Ca să le ai și pe laptop și pe tabletă,
          exportă un fișier de pe unul și importă-l pe celălalt (prin Drive, email sau USB, oricând ai semnal).
        </div>
        <div class="row">
          <button class="btn btn-secondary" id="modal-export">⭳ Exportă backup</button>
          <button class="btn btn-secondary" id="modal-import-btn">⭱ Importă backup</button>
          <input type="file" id="modal-import-input" accept="application/json" style="display:none;"/>
        </div>
      </div>

      <div class="row" style="justify-content:space-between; margin-top:6px;">
        <button class="btn btn-danger" id="modal-reset">Golește toate datele</button>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" id="modal-cancel">Renunță</button>
          <button class="btn btn-primary" id="modal-save">Salvează</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('modal-cancel').addEventListener('click', ()=>backdrop.remove());
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });
  document.getElementById('modal-save').addEventListener('click', ()=>{
    state.settings.titlu = document.getElementById('modal-titlu').value.trim() || 'Catalogul meu EFS';
    saveState(); backdrop.remove(); render();
  });
  document.getElementById('modal-reset').addEventListener('click', ()=>{
    if(!confirm('Sigur ștergi toate datele (clase, elevi, note, absențe, probe, bareme)? Nu se poate anula.')) return;
    state = { settings:{titlu:state.settings.titlu}, clase:[], elevi:[], probe:[], note:[], absente:[], bareme:[] };
    saveState(); backdrop.remove(); render(); showToast('Toate datele au fost șterse.');
  });
  document.getElementById('modal-export').addEventListener('click', ()=>{
    exportBackup();
    showToast('Backup descărcat.');
  });
  const importInput = document.getElementById('modal-import-input');
  document.getElementById('modal-import-btn').addEventListener('click', ()=> importInput.click());
  importInput.addEventListener('change', ()=>{
    const file = importInput.files[0];
    if(!file) return;
    if(!confirm('Importarea unui backup înlocuiește TOATE datele curente de pe acest dispozitiv cu cele din fișier. Continui?')) return;
    importBackupFile(file, (ok)=>{
      if(ok){ backdrop.remove(); render(); showToast('Backup importat cu succes.'); }
      else{ showToast('Fișierul nu pare un backup valid.'); }
    });
  });
}

/* ---------------- UI HELPERS ---------------- */
function emptyState(title, sub){
  return `<div class="empty"><div class="display">${escapeHtml(title)}</div><div>${escapeHtml(sub)}</div></div>`;
}

/* ---------------- BOOT ---------------- */
(async function init(){
  await loadState();
  render();
})();

// Activează modul offline real (PWA): odată încărcată o dată cu internet,
// aplicația rămâne disponibilă chiar și fără semnal, oricât timp ar trece.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{
      // dacă nu există încă fișierul pe server, aplicația funcționează normal, doar fără cache offline garantat
    });
  });
}
</script>
