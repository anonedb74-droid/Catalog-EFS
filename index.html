      currentTab = 'planificare'; render();
    });
  });
  const btnAziExcel = document.getElementById('btn-azi-excel');
  if(btnAziExcel) btnAziExcel.addEventListener('click', ()=>genereazaRaportExcelGeneral());
  const btnAziExport = document.getElementById('btn-azi-export');
  if(btnAziExport) btnAziExport.addEventListener('click', async ()=>{
    const rezultat = await exportBackup();
    if(rezultat === 'share' || rezultat === 'download'){

      saveState(); render();
      showToast(rezultat === 'share' ? 'Backup trimis.' : 'Backup descărcat.');
    }
  });
}

/* ================= FIȘA OREI (din tabul Azi) ================= */
function renderFisaOra(main){
  const f = ui.aziFisa;
  const clasa = state.clase.find(c=>c.id===f.claseId);
  if(!clasa){ ui.aziFisa = null; return renderAzi(main); }
  const azi = f.data;
  const elevi = eleviDinClasa(clasa.id);
  const practica = practicaActiva(clasa.id);
  const planuri = state.planificari.filter(p=>p.claseId===clasa.id).sort((a,b)=>a.data.localeCompare(b.data));
  const plan = planuri.find(p=>p.data===azi);
  const anterioara = [...planuri].reverse().find(p=>p.data<azi);
  const urmatoare = planuri.find(p=>p.data>azi);
  const esteEvaluare = plan && /evaluare/i.test(plan.tema||'');
  const probeAzi = state.probe.filter(p=>probaSeAplicaClasei(p, clasa.id) && p.data===azi);
  // elevi care cer atenție
  const scutiti = elevi.filter(e=>esteScutitActiv(e));
  const ces = elevi.filter(e=>e.ces);
  // prezența de azi
  const absAzi = state.absente.filter(a=>a.claseId===clasa.id && a.data===azi && a.stare==='absent');
  const numeElev = id=>{ const e=state.elevi.find(x=>x.id===id); return e ? `${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}` : '—'; };
  // ultima oră înregistrată înainte de azi: absenți + observații
  const dateAnterioare = [...new Set(state.absente.filter(a=>a.claseId===clasa.id && a.data<azi).map(a=>a.data))].sort();
  const ultimaData = dateAnterioare[dateAnterioare.length-1];
  const recUltima = ultimaData ? state.absente.filter(a=>a.claseId===clasa.id && a.data===ultimaData) : [];
  state.notiteOre = state.notiteOre || [];
  const notita = state.notiteOre.find(n=>n.claseId===clasa.id && n.data===azi);
  const sect = (titlu, corp)=>`<div class="card"><h3 style="font-size:15px; color:var(--infield); margin:0 0 8px;">${titlu}</h3>${corp}</div>`;
  const recs = [];
  if(plan){
    if(plan.recAfara) recs.push(`<div><b>Afară:</b> ${escapeHtml(plan.recAfara)}</div>`);
    if(plan.recInterior) recs.push(`<div><b>În clasă/sală:</b> ${escapeHtml(plan.recInterior)}</div>`);
    if(plan.recMixt) recs.push(`<div><b>Colectiv mixt:</b> ${escapeHtml(plan.recMixt)}</div>`);
  }
  main.innerHTML = `
    <button class="btn btn-ghost" id="btn-fisa-inapoi">‹ Înapoi la Azi</button>
    <h2 style="margin-top:8px;">${escapeHtml(clasa.nume)} — ora ${escapeHtml(String(f.ora))}</h2>
    <p class="tab-desc">${ZILE_NUME[ziDinData(azi)]}, ${formatDataRo(azi)} · ${elevi.length} elevi</p>
    ${bannerPracticaHTML(clasa.id)}
    ${sect('Lecția de azi', plan ? `
      <div style="font-size:18px; font-weight:700; color:var(--infield);">${escapeHtml(plan.tema)}</div>
      ${recs.length?`<div style="margin-top:8px; font-size:14px; display:flex; flex-direction:column; gap:4px;">${recs.join('')}</div>`:''}
      ${esteEvaluare?`<div style="margin-top:10px;"><span class="pill pill-yellow">Azi e evaluare</span></div>`:''}
    ` : `<div style="color:var(--muted);">Nicio planificare pentru azi. <a href="#" id="lnk-fisa-plan" style="color:var(--track);">Adaugă una →</a></div>`)}
    ${probeAzi.length ? sect('Probe programate azi', probeAzi.map(p=>`<div>• ${escapeHtml(p.nume)}</div>`).join('')) : ''}
    ${sect('Elevi care cer atenție', (!scutiti.length && !ces.length) ? `<div style="color:var(--muted);">Niciun elev scutit sau cu CES.</div>` : `
      ${scutiti.length ? `<div style="margin-bottom:8px;"><b>Scutiți (${scutiti.length}):</b>${scutiti.map(e=>`<div style="margin-top:4px;">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${scutirePillHTML(e)}${e.motivScutire?` <span style="color:var(--muted); font-size:13px;">— ${escapeHtml(e.motivScutire)}</span>`:''}</div>`).join('')}</div>` : ''}
      ${ces.length ? `<div><b>CES (${ces.length}):</b>${ces.map(e=>`<div style="margin-top:4px;">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}${e.cesDetalii?` <span style="color:var(--muted); font-size:13px;">— ${escapeHtml(e.cesDetalii)}</span>`:''}</div>`).join('')}</div>` : ''}
    `)}
    ${sect('Prezența', `
      <div>${absAzi.length ? `<b>Absenți azi (${absAzi.length}):</b> ${absAzi.map(a=>numeElev(a.eleviId)).join(', ')}` : '<span style="color:var(--muted);">Prezența de azi nu e făcută sau nu e niciun absent.</span>'}</div>
      <div style="margin-top:10px;"><button class="btn btn-primary" id="btn-fisa-prezenta">Fă prezența</button></div>
    `)}
    ${ultimaData ? sect(`La ora trecută (${formatDataRo(ultimaData)})`, (()=>{
      const abs = recUltima.filter(a=>a.stare==='absent').map(a=>numeElev(a.eleviId));
      const obs = recUltima.filter(a=>a.stare!=='absent' && a.nota).map(a=>`<div style="margin-top:3px;">${numeElev(a.eleviId)} — ${escapeHtml(a.nota)}</div>`);
      return `${abs.length?`<div><b>Absenți:</b> ${abs.join(', ')}</div>`:'<div style="color:var(--muted);">Niciun absent.</div>'}${obs.length?`<div style="margin-top:8px;"><b>Observații:</b>${obs.join('')}</div>`:''}`;
    })()) : ''}
    ${sect('Lecția anterioară și următoarea', `
      <div style="font-size:14px;"><b>Anterioară:</b> ${anterioara?`${formatDataRo(anterioara.data)} — ${escapeHtml(anterioara.tema)}`:'—'}</div>
      <div style="font-size:14px; margin-top:4px;"><b>Următoarea:</b> ${urmatoare?`${formatDataRo(urmatoare.data)} — ${escapeHtml(urmatoare.tema)}`:'—'}</div>
    `)}
    ${sect('Notiță pentru ora de azi', `
      <textarea id="txt-fisa-notita" rows="4" style="width:100%;" placeholder="ex: ce a mers bine, ce reiei data viitoare, elevi de urmărit">${escapeHtml(notita?notita.text:'')}</textarea>
      <div style="font-size:12px; color:var(--muted); margin-top:4px;">Se salvează singură.</div>
    `)}
    <div class="row" style="gap:8px; flex-wrap:wrap;">
      <button class="btn btn-secondary" id="btn-fisa-notare">Mergi la Notare</button>
      <button class="btn btn-secondary" id="btn-fisa-curente">Notă curentă</button>
      <button class="btn btn-secondary" id="btn-fisa-planificare">Planificarea clasei</button>
    </div>
  `;
  document.getElementById('btn-fisa-inapoi').addEventListener('click', ()=>{ ui.aziFisa = null; render(); });
  document.getElementById('btn-fisa-prezenta').addEventListener('click', ()=>{
    ui.clasaCurenta = clasa.id; ui.absenteData = azi; currentTab = 'absente'; ui.aziFisa = null; render();
  });
  document.getElementById('btn-fisa-curente').addEventListener('click', ()=>{
    ui.clasaCurenta = clasa.id; ui.curenteData = azi; ui.curenteDetalii = null; currentTab = 'curente'; ui.aziFisa = null; render();
  });
  document.getElementById('btn-fisa-notare').addEventListener('click', ()=>{
    ui.clasaCurenta = clasa.id; currentTab = 'notare'; ui.aziFisa = null; render();
  });
  const goPlan = ()=>{ ui.planificareAn = clasa.an; ui.planificareClasa = clasa.id; currentTab = 'planificare'; ui.aziFisa = null; render(); };
  document.getElementById('btn-fisa-planificare').addEventListener('click', goPlan);
  const lnk = document.getElementById('lnk-fisa-plan');
  if(lnk) lnk.addEventListener('click', ev=>{ ev.preventDefault(); goPlan(); });
  document.getElementById('txt-fisa-notita').addEventListener('input', e=>{
    const text = e.target.value;
    let n = state.notiteOre.find(n=>n.claseId===clasa.id && n.data===azi);
    if(!n){ n = {id:uid(), claseId:clasa.id, data:azi, text:''}; state.notiteOre.push(n); }
    n.text = text;
    if(!text.trim()) state.notiteOre = state.notiteOre.filter(x=>x!==n);
    saveState();
  });
}

function renderCurente(main){
  if(claseActive().length===0){

  }

  const lista = eleviDinClasa(claseId);
  const plan = state.planificari.find(p=>p.claseId===claseId && p.data===ui.curenteData);
  if(ui.curenteDetalii===null || ui.curenteDetalii===undefined) ui.curenteDetalii = plan ? plan.tema : '';
  if(!ui.curenteMotiv) ui.curenteMotiv = MOTIVE_CURENTE[0];
  const esteAltul = ui.curenteMotiv==='Altul…';
  const absentLaData = id => state.absente.some(a=>a.eleviId===id && a.data===ui.curenteData && a.stare==='absent');
  const istoric = (state.noteCurente||[]).filter(n=>n.claseId===claseId).sort((a,b)=>b.data.localeCompare(a.data)).slice(0,150);
  main.innerHTML = `
    <h2>Note curente</h2>
    <p class="tab-desc">O notă pusă la oră, în afara probelor — de exemplu pentru că elevul a respectat indicațiile. Fiecare notă păstrează <b>motivul</b>, iar notele curente se iau în calcul la media din Sinteză.</p>

    <div class="card">
      <div class="row">
        <div class="field"><label>Clasă</label>
          <select id="select-curente-clasa">${claseActive().map(c=>`<option value="${c.id}" ${c.id===claseId?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}</select></div>
        <div class="field"><label>Data</label><input type="date" id="input-curente-data" value="${ui.curenteData}"/></div>
        <div class="field" style="min-width:210px;"><label>Motivul notei</label>
          <select id="select-curente-motiv">${MOTIVE_CURENTE.map(m=>`<option ${m===ui.curenteMotiv?'selected':''}>${escapeHtml(m)}</option>`).join('')}</select></div>
        ${esteAltul ? `<div class="field" style="flex:1; min-width:200px;"><label>Scrie motivul</label><input type="text" id="input-curente-motiv-altul" value="${escapeHtml(ui.curenteMotivAltul||'')}" placeholder="ex: a ajutat la pregătirea terenului"/></div>` : ''}
      </div>
      <div class="row" style="margin-top:10px;">
        <div class="field" style="flex:1; min-width:240px;"><label>La ce activitate / temă</label>
          <input type="text" id="input-curente-detalii" value="${escapeHtml(ui.curenteDetalii)}" placeholder="ex: Fotbal — joc bilateral"/></div>
      </div>
      <div style="font-size:12px; color:var(--muted); margin-top:4px;">${plan?'Tema a fost preluată din planificarea clasei pentru această dată.':'Nicio planificare pentru această dată — scrie tu activitatea.'}</div>
    </div>
    ${lista.length===0 ? emptyState('Niciun elev în această clasă.', 'Adaugă elevi în tabul „Elevi”.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Nr.</th><th>Elev</th><th>Nota</th><th>Observație (opțional)</th></tr></thead>
        <tbody>
          ${lista.map((e,idx)=>`<tr ${esteInactiv(e)?'class="rand-inactiv"':''}>
            <td style="color:var(--muted); text-align:center;">${idx+1}</td>
            <td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${cesTagHTML(e)}${situatieElevHTML(e)}${absentLaData(e.id)?'<div style="font-size:12px; font-weight:600; color:var(--danger); margin-top:2px;">● Absent</div>':''}${noteCurenteElev(e.id).length?`<div style="margin-top:2px;">${noteCurenteElev(e.id).slice(-4).map(notaCurentaPillHTML).join('')}</div>`:''}</td>
            <td>${blocheazaNotarea(e) ? motivBlocareHTML(e,true) : `<input type="number" inputmode="decimal" min="1" max="10" step="0.5" class="grade-input inp-curenta" data-elev="${e.id}" placeholder="—"/>`}</td>
            <td>${blocheazaNotarea(e) ? '' : `<input type="text" class="inp-curenta-obs" data-elev="${e.id}" placeholder="opțional" style="width:100%; min-width:120px;"/>`}</td>

        </tbody>
      </table>

    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Data</th><th>Elev</th><th>Nota</th><th>Motiv</th><th>Activitate / observație</th><th></th></tr></thead>
        <tbody>${istoric.map(n=>{ const e = state.elevi.find(x=>x.id===n.eleviId); return `<tr>
          <td>${formatDataRo(n.data)}</td><td>${e?escapeHtml(e.nume)+' '+escapeHtml(e.prenume):'—'}</td><td><strong>${n.valoare}</strong></td>

  document.getElementById('select-curente-motiv').addEventListener('change', e=>{ ui.curenteMotiv = e.target.value; render(); });
  const mAltul = document.getElementById('input-curente-motiv-altul');
  if(mAltul) mAltul.addEventListener('input', e=>{ ui.curenteMotivAltul = e.target.value; });
  document.getElementById('input-curente-detalii').addEventListener('input', e=>{ ui.curenteDetalii = e.target.value; });
  const btn = document.getElementById('btn-salveaza-curente');
  if(btn) btn.addEventListener('click', ()=>{
    const motiv = ui.curenteMotiv==='Altul…' ? (ui.curenteMotivAltul||'').trim() : ui.curenteMotiv;
    if(!motiv) return showToast('Scrie motivul notei.');
    const noi = [];
    for(const inp of main.querySelectorAll('.inp-curenta')){
      const brut = inp.value.trim().replace(',','.');
      if(!brut) continue;
      const v = parseFloat(brut);
      if(isNaN(v) || v<1 || v>10) return showToast('Notele trebuie să fie între 1 și 10.');
      const obs = (main.querySelector(`.inp-curenta-obs[data-elev="${inp.dataset.elev}"]`)||{value:''}).value.trim();
      noi.push({id:uid(), eleviId:inp.dataset.elev, claseId, data:ui.curenteData, valoare:v, motiv, detalii:(ui.curenteDetalii||'').trim(), obs});
    }
    if(!noi.length) return showToast('Nu ai scris nicio notă.');
    state.noteCurente.push(...noi);
    saveState(); render(); showToast(noi.length===1 ? 'Nota curentă salvată.' : `${noi.length} note curente salvate.`);
  });
  main.querySelectorAll('[data-del-curenta]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('Ștergi această notă curentă?')) return;
      state.noteCurente = state.noteCurente.filter(n=>n.id!==b.dataset.delCurenta);
      saveState(); render(); showToast('Notă ștearsă.');
    });
  });
}


/* ================= TAB: ECHIPE REPREZENTATE (U16 / U18, pe sporturi) ================= */
function anNastereElev(e){ return (e && e.dataNasterii) ? parseInt(String(e.dataNasterii).slice(0,4),10) : null; }
function varstaElev(e){
  if(!e || !e.dataNasterii) return null;
  const n = new Date(e.dataNasterii+'T12:00:00'), a = new Date();
  let v = a.getFullYear()-n.getFullYear();
  if(a.getMonth()<n.getMonth() || (a.getMonth()===n.getMonth() && a.getDate()<n.getDate())) v--;
  return v;
}
function limiteEchipe(){
  const y = parseInt(state.settings.anScolar,10) || new Date().getFullYear();
  const l = state.settings.echipeLimite || {};
  return {U16: l.U16 || (y-15), U18: l.U18 || (y-17)};
}
// avertismente pentru un elev într-o categorie (pastile mici)
function avertismenteEchipa(e, cat, m){
  const out = [];
  if(!e) return out;
  if(esteInactiv(e)) out.push(`<span class="pill pill-yellow">${etichetaSituatie(e).toLowerCase()}</span>`);
  else if(blocheazaNotarea(e)) out.push('<span class="pill pill-danger" title="Scutire medicală totală activă">scutit medical</span>');
  else if(scutirePartialaActiva(e)) out.push('<span class="pill pill-blue" title="Scutire parțială — verifică ce are voie">scutire parțială</span>');
  const an = anNastereElev(e);
  if(an==null) out.push('<span class="pill pill-yellow" title="Completează data nașterii în tabul Elevi">fără dată naștere</span>');
  else if(cat && an < limiteEchipe()[cat]) out.push(`<span class="pill pill-danger" title="Născut în ${an}; limita ${cat}: ${limiteEchipe()[cat]} sau mai târziu">peste limita ${cat}</span>`);
  if(m){
    if(m.aviz && m.aviz < todayISO()) out.push('<span class="pill pill-danger" title="Avizul medical sportiv a expirat">aviz expirat</span>');
    else if(!m.aviz) out.push('<span class="pill pill-ghost" title="Nu ai trecut avizul medical">fără aviz</span>');
    if(!m.acord) out.push('<span class="pill pill-ghost" title="Acordul părinților nu e bifat">fără acord</span>');
  }
  return out;
}
function tabelNominalEchipa(cat, sport){
  const membri = state.echipe.filter(m=>m.categorie===cat && m.sport===sport).map(m=>({m, e:state.elevi.find(x=>x.id===m.eleviId)})).filter(x=>x.e)
    .sort((a,b)=>a.e.nume.localeCompare(b.e.nume,'ro')||a.e.prenume.localeCompare(b.e.prenume,'ro'));
  const rows = membri.map((x,i)=>{ const c = state.clase.find(k=>k.id===x.e.claseId);
    return `<tr><td>${i+1}</td><td>${escapeHtml(x.e.nume)} ${escapeHtml(x.e.prenume)}</td><td>${x.e.dataNasterii?formatDataRo(x.e.dataNasterii):''}</td><td>${c?escapeHtml(c.nume):''}</td><td>${escapeHtml(String(x.m.tricou||''))}</td><td>${escapeHtml(x.m.pozitie||'')}</td><td>${x.m.aviz?formatDataRo(x.m.aviz):''}</td><td></td></tr>`; }).join('');
  const html = `<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><title>Tabel nominal ${escapeHtml(sport)} ${cat}</title>
<style>body{font-family:Arial,sans-serif;padding:24px;color:#111;} h1{font-size:20px;margin:0 0 4px;} .sub{color:#444;font-size:13px;margin-bottom:16px;} table{width:100%;border-collapse:collapse;font-size:14px;} th,td{border:1px solid #333;padding:7px 8px;text-align:left;} th{background:#eee;} .sem{margin-top:40px;display:flex;justify-content:space-between;font-size:14px;} .btn-print{padding:8px 14px;margin-bottom:16px;} @media print{.btn-print{display:none;}}</style></head><body>
<button class="btn-print" onclick="window.print()">🖨 Printează / Salvează PDF</button>
<h1>TABEL NOMINAL — ${escapeHtml(sport)} ${cat}</h1>
<div class="sub">${escapeHtml(state.settings.scoalaTabel||'')} · An școlar ${escapeHtml(state.settings.anScolar)}<br>Profesor coordonator: ${escapeHtml(state.settings.profesorTabel||'')}</div>
<table><thead><tr><th>Nr.</th><th>Nume și prenume</th><th>Data nașterii</th><th>Clasa</th><th>Nr. tricou</th><th>Poziție</th><th>Aviz medical până la</th><th>Semnătură</th></tr></thead><tbody>${rows}</tbody></table>
<div class="sem"><span>Director,<br><br>______________</span><span>Profesor coordonator,<br><br>${escapeHtml(state.settings.profesorTabel||'______________')}</span></div>
</body></html>`;
  const w = window.open('', '_blank');
  if(!w){ showToast('Permite ferestrele pop-up ca să vezi tabelul.'); return; }
  w.document.open(); w.document.write(html); w.document.close();
}
function renderEchipe(main){

    main.innerHTML = `<h2>Echipe reprezentate</h2>` + emptyState('Nu ai nicio clasă.', 'Adaugă mai întâi clase și elevi.');

  }

  const add = ui.echipeAdd;
  if(!add.cat) add.cat = 'U16';
  if(!add.sport || !state.sporturiEchipe.includes(add.sport)) add.sport = state.sporturiEchipe[0];
  if(!add.clasa || !claseActive().find(c=>c.id===add.clasa)) add.clasa = claseActive()[0].id;
  const filtCat = ui.echipeFiltCat || 'toate', filtSport = ui.echipeFiltSport || 'toate';
  const lim = limiteEchipe();
  const eleviClasa = eleviDinClasa(add.clasa);
  const dejaIn = new Set(state.echipe.filter(m=>m.categorie===add.cat && m.sport===add.sport).map(m=>m.eleviId));
  // grupuri (sport + categorie)

    .map(k=>{ const [sport,cat]=k.split('||'); return {sport,cat}; })

    .sort((a,b)=>a.sport.localeCompare(b.sport,'ro')||a.cat.localeCompare(b.cat));
  const elevUnici = new Set(state.echipe.map(m=>m.eleviId)).size;

  main.innerHTML = `
    <h2>Echipe reprezentate</h2>
    <p class="tab-desc">Elevii care reprezintă școala, pe categorii (U16, U18) și pe sporturi. Datele (clasă, naștere, înălțime, greutate, scutiri) vin direct din fișa elevului. Un elev poate fi în mai multe sporturi. ${elevUnici?`<b>${elevUnici}</b> elevi în echipe.`:''}</p>

    <div class="card">
      <div style="font-weight:700; color:var(--infield); margin-bottom:8px;">Adaugă elevi într-o echipă</div>
      <div class="row">
        <div class="field"><label>Categorie</label><select id="ech-add-cat"><option value="U16" ${add.cat==='U16'?'selected':''}>U16</option><option value="U18" ${add.cat==='U18'?'selected':''}>U18</option></select></div>
        <div class="field"><label>Sport</label><select id="ech-add-sport">${state.sporturiEchipe.map(sp=>`<option ${sp===add.sport?'selected':''}>${escapeHtml(sp)}</option>`).join('')}</select></div>
        <div class="field"><label>Din clasa</label><select id="ech-add-clasa">${claseActive().map(c=>`<option value="${c.id}" ${c.id===add.clasa?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}</select></div>
      </div>
      <div class="row" style="margin-top:8px;">
        <div class="field" style="flex:1; min-width:180px;"><label>Sport nou (dacă nu e în listă)</label><input type="text" id="ech-sport-nou" placeholder="ex: Rugby, Tenis, Orientare"/></div>
        <button class="btn btn-secondary" id="ech-sport-adauga">+ Adaugă sportul</button>
      </div>
      <div class="add-elev-list card" style="padding:0; margin:12px 0 8px; max-height:340px; overflow-y:auto;">
        ${eleviClasa.length===0 ? '<div style="padding:12px; color:var(--muted);">Niciun elev în clasa aleasă.</div>' : eleviClasa.map(e=>{
          const deja = dejaIn.has(e.id);
          const av = avertismenteEchipa(e, add.cat, null).join(' ');
          const an = anNastereElev(e);
          return `<label class="${deja?'deja':''}"><input type="checkbox" class="ech-chk" data-elev="${e.id}" ${deja?'checked disabled':''}/> <span style="flex:1;"><b>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</b> <span style="color:var(--muted); font-size:13px;">· ${e.sex==='F'?'F':'B'}${an?' · '+an:''}${deja?' · deja în echipă':''}</span> ${cesTagHTML(e)} ${av}</span></label>`;
        }).join('')}
      </div>
      <div class="row">
        <button class="btn btn-primary" id="ech-add-btn">Adaugă elevii bifați în ${escapeHtml(add.sport)} ${add.cat}</button>
        <button class="btn btn-ghost" id="ech-toti-btn">Bifează toată clasa</button>
      </div>
    </div>

    <details class="card">
      <summary style="cursor:pointer; font-weight:700; color:var(--infield);">Reguli de vârstă și date pentru tabelul nominal</summary>
      <p class="tab-desc" style="margin-top:8px;">Pentru anul școlar ${escapeHtml(state.settings.anScolar)}, aplicația avertizează dacă un elev e născut <b>înaintea</b> anului limită. Verifică regulamentul competiției și corectează dacă e altfel.</p>
      <div class="row">
        <div class="field"><label>U16 — născuți în anul … sau mai târziu</label><input type="number" id="ech-lim-u16" value="${lim.U16}" style="width:110px;"/></div>
        <div class="field"><label>U18 — născuți în anul … sau mai târziu</label><input type="number" id="ech-lim-u18" value="${lim.U18}" style="width:110px;"/></div>
      </div>
      <div class="row" style="margin-top:8px;">
        <div class="field" style="flex:1; min-width:220px;"><label>Școala (pe tabelul nominal)</label><input type="text" id="ech-scoala" value="${escapeHtml(state.settings.scoalaTabel||'')}"/></div>
        <div class="field" style="min-width:180px;"><label>Profesor coordonator</label><input type="text" id="ech-profesor" value="${escapeHtml(state.settings.profesorTabel||'')}"/></div>
      </div>
      <div style="margin-top:10px;"><button class="btn btn-secondary" id="ech-salveaza-setari">Salvează</button></div>
    </details>

    <div class="row" style="margin:14px 0 10px;">
      <div class="field"><label>Arată categoria</label><select id="ech-filt-cat"><option value="toate">Toate</option><option ${filtCat==='U16'?'selected':''}>U16</option><option ${filtCat==='U18'?'selected':''}>U18</option></select></div>
      <div class="field"><label>Arată sportul</label><select id="ech-filt-sport"><option value="toate">Toate</option>${state.sporturiEchipe.map(sp=>`<option ${sp===filtSport?'selected':''}>${escapeHtml(sp)}</option>`).join('')}</select></div>
      ${state.echipe.length?`<button class="btn btn-secondary" id="ech-excel" style="align-self:flex-end;">📊 Excel echipe</button>`:''}
    </div>

    ${chei.length===0 ? emptyState('Nicio echipă încă.', 'Alege mai sus categoria, sportul și clasa, bifează elevii și apasă „Adaugă”.') : chei.map(g=>{
      const membri = state.echipe.filter(m=>m.categorie===g.cat && m.sport===g.sport)
        .map(m=>({m, e:state.elevi.find(x=>x.id===m.eleviId)})).filter(x=>x.e)
        .sort((a,b)=>a.e.nume.localeCompare(b.e.nume,'ro')||a.e.prenume.localeCompare(b.e.prenume,'ro'));
      const nB = membri.filter(x=>x.e.sex!=='F').length, nF = membri.length-nB;
      const meciuri = state.meciuriEchipe.filter(x=>x.categorie===g.cat && x.sport===g.sport).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
      const cheie = `${g.sport}||${g.cat}`;
      return `<div class="card echipa-card" data-echipa="${escapeHtml(cheie)}">
        <div class="echipa-head">
          <h3><span class="pill-cat ${g.cat==='U16'?'u16':''}">${g.cat}</span> ${escapeHtml(g.sport)} <span style="font-weight:400; color:var(--muted); font-size:14px;">— ${membri.length} ${membri.length===1?'elev':'elevi'} (${nB} ${nB===1?'băiat':'băieți'}, ${nF} ${nF===1?'fată':'fete'})</span></h3>
          <button class="btn btn-secondary" data-nominal="${escapeHtml(cheie)}">🖨 Tabel nominal</button>
        </div>
        <div style="overflow-x:auto;"><table class="echipa-tbl">
          <thead><tr><th>Nr.</th><th>Elev</th><th>Clasa</th><th>Naștere</th><th>Î/G</th><th>Poziție</th><th>Tricou</th><th>Aviz medical până la</th><th>Acord</th><th>Observații</th><th></th></tr></thead>
          <tbody>${membri.map((x,i)=>{
            const c = state.clase.find(k=>k.id===x.e.claseId), v = varstaElev(x.e);
            return `<tr data-membru="${x.m.id}">
              <td style="color:var(--muted); text-align:center;">${i+1}</td>
              <td class="student-name">${escapeHtml(x.e.nume)} ${escapeHtml(x.e.prenume)} ${cesTagHTML(x.e)}<div>${avertismenteEchipa(x.e, g.cat, x.m).join(' ')}</div></td>
              <td>${c?escapeHtml(c.nume):''}</td>
              <td style="white-space:nowrap;">${x.e.dataNasterii?formatDataRo(x.e.dataNasterii):'—'}${v!=null?`<div style="font-size:12px; color:var(--muted);">${v} ani</div>`:''}</td>
              <td style="white-space:nowrap; font-size:13px;">${x.e.inaltime||'—'} / ${x.e.greutate||'—'}</td>
              <td><input type="text" data-camp="pozitie" value="${escapeHtml(x.m.pozitie||'')}" style="width:100px;" placeholder="ex: portar"/></td>
              <td><input type="number" data-camp="tricou" value="${escapeHtml(String(x.m.tricou||''))}" style="width:64px;" min="0" max="99"/></td>
              <td><input type="date" data-camp="aviz" value="${x.m.aviz||''}"/></td>
              <td style="text-align:center;"><input type="checkbox" data-camp="acord" ${x.m.acord?'checked':''} style="width:22px; height:22px;"/></td>
              <td><input type="text" data-camp="obs" value="${escapeHtml(x.m.obs||'')}" style="min-width:150px; width:100%;" placeholder="observații"/></td>
              <td><button class="btn btn-danger" data-scoate="${x.m.id}" title="Scoate din echipă">${ICONS.trash}</button></td>
            </tr>`; }).join('')}</tbody>
        </table></div>
        <details style="margin-top:10px;">
          <summary style="cursor:pointer; font-weight:600; color:var(--infield);">Meciuri și competiții (${meciuri.length})</summary>
          <div class="row" style="margin:10px 0;">
            <div class="field"><label>Data</label><input type="date" class="mec-data" value="${todayISO()}"/></div>
            <div class="field" style="flex:1; min-width:170px;"><label>Eveniment / adversar</label><input type="text" class="mec-eveniment" placeholder="ex: faza locală ONSS, cu Liceul X"/></div>
            <div class="field"><label>Rezultat</label><input type="text" class="mec-rezultat" placeholder="ex: 3-1" style="width:90px;"/></div>
            <div class="field" style="flex:1; min-width:150px;"><label>Observații</label><input type="text" class="mec-obs"/></div>
            <button class="btn btn-secondary" data-mec-add="${escapeHtml(cheie)}">+ Adaugă</button>
          </div>
          ${meciuri.length?`<table><thead><tr><th>Data</th><th>Eveniment / adversar</th><th>Rezultat</th><th>Observații</th><th></th></tr></thead><tbody>${meciuri.map(x=>`<tr><td>${formatDataRo(x.data)}</td><td>${escapeHtml(x.eveniment||'')}</td><td><b>${escapeHtml(x.rezultat||'')}</b></td><td>${escapeHtml(x.obs||'')}</td><td><button class="btn btn-danger" data-mec-del="${x.id}">${ICONS.trash}</button></td></tr>`).join('')}</tbody></table>`:'<div style="color:var(--muted); font-size:14px;">Niciun meci înregistrat.</div>'}
        </details>
      </div>`;
    }).join('')}
  `;

  // selecturi
  document.getElementById('ech-add-cat').addEventListener('change', e=>{ add.cat = e.target.value; render(); });
  document.getElementById('ech-add-sport').addEventListener('change', e=>{ add.sport = e.target.value; render(); });
  document.getElementById('ech-add-clasa').addEventListener('change', e=>{ add.clasa = e.target.value; render(); });
  document.getElementById('ech-filt-cat').addEventListener('change', e=>{ ui.echipeFiltCat = e.target.value; render(); });
  document.getElementById('ech-filt-sport').addEventListener('change', e=>{ ui.echipeFiltSport = e.target.value; render(); });
  document.getElementById('ech-sport-adauga').addEventListener('click', ()=>{
    const inp = document.getElementById('ech-sport-nou'); const nume = inp.value.trim();
    if(!nume) return showToast('Scrie numele sportului.');
    if(state.sporturiEchipe.some(x=>x.toLowerCase()===nume.toLowerCase())) return showToast('Sportul există deja în listă.');
    state.sporturiEchipe.push(nume); add.sport = nume; saveState(); render(); showToast('Sport adăugat.');
  });
  document.getElementById('ech-toti-btn').addEventListener('click', ()=>{
    main.querySelectorAll('.ech-chk:not(:disabled)').forEach(c=>c.checked = true);
  });
  document.getElementById('ech-add-btn').addEventListener('click', ()=>{
    const ids = [...main.querySelectorAll('.ech-chk:not(:disabled):checked')].map(c=>c.dataset.elev);
    if(!ids.length) return showToast('Bifează cel puțin un elev.');
    ids.forEach(id=>state.echipe.push({id:uid(), eleviId:id, categorie:add.cat, sport:add.sport, pozitie:'', tricou:'', aviz:'', acord:false, obs:''}));
    saveState(); render(); showToast(`${ids.length} ${ids.length===1?'elev adăugat':'elevi adăugați'} în ${add.sport} ${add.cat}.`);
  });
  document.getElementById('ech-salveaza-setari').addEventListener('click', ()=>{
    const n = x=>{ const v = parseInt(document.getElementById(x).value,10); return isNaN(v)?null:v; };
    state.settings.echipeLimite = {U16:n('ech-lim-u16'), U18:n('ech-lim-u18')};
    state.settings.scoalaTabel = document.getElementById('ech-scoala').value.trim();
    state.settings.profesorTabel = document.getElementById('ech-profesor').value.trim();
    saveState(); render(); showToast('Salvat.');
  });
  const bx = document.getElementById('ech-excel'); if(bx) bx.addEventListener('click', ()=>genereazaRaportExcelGeneral());
  // câmpurile unui membru: se salvează pe loc, fără redesenare
  main.querySelectorAll('tr[data-membru] [data-camp]').forEach(inp=>{
    const salv = ()=>{
      const m = state.echipe.find(x=>x.id===inp.closest('tr').dataset.membru); if(!m) return;
      m[inp.dataset.camp] = inp.type==='checkbox' ? inp.checked : inp.value.trim();
      saveState();
      if(inp.dataset.camp==='aviz' || inp.dataset.camp==='acord'){ // reîmprospătăm doar pastilele de avertisment
        const tr = inp.closest('tr'), e = state.elevi.find(x=>x.id===m.eleviId);
        tr.querySelector('.student-name div').innerHTML = avertismenteEchipa(e, m.categorie, m).join(' ');
      }
    };
    inp.addEventListener(inp.type==='text'||inp.type==='number' ? 'input' : 'change', salv);
  });
  main.querySelectorAll('[data-scoate]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Scoți elevul din această echipă?')) return;
    state.echipe = state.echipe.filter(m=>m.id!==b.dataset.scoate); saveState(); render(); showToast('Elev scos din echipă.');
  }));
  main.querySelectorAll('[data-nominal]').forEach(b=>b.addEventListener('click', ()=>{ const [sport,cat]=b.dataset.nominal.split('||'); tabelNominalEchipa(cat, sport); }));
  main.querySelectorAll('[data-mec-add]').forEach(b=>b.addEventListener('click', ()=>{
    const card = b.closest('.echipa-card'); const [sport,cat] = b.dataset.mecAdd.split('||');
    const ev = card.querySelector('.mec-eveniment').value.trim(), data = card.querySelector('.mec-data').value;
    if(!ev) return showToast('Scrie evenimentul sau adversarul.');
    state.meciuriEchipe.push({id:uid(), categorie:cat, sport, data, eveniment:ev, rezultat:card.querySelector('.mec-rezultat').value.trim(), obs:card.querySelector('.mec-obs').value.trim()});
    saveState(); ui._deschisMeciuri = b.dataset.mecAdd; render(); showToast('Meci adăugat.');
    const nou = main.querySelector(`.echipa-card[data-echipa="${CSS.escape(b.dataset.mecAdd)}"] details:last-of-type`); if(nou) nou.open = true;
  }));
  main.querySelectorAll('[data-mec-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('Ștergi acest meci?')) return;
    state.meciuriEchipe = state.meciuriEchipe.filter(x=>x.id!==b.dataset.mecDel); saveState(); render();
  }));
}

function renderClase(main){
  main.innerHTML = `
    <h2>Clase</h2>
    <p class="tab-desc">Adaugă clasele la care predai. Fiecare clasă își are propria listă de elevi.</p>
    <div class="card">
      <div class="row">
        <div class="field" style="flex:1; min-width:180px;">
          <label>Nume clasă</label>
          <input type="text" id="input-clasa-nume" placeholder="ex: a IX-a A" />
        </div>
        <div class="field">
          <label>An de studiu</label>
          <select id="input-clasa-an">${ANI.map(a=>`<option value="${a}">${a}</option>`).join('')}</select>

        <button class="btn btn-primary" id="btn-add-clasa">+ Adaugă clasă</button>
      </div>

            </div>
          </div>`;

    const inp = document.getElementById('input-clasa-nume');
    const an = document.getElementById('input-clasa-an').value;
    const nume = inp.value.trim();
    if(!nume) return showToast('Scrie numele clasei.');
    state.clase.push({id:uid(), nume, an, arhivata:false, anScolar:state.settings.anScolar, practica:[]});
    saveState(); render(); showToast('Clasă adăugată.');
  });
  main.querySelectorAll('[data-rename]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const c = state.clase.find(c=>c.id===b.dataset.rename);
      const nou = prompt('Nume nou pentru clasă:', c.nume);
      if(nou && nou.trim()){ c.nume = nou.trim(); saveState(); render(); }
    });
  });
  main.querySelectorAll('[data-arhiveaza]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const c = state.clase.find(c=>c.id===b.dataset.arhiveaza);
      if(!confirm(`Muți clasa „${c.nume}” la Arhivă? Nu dispare nimic — o poți restaura oricând din tabul Arhivă.`)) return;
      c.arhivata = true;
      saveState(); render(); showToast('Clasă arhivată.');
    });
  });
  main.querySelectorAll('[data-an-clasa]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const c = state.clase.find(c=>c.id===sel.dataset.anClasa);
      c.an = sel.value; saveState(); showToast('An actualizat.');
    });
  });
  main.querySelectorAll('[data-del-clasa]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.delClasa;
      const nr = eleviDinClasa(id).length;
      const msg = nr>0
        ? `Această clasă are ${nr} elev(i). Ștergând clasa, se șterg și elevii, notele, absențele și probele asociate. Continui?`
        : 'Ștergi această clasă?';
      if(!confirm(msg)) return;
      const eleviIds = state.elevi.filter(e=>e.claseId===id).map(e=>e.id);
      state.clase = state.clase.filter(c=>c.id!==id);
      state.elevi = state.elevi.filter(e=>e.claseId!==id);
      state.probe = state.probe.filter(p=>p.claseId!==id);
      state.note = state.note.filter(n=>!eleviIds.includes(n.eleviId));
      state.noteCurente = (state.noteCurente||[]).filter(n=>!eleviIds.includes(n.eleviId));
      state.echipe = (state.echipe||[]).filter(m=>!eleviIds.includes(m.eleviId));
      state.absente = state.absente.filter(a=>!eleviIds.includes(a.eleviId));
      saveState(); render(); showToast('Clasă ștearsă.');
    });
  });
}

/* ================= RAPORT DE CLASĂ (printabil / salvabil ca PDF) ================= */
function genereazaRaportClasa(claseId){
  const clasa = state.clase.find(c=>c.id===claseId);
  const lista = eleviDinClasa(claseId);
  const probeClasa = state.probe.filter(p=>probaSeAplicaClasei(p, claseId)).sort((a,b)=>a.data.localeCompare(b.data));

  const tipRaport = ui.sintezaTipRaport || 'simplu';
  const randuriNote = lista.map(e=>{
    const noteNumerice = [];
    const celule = probeClasa.map(p=>{
      if(blocheazaNotarea(e)) return motivBlocareText(e);
      if(tipRaport==='ppt'){
        const r = calculeazaPPP(e.id, p.id);
        if(!r) return '—';
        if(r.notaFinala==null) return 'fără Tehnică';
        noteNumerice.push(r.notaFinala);
        return `P:${r.performanta.toFixed(1)} Pr:${r.progres.toFixed(1)} T:${r.tehnica.toFixed(1)} = ${r.notaFinala.toFixed(2)}`;
      }
      const rec = notaPentruSinteza(e.id, p.id);
      if(!rec) return '—';
      const eticheta = rec.moment==='final' ? 'F' : 'I';
      const dataStr = formatDataRo(rec.data);
      if(rec.notaCalculata!=null){ noteNumerice.push(rec.notaCalculata); return `${rec.valoare} [${eticheta}, ${dataStr}] (${rec.notaCalculata})`; }
      const numeric = parseFloat(String(rec.valoare).replace(',','.'));
      if(!isNaN(numeric) && numeric>=1 && numeric<=10) noteNumerice.push(numeric);
      return `${rec.valoare} [${eticheta}, ${dataStr}]`;
    });
    noteCurenteNumerice(e.id).forEach(v=>noteNumerice.push(v));
    const textCurente = noteCurenteElev(e.id).map(n=>`${n.valoare} (${n.motiv||''}${n.detalii?', '+n.detalii:''}, ${formatDataRo(n.data)})`).join('; ');
    const medie = noteNumerice.length ? (noteNumerice.reduce((a,b)=>a+b,0)/noteNumerice.length).toFixed(2) : '—';
    return `<tr>
      <td>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}${e.ces ? '<span style="color:#6B3FA0; font-weight:700;"> (CES)</span>' : ''}</td>
      ${celule.map(c=>`<td>${escapeHtml(String(c))}</td>`).join('')}
      <td>${escapeHtml(textCurente)}</td>
      <td><strong>${medie}</strong></td>
    </tr>`;
  }).join('');

  const randuriAbsente = lista.map(e=>{
    const absElev = state.absente.filter(a=>a.eleviId===e.id);
    const absente = absElev.filter(a=>a.stare==='absent').length;
    const observatii = absElev.filter(a=>a.nota && a.nota.trim())
                               .sort((a,b)=>a.data.localeCompare(b.data))
                               .map(a=>`${formatDataRo(a.data)}: ${a.nota}`)
                               .join('; ');
    return `<tr>
      <td>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}${e.ces ? '<span style="color:#6B3FA0; font-weight:700;"> (CES)</span>' : ''}</td>
      <td>${absente}</td>
      <td>${escapeHtml(observatii)}</td>
    </tr>`;
  }).join('');

  const randuriAntropo = lista.map(e=>{
    const imc = (e.inaltime && e.greutate) ? (e.greutate / ((e.inaltime/100)*(e.inaltime/100))).toFixed(1) : '—';
    const catIMC = imc!=='—' ? categorieIMC(parseFloat(imc), claseAn(e.claseId), e.sex) : null;
    return `<tr>
      <td>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</td>
      <td>${e.inaltime || '—'}</td>
      <td>${e.greutate || '—'}</td>
      <td>${imc}</td>
      <td>${catIMC ? catIMC.eticheta : '—'}</td>
    </tr>`;
  }).join('');

  const html = `<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8">
<title>Raport ${escapeHtml(clasa ? clasa.nume : '')} — Catalog EFS</title>
<style>
  body{font-family: Arial, sans-serif; color:#1a1a1a; padding:24px; max-width:1100px; margin:0 auto;}
  h1{font-size:22px; margin-bottom:2px;}
  .sub{color:#555; margin-bottom:24px; font-size:13px;}
  h2{font-size:16px; margin-top:32px; border-bottom:2px solid #22402C; padding-bottom:4px; color:#22402C;}
  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:12px;}
  th,td{border:1px solid #ccc; padding:6px 8px; text-align:left;}
  th{background:#f0efe9;}
  .btn-print{
    position:fixed; top:16px; right:16px; background:#C1440E; color:#fff; border:none;
    padding:10px 18px; border-radius:6px; font-weight:700; cursor:pointer; font-size:14px;
  }
  @media print{ .btn-print{ display:none; } body{ padding:0; } }
</style>
</head>
<body>
  <button class="btn-print" onclick="window.print()">🖨 Printează / Salvează PDF</button>
  <h1>Raport clasă — ${escapeHtml(clasa ? clasa.nume : '')}</h1>
  <div class="sub">Generat la ${formatDataRo(todayISO())}, ora ${new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}</div>

  <h2>${tipRaport==='ppt' ? 'Note pe probe — PPT (Performanță / Progres / Tehnică)' : 'Note pe probe'}</h2>
  <p style="font-size:12px; color:#666;">${tipRaport==='ppt'
    ? 'P = Performanță, Pr = Progres, T = Tehnică de execuție (dată de profesor). Formula și procentele curente: Performanță×'+state.pppPonderi.performanta+'% + Progres×'+state.pppPonderi.progres+'% + Tehnică×'+state.pppPonderi.tehnica+'%' + (state.pppPonderi.participareActiva ? ' + Participare×'+state.pppPonderi.participare+'%' : '') + '.'
    : '[I] = rezultatul testării inițiale, [F] = rezultatul testării finale (apare finala, dacă există).'}</p>
  ${probeClasa.length===0 ? '<p>Nicio probă înregistrată.</p>' : `
  <table>
    <thead><tr><th>Elev</th>${probeClasa.map(p=>`<th>${escapeHtml(p.nume)}</th>`).join('')}<th>Note curente</th><th>Medie</th></tr></thead>
    <tbody>${randuriNote}</tbody>
  </table>`}

  <h2>Absențe și observații</h2>
  <table>
    <thead><tr><th>Elev</th><th>Absențe</th><th>Observații</th></tr></thead>
    <tbody>${randuriAbsente}</tbody>
  </table>

  <h2>Date antropometrice</h2>
  <p style="font-size:11px; color:#888;">Categoria IMC e orientativă, pe grupe de vârstă și sex — nu înlocuiește o evaluare medicală.</p>
  <table>
    <thead><tr><th>Elev</th><th>Înălțime (cm)</th><th>Greutate (kg)</th><th>IMC</th><th>Categorie</th></tr></thead>
    <tbody>${randuriAntropo}</tbody>
  </table>
</body></html>`;

  const w = window.open('', '_blank');
  if(!w){ showToast('Permite ferestrele pop-up ca să vezi raportul.'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

/* ================= RAPORT EXCEL PE CLASĂ ================= */
function genereazaRaportExcelClasa(claseId){
  if(typeof XLSX==='undefined'){ showToast('Biblioteca Excel nu s-a încărcat. Deschide aplicația o dată cu internet și încearcă din nou.'); return; }
  const clasa = state.clase.find(c=>c.id===claseId);
  const lista = eleviDinClasa(claseId);
  const probeClasa = state.probe.filter(p=>probaSeAplicaClasei(p, claseId)).sort((a,b)=>a.data.localeCompare(b.data));

  // Foaia 1: Note pe probe
  const tipRaport = ui.sintezaTipRaport || 'simplu';
  const antetNote = ['Elev', ...probeClasa.map(p=>p.nume), 'Note curente', 'Medie'];
  const randuriNote = lista.map(e=>{
    const noteNumerice = [];
    const celule = probeClasa.map(p=>{
      if(blocheazaNotarea(e)) return motivBlocareText(e);
      if(tipRaport==='ppt'){
        const r = calculeazaPPP(e.id, p.id);
        if(!r) return '';
        if(r.notaFinala==null) return 'fără Tehnică';
        noteNumerice.push(r.notaFinala);
        return `P:${r.performanta.toFixed(1)} Pr:${r.progres.toFixed(1)} T:${r.tehnica.toFixed(1)} = ${r.notaFinala.toFixed(2)}`;
      }
      const rec = notaPentruSinteza(e.id, p.id);
      if(!rec) return '';
      const eticheta = rec.moment==='final' ? 'F' : 'I';
      if(rec.notaCalculata!=null){ noteNumerice.push(rec.notaCalculata); return `${rec.valoare} [${eticheta}] (${rec.notaCalculata})`; }
      const numeric = parseFloat(String(rec.valoare).replace(',','.'));
      if(!isNaN(numeric) && numeric>=1 && numeric<=10) noteNumerice.push(numeric);
      return `${rec.valoare} [${eticheta}]`;
    });
    noteCurenteNumerice(e.id).forEach(v=>noteNumerice.push(v));
    const textCurente = noteCurenteElev(e.id).map(n=>`${n.valoare} (${n.motiv||''}${n.detalii?', '+n.detalii:''}, ${formatDataRo(n.data)})`).join('; ');
    const medie = noteNumerice.length ? Number((noteNumerice.reduce((a,b)=>a+b,0)/noteNumerice.length).toFixed(2)) : '';
    return [`${e.nume} ${e.prenume}`, ...celule, textCurente, medie];
  });

  // Foaia 2: Absențe și observații
  const antetAbsente = ['Elev', 'Absențe', 'Observații'];
  const randuriAbsente = lista.map(e=>{
    const absElev = state.absente.filter(a=>a.eleviId===e.id);
    const absente = absElev.filter(a=>a.stare==='absent').length;
    const observatii = absElev.filter(a=>a.nota && a.nota.trim())
                               .sort((a,b)=>a.data.localeCompare(b.data))
                               .map(a=>`${formatDataRo(a.data)}: ${a.nota}`)
                               .join('; ');
    return [`${e.nume} ${e.prenume}`, absente, observatii];
  });

  // Foaia 3: Date antropometrice
  const antetAntropo = ['Elev', 'Cod unic', 'Data nașterii', 'Înălțime (cm)', 'Greutate (kg)', 'IMC', 'Categorie', 'CES'];
  const randuriAntropo = lista.map(e=>{
    const imc = (e.inaltime && e.greutate) ? Number((e.greutate / ((e.inaltime/100)*(e.inaltime/100))).toFixed(1)) : '';
    const catIMC = imc!=='' ? categorieIMC(imc, claseAn(e.claseId), e.sex) : null;
    return [`${e.nume} ${e.prenume}`, e.codUnic||'', e.dataNasterii ? formatDataRo(e.dataNasterii) : '', e.inaltime||'', e.greutate||'', imc, catIMC ? catIMC.eticheta : '', e.ces ? (e.cesDetalii||'Da') : ''];
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetNote, ...randuriNote]), tipRaport==='ppt' ? 'Note PPT' : 'Note');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetAbsente, ...randuriAbsente]), 'Absente');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Elev','Data','Nota','Motiv','Detalii','Observații'], ...(state.noteCurente||[]).filter(n=>n.claseId===claseId).sort((a,b)=>a.data.localeCompare(b.data)).map(n=>{ const e=state.elevi.find(x=>x.id===n.eleviId); return [e?`${e.nume} ${e.prenume}`:'—', formatDataRo(n.data), Number(n.valoare), n.motiv||'', n.detalii||'', n.obs||'']; })]), 'Note curente');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetAntropo, ...randuriAntropo]), 'Antropometrice');
  const sufixNume = tipRaport==='ppt' ? '_PPT' : '';
  XLSX.writeFile(wb, `Raport_${(clasa?clasa.nume:'clasa').replace(/\s+/g,'_')}${sufixNume}.xlsx`);
}

/* ================= RAPORT EXCEL — TOT CATALOGUL ================= */
function genereazaRaportExcelGeneral(){
  if(typeof XLSX==='undefined'){ showToast('Biblioteca Excel nu s-a încărcat. Deschide aplicația o dată cu internet și încearcă din nou.'); return; }

  // Foaia 1: Elevi
  const antetElevi = ['Cod unic', 'Nume', 'Prenume', 'Clasă', 'An', 'Sex', 'Data nașterii', 'Înălțime', 'Greutate', 'Scutire', 'CES'];
  const randuriElevi = state.elevi.map(e=>{
    const c = state.clase.find(cl=>cl.id===e.claseId);
    return [
      e.codUnic||'', e.nume, e.prenume, c?c.nume:'—', c?c.an:'—', e.sex==='M'?'Băiat':'Fată',
      e.dataNasterii?formatDataRo(e.dataNasterii):'', e.inaltime||'', e.greutate||'',
      esteScutitActiv(e) ? (e.scutireTip==='partiala'?'Parțială':e.scutireTip==='temporara'?'Temporară':'Totală anuală') : '',
      e.ces ? (e.cesDetalii||'Da') : ''
    ];
  });

  // Foaia 2: Note (toate, pe toate clasele)
  const antetNote = ['Elev', 'Clasă', 'Probă', 'Moment', 'Valoare', 'Notă', 'Data'];
  const randuriNote = state.note.map(n=>{
    const e = state.elevi.find(el=>el.id===n.eleviId);
    const p = state.probe.find(pr=>pr.id===n.probaId);
    const c = e ? state.clase.find(cl=>cl.id===e.claseId) : null;
    return [
      e?`${e.nume} ${e.prenume}`:'—', c?c.nume:'—', p?p.nume:'—',
      n.moment==='final'?'Finală':'Inițială', n.valoare, n.notaCalculata!=null?n.notaCalculata:'', formatDataRo(n.data)
    ];
  });

  // Foaia 3: Absențe (toate, pe toate clasele)
  const antetAbsente = ['Elev', 'Clasă', 'Data', 'Stare', 'Observație'];
  const randuriAbsente = state.absente.map(a=>{
    const e = state.elevi.find(el=>el.id===a.eleviId);
    const c = e ? state.clase.find(cl=>cl.id===e.claseId) : null;
    return [e?`${e.nume} ${e.prenume}`:'—', c?c.nume:'—', formatDataRo(a.data), labelStare(a.stare), a.nota||''];
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetElevi, ...randuriElevi]), 'Elevi');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetNote, ...randuriNote]), 'Note');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([antetAbsente, ...randuriAbsente]), 'Absente');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Elev','Clasă','Data','Nota','Motiv','Detalii','Observații'], ...(state.noteCurente||[]).map(n=>{ const e=state.elevi.find(x=>x.id===n.eleviId); const c=e?state.clase.find(k=>k.id===e.claseId):null; return [e?`${e.nume} ${e.prenume}`:'—', c?c.nume:'—', formatDataRo(n.data), Number(n.valoare), n.motiv||'', n.detalii||'', n.obs||'']; })]), 'Note curente');

  // Foaia 4: Probe
  const numeClasa = id => { const c=state.clase.find(cl=>cl.id===id); return c?c.nume:''; };
  const randuriProbe = state.probe.slice().sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(p=>[p.nume, p.claseId==='all'?'Toate clasele':numeClasa(p.claseId), p.data?formatDataRo(p.data):'']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Probă','Clasă','Data'], ...randuriProbe]), 'Probe');

  // Foaia 5: Planificarea lecțiilor (activitatea desfășurată)
  const randuriPlan = (state.planificari||[]).slice().sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(p=>[
    p.data?formatDataRo(p.data):'', p.data?ZILE_NUME[ziDinData(p.data)]||'':'', p.claseId?numeClasa(p.claseId):(p.an?('Anul '+p.an):''), p.tema||'', p.recAfara||'', p.recInterior||'', p.recMixt||''
  ]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Data','Ziua','Clasa','Tema','Afară','Interior','Mixt'], ...randuriPlan]), 'Planificare lectii');

  // Foaia 6: Orar
  const ordineZi = {LU:1,MA:2,MI:3,JO:4,VI:5,SA:6,DU:7};
  const randuriOrar = (state.orar||[]).slice().sort((a,b)=>(ordineZi[a.zi]-ordineZi[b.zi])||(a.ora-b.ora)).map(o=>[ZILE_NUME[o.zi]||o.zi, o.ora, numeClasa(o.claseId)]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Ziua','Ora','Clasa'], ...randuriOrar]), 'Orar');

  // Foaia 7: PPT — nota pe componente, per elev și probă
  const f2 = x => x==null ? '' : Math.round(x*100)/100;
  const randuriPPT = [];
  state.elevi.forEach(e=>{
    const c = state.clase.find(cl=>cl.id===e.claseId);
    state.probe.filter(p=>p.claseId==='all' || p.claseId===e.claseId).forEach(p=>{
      const r = calculeazaPPP(e.id, p.id); if(!r) return;
      randuriPPT.push([`${e.nume} ${e.prenume}`, c?c.nume:'—', p.nume, f2(r.performanta), f2(r.progres), f2(r.tehnica), f2(r.participare), r.modul?r.modul.nume:'', r.notaFinala==null?'fără Tehnică':r.notaFinala]);
    });
  });
  const pp = state.pppPonderi||{};
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    [`Ponderi: Performanță ${pp.performanta}% · Progres ${pp.progres}% · Tehnică ${pp.tehnica}%${pp.participareActiva?` · Participare ${pp.participare}%`:''}`], [],
    ['Elev','Clasă','Probă','Performanță','Progres','Tehnică','Participare','Modul','Notă finală'], ...randuriPPT]), 'PPT');

  // Foaia 8: Tehnica execuției
  const randuriTeh = (state.tehnicaExecutie||[]).map(t=>{
    const e = state.elevi.find(el=>el.id===t.eleviId), p = state.probe.find(pr=>pr.id===t.probaId);
    const c = e ? state.clase.find(cl=>cl.id===e.claseId) : null;
    return [e?`${e.nume} ${e.prenume}`:'—', c?c.nume:'—', p?p.nume:'—', t.valoare];
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Elev','Clasă','Probă','Notă tehnică'], ...randuriTeh]), 'Tehnica');

  // Foaia 9: Notițe de la ore
  const randuriNotite = (state.notiteOre||[]).filter(n=>n.text && n.text.trim()).sort((a,b)=>(a.data||'').localeCompare(b.data||''))
    .map(n=>[n.data?formatDataRo(n.data):'', n.data?ZILE_NUME[ziDinData(n.data)]||'':'', numeClasa(n.claseId), n.text]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Data','Ziua','Clasa','Notiță'], ...randuriNotite]), 'Notite ore');

  // Foaia 10: Scutiri și CES
  const tipScutire = e => e.scutireTip==='partiala'?'Parțială':e.scutireTip==='temporara'?'Temporară':e.scutireTip?'Totală anuală':'';
  const randuriScut = state.elevi.filter(e=>e.scutireTip || e.scutit || e.ces).map(e=>[
    `${e.nume} ${e.prenume}`, numeClasa(e.claseId), tipScutire(e), e.scutireSubTip||'', e.scutireStart?formatDataRo(e.scutireStart):'', e.scutireEnd?formatDataRo(e.scutireEnd):'',
    esteScutitActiv(e)?'Da':'Nu', e.motivScutire||'', e.ces?(e.cesDetalii||'Da'):'']);
  // scutirile anterioare (istoric), sub cele curente
  state.elevi.forEach(e=>(e.istoricScutiri||[]).forEach(x=>randuriScut.push([
    `${e.nume} ${e.prenume}`, numeClasa(e.claseId), tipScutire({scutireTip:x.tip}), x.subTip||'', x.start?formatDataRo(x.start):'', x.end?formatDataRo(x.end):'',
    'Nu (anterioară)', x.motiv||'', ''])));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Elev','Clasă','Scutire','Detaliu','De la','Până la','Activă azi','Motiv','CES'], ...randuriScut]), 'Scutiri');

  // Foaia 11: Practică comasată
  const randuriPract = [];
  state.clase.forEach(c=>(c.practica||[]).forEach(p=>randuriPract.push([c.nume, p.nume||'', p.start?formatDataRo(p.start):'', p.end?formatDataRo(p.end):''])));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Clasa','Perioada','De la','Până la'], ...randuriPract]), 'Practica');

  // Foaia 12: Module
  const randuriMod = (state.module||[]).map(m=>[m.nume, m.start?formatDataRo(m.start):'', m.end?formatDataRo(m.end):'']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Modul','De la','Până la'], ...randuriMod]), 'Module');

  // Foaia 13: Bareme
  const randuriBar = [];
  (state.bareme||[]).forEach(b=>Object.keys(b.praguri||{}).forEach(an=>['M','F'].forEach(sx=>{
    const pr = b.praguri[an] && b.praguri[an][sx]; if(!pr) return;
    randuriBar.push([b.nume, b.directie==='asc'?'mai mult = mai bine':'mai puțin = mai bine', an, sx==='M'?'Băieți':'Fete', ...[9,8,7,6,5,4].map(n=>pr[n]==null?'':pr[n])]);
  })));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Barem','Sens','An','Sex','Prag 9','Prag 8','Prag 7','Prag 6','Prag 5','Prag 4'], ...randuriBar]), 'Bareme');

  // Foaia 14: Clase
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Clasa','An de studiu','Arhivată','Nr. elevi'],
    ...state.clase.map(c=>[c.nume, c.an, c.arhivata?'Da':'', state.elevi.filter(e=>e.claseId===c.id).length])]), 'Clase');

  // Echipe reprezentate
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Sport','Categorie','Elev','Clasa','Sex','Data nașterii','Vârstă','Înălțime (cm)','Greutate (kg)','Poziție','Nr. tricou','Aviz medical până la','Acord părinte','Scutit medical','CES','Observații'],
    ...(state.echipe||[]).slice().sort((a,b)=>(a.sport||'').localeCompare(b.sport||'','ro')||(a.categorie||'').localeCompare(b.categorie||'')).map(m=>{ const e=state.elevi.find(x=>x.id===m.eleviId); const c=e?state.clase.find(k=>k.id===e.claseId):null;
      return [m.sport, m.categorie, e?`${e.nume} ${e.prenume}`:'—', c?c.nume:'', e?e.sex:'', e&&e.dataNasterii?formatDataRo(e.dataNasterii):'', e?(varstaElev(e)==null?'':varstaElev(e)):'', e&&e.inaltime||'', e&&e.greutate||'', m.pozitie||'', m.tricou||'', m.aviz?formatDataRo(m.aviz):'', m.acord?'Da':'', e&&esteScutitActiv(e)?'Da':'', e&&e.ces?(e.cesDetalii||'Da'):'', m.obs||'']; })]), 'Echipe');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Sport','Categorie','Data','Eveniment / adversar','Rezultat','Observații'], ...(state.meciuriEchipe||[]).slice().sort((a,b)=>(a.data||'').localeCompare(b.data||'')).map(x=>[x.sport,x.categorie,x.data?formatDataRo(x.data):'',x.eveniment||'',x.rezultat||'',x.obs||''])]), 'Meciuri echipe');
  XLSX.writeFile(wb, `Catalog_EFS_${state.settings.anScolar}_${todayISO()}.xlsx`);
  showToast('Excel exportat.');
}

Georgescu Mihai"></textarea>

    ${lista.length===0 ? emptyState('Niciun elev în această clasă.', 'Adaugă lista de mai sus, dintr-o dată sau elev cu elev.') : `

  document.getElementById('select-elevi-clasa').addEventListener('change', (e)=>{
    ui.clasaCurenta = e.target.value; render();
  });
  function actualizeazaIMC(eleviId){
    const el = state.elevi.find(e=>e.id===eleviId);
    const imc = (el.inaltime && el.greutate) ? (el.greutate / ((el.inaltime/100)*(el.inaltime/100))).toFixed(1) : '—';
    const cat = imc!=='—' ? categorieIMC(parseFloat(imc), claseAn(el.claseId), el.sex) : null;
    const celula = main.querySelector(`[data-imc-for="${eleviId}"]`);
    if(celula) celula.innerHTML = `${imc}${cat ? `<br><span class="pill ${cat.clasa}" style="font-size:10px; padding:1px 6px;">${cat.eticheta}</span>` : ''}`;

    inp.addEventListener('input', ()=>{
      const e = state.elevi.find(e=>e.id===inp.dataset.elev);
      e.inaltime = inp.value ? parseFloat(inp.value) : null;
      saveState();
      actualizeazaIMC(inp.dataset.elev);
    });
  });
  main.querySelectorAll('.input-greutate').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const e = state.elevi.find(e=>e.id===inp.dataset.elev);
      e.greutate = inp.value ? parseFloat(inp.value) : null;
      saveState();
      actualizeazaIMC(inp.dataset.elev);
    });
  });
  // Enter -> trece la aceeași căsuță (înălțime sau greutate) a elevului următor
  ['.input-nume-elev', '.input-prenume-elev', '.input-data-nasterii', '.input-inaltime', '.input-greutate'].forEach(selectorClasa=>{

    campuri.forEach((inp, idx)=>{
      inp.addEventListener('keydown', (ev)=>{
        if(ev.key==='Enter'){
          ev.preventDefault();
          const urmator = campuri[idx+1];
          if(urmator){ urmator.focus(); urmator.select(); } else { inp.blur(); }
        }

  document.getElementById('btn-add-elev').addEventListener('click', ()=>{

    if(!nume || !prenume) return showToast('Completează numele și prenumele.');
    state.elevi.push({id:uid(), claseId:ui.clasaCurenta, nume, prenume, sex, scutit:false, motivScutire:'', inaltime:null, greutate:null, dataNasterii:null, codUnic:genereazaCodElev()});

    const linii = raw.split('\n').map(l=>l.trim()).filter(Boolean);

    let adaugati = 0;
    linii.forEach(linie=>{
      const parti = linie.split(/\s+/);
      let sex = sexImplicit;

const CALIFICATIVE = [
  {cod:'FB*', nota:10, label:'FB* — Foarte bine cu stea'},

function notaDinCalificativ(cod){

}
function pragGol(){ return {9:null,8:null,7:null,6:null,5:null,4:null}; }
const CATEGORII_BAREM = ['Atletism', 'Forță', 'Gimnastică', 'Sărituri', 'Jocuri sportive', 'Altele'];
function baremNou(nume, directie, categorie){
  return {
    id: uid(), nume, directie: directie || 'desc', categorie: categorie || 'Altele',
    praguri: { IX:{M:pragGol(),F:pragGol()}, X:{M:pragGol(),F:pragGol()}, XI:{M:pragGol(),F:pragGol()}, XII:{M:pragGol(),F:pragGol()} }
  };
}
function claseAn(claseId){

// Praguri orientative de IMC pe vârstă (an de studiu) și sex, aproximate după curbele de creștere
// standard pentru adolescenți (14-18 ani). Sunt un reper general, nu un diagnostic medical.
const IMC_PRAGURI = {
  IX:  { M:{sub:16.5, sup:22.6, obez:26.4}, F:{sub:16.3, sup:23.4, obez:27.8} },
  X:   { M:{sub:17.0, sup:23.2, obez:27.4}, F:{sub:16.9, sup:23.9, obez:28.5} },
  XI:  { M:{sub:17.5, sup:23.9, obez:28.2}, F:{sub:17.3, sup:24.3, obez:29.1} },
  XII: { M:{sub:17.9, sup:24.5, obez:28.9}, F:{sub:17.7, sup:24.7, obez:29.6} },
};
function categorieIMC(imc, an, sex){
  const p = IMC_PRAGURI[an] && IMC_PRAGURI[an][sex];
  if(!p || imc==null || isNaN(imc)) return null;
  if(imc < p.sub) return {eticheta:'Subponderal', clasa:'pill-blue'};
  if(imc < p.sup) return {eticheta:'Normal', clasa:'pill-ok'};
  if(imc < p.obez) return {eticheta:'Supraponderal', clasa:'pill-yellow'};
  return {eticheta:'Obez', clasa:'pill-danger'};
}
function findBaremForProba(probaNume){
  if(!probaNume) return null;
  const target = probaNume.trim().toLowerCase();
  return state.bareme.find(b=>b.nume.trim().toLowerCase()===target) || null;
}
// Întoarce nota calculată (10..4) sau null dacă nu există prag definit / rezultatul e sub baremul minim.
function calculeazaNota(barem, an, sex, valoareStr){
  if(!barem) return null;
  const v = parseFloat(String(valoareStr).replace(',','.'));
  if(isNaN(v)) return null;
  const praguri = barem.praguri[an] && barem.praguri[an][sex];
  if(!praguri) return null;
  const ordine = [9,8,7,6,5,4];
  const areCevaDefinit = ordine.some(n=>praguri[n]!=null);
  if(!areCevaDefinit) return null; // baremul nu are încă niciun prag completat
  if(barem.directie==='desc'){ // valoare mai mică = notă mai mare (ex: timp)
    if(praguri[9]!=null && v < praguri[9]) return 10;
    for(const n of ordine){ if(praguri[n]!=null && v <= praguri[n]) return n; }
  } else { // valoare mai mare = notă mai mare (ex: distanță, repetări)
    if(praguri[9]!=null && v > praguri[9]) return 10;
    for(const n of ordine){ if(praguri[n]!=null && v >= praguri[n]) return n; }
  }
  // rezultat mai slab decât toate pragurile definite -> nota minimă din barem (4), nu sub ea
  return 4;
}
// diferența dintre testul inițial și cel final, ca pastilă colorată (verde = progres, roșu = regres)
function calculeazaDiferentaHTML(valoareInitiala, valoareFinala, barem){
  const vI = valoareInitiala!=='' && valoareInitiala!=null ? parseFloat(String(valoareInitiala).replace(',','.')) : NaN;
  const vF = valoareFinala!=='' && valoareFinala!=null ? parseFloat(String(valoareFinala).replace(',','.')) : NaN;
  if(isNaN(vI) || isNaN(vF)) return '<span style="color:var(--muted);">—</span>';
  const diff = (barem && barem.directie==='asc') ? (vF - vI) : (vI - vF); // implicit: valoare mai mică (timp) = mai bine
  const bun = diff>0, rau = diff<0;
  const semn = diff>0 ? '+' : '';
  return `<span class="pill ${bun?'pill-ok':rau?'pill-danger':'pill-ghost'}">${semn}${diff.toFixed(2).replace('.',',')}</span>`;
}

  const afisareDubla = tipNotare==='barem'; // la probele cu barem, arătăm inițial + final unul lângă altul

  // scrie/șterge imediat în state.note, la fiecare modificare — nimic nu se pierde dacă schimbi tab-ul
  function upsertNota(eleviId, momentInregistrare, valoare, notaCalculata){
    let rec = state.note.find(n=>n.eleviId===eleviId && n.probaId===ui.notareProba && n.moment===momentInregistrare);

      if(rec) state.note = state.note.filter(n=>n!==rec);

    } else {
      state.note.push({id:uid(), eleviId, probaId:ui.notareProba, moment:momentInregistrare, valoare, notaCalculata, data:todayISO()});

  }

  // câmpul de Tehnică (corectitudinea execuției): notă 1-10 dată de profesor, o singură dată per probă
  function celulaTehnica(eleviId){

  main.innerHTML = `

    <p class="tab-desc">${afisareDubla ? 'Alege clasa și proba — introduci testarea inițială și cea finală una lângă alta, ca să vezi diferența imediat.' : 'Alege clasa, proba și momentul testării. Fiecare notă se salvează automat, imediat ce o scrii.'}</p>
    ${bannerPracticaHTML(ui.clasaCurenta)}
    <div class="row" style="margin-bottom:16px;">
      <div class="field">
        <label>Clasă</label>
        <select id="select-notare-clasa">
          ${claseActive().map(c=>`<option value="${c.id}" ${c.id===ui.clasaCurenta?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Probă</label>
        <select id="select-notare-proba" ${probeDisponibile.length===0?'disabled':''}>
          ${probeDisponibile.length===0 ? '<option>Nicio probă pentru această clasă</option>' :
            probeDisponibile.map(p=>`<option value="${p.id}" ${p.id===ui.notareProba?'selected':''}>${escapeHtml(p.nume)}</option>`).join('')}
        </select>
      </div>
      ${!afisareDubla ? `
      <div class="field">
        <label>Moment testare</label>
        <select id="select-notare-moment">
          <option value="initial" ${moment==='initial'?'selected':''}>Testare inițială</option>
          <option value="final" ${moment==='final'?'selected':''}>Testare finală</option>
        </select>
      </div>` : ''}
    </div>
    ${probaSelectata ? (()=>{ const st = statusProba(ui.clasaCurenta, probaSelectata.id); return `
      <label id="lbl-clasa-notata" class="${st.fin?'notata-ok':''}"><input type="checkbox" id="chk-clasa-notata" ${st.fin?'checked':''}/> <span>Clasa notată la această probă <span style="font-weight:400; color:var(--muted);">(${st.notati}/${st.total} elevi cu notă)</span></span></label>`; })() : ''}
    ${probaSelectata && tipNotare==='barem' && !barem ? `
      <div class="card" style="background:#FBEBD3; border-color:#E3A23C;">
        Nu există un barem definit pentru „${escapeHtml(probaSelectata.nume)}” — introduci direct timpul/rezultatul, sau
        <button class="btn btn-ghost" id="btn-jump-barem" style="margin-left:6px;">creează un barem acum</button>
        ca să-ți calculeze automat nota. Baremul e același pentru testarea inițială și cea finală.
      </div>
    ` : ''}
    ${lista.length===0 ? emptyState('Niciun elev în această clasă.', 'Adaugă elevi în tabul „Elevi”.') :
      probeDisponibile.length===0 ? emptyState('Nicio probă disponibilă.', 'Adaugă o probă în tabul „Probe” pentru această clasă.') :
      afisareDubla ? `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Nr.</th><th>Elev</th><th>Test inițial</th><th>Test final</th><th>Tehnică</th><th>Diferență</th></tr></thead>
        <tbody>
          ${lista.map((e,idx)=>{
            const numarOrdine = `<td style="color:var(--muted); text-align:center;">${idx+1}</td>`;
            if(blocheazaNotarea(e)){
              return `<tr ${esteInactiv(e)?'class="rand-inactiv"':''}>${numarOrdine}<td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${cesTagHTML(e)}${situatieElevHTML(e)}</td><td colspan="4">${motivBlocareHTML(e)}</td></tr>`;
            }
            const numeCuTagPartial = `${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${scutirePartialaActiva(e)?`<span class="pill pill-blue" title="${escapeHtml(e.motivScutire||'')}" style="margin-left:4px; padding:1px 6px;">scutire parțială</span>`:''} ${cesTagHTML(e)}${absentAziHTML(e)}`;
            const an = claseAn(e.claseId);
            const recInitial = state.note.find(n=>n.eleviId===e.id && n.probaId===ui.notareProba && n.moment==='initial');
            const recFinal = state.note.find(n=>n.eleviId===e.id && n.probaId===ui.notareProba && n.moment==='final');
            const notaInitial = barem ? calculeazaNota(barem, an, e.sex, recInitial ? recInitial.valoare : '') : null;
            const notaFinal = barem ? calculeazaNota(barem, an, e.sex, recFinal ? recFinal.valoare : '') : null;

            function celulaMoment(rec, nota, momentStr){
              return `<td style="padding:4px 6px;"><div style="display:flex; align-items:center; gap:5px; white-space:nowrap;">
                <input type="text" inputmode="decimal" class="grade-input" data-elev="${e.id}" data-sex="${e.sex}" data-an="${an}" data-moment="${momentStr}" value="${rec ? escapeHtml(rec.valoare) : ''}" placeholder="—" style="width:58px; min-height:32px; padding:4px 6px;"/>

              ${celulaMoment(recFinal, notaFinal, 'final')}
              ${celulaTehnica(e.id)}

          }).join('')}

        <thead><tr><th>Nr.</th><th>Elev</th><th>${tipNotare==='calificativ' ? 'Calificativ' : 'Notă'}</th><th>Tehnică</th></tr></thead>

          ${lista.map((e,idx)=>{

            const existing = state.note.find(n=>n.eleviId===e.id && n.probaId===ui.notareProba && n.moment===moment);
            if(blocheazaNotarea(e)){
              return `<tr ${esteInactiv(e)?'class="rand-inactiv"':''}>${numarOrdine}<td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${cesTagHTML(e)}${situatieElevHTML(e)}</td><td colspan="2">${motivBlocareHTML(e)}</td></tr>`;
            }
            const numeCuTagPartial = `${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${scutirePartialaActiva(e)?`<span class="pill pill-blue" title="${escapeHtml(e.motivScutire||'')}" style="margin-left:4px; padding:1px 6px;">scutire parțială</span>`:''} ${cesTagHTML(e)}${absentAziHTML(e)}`;
            if(tipNotare==='calificativ'){
              const valExist = existing ? existing.valoare : '';
              const notaExist = valExist ? notaDinCalificativ(valExist) : null;
              return `<tr>
                ${numarOrdine}
                <td class="student-name">${numeCuTagPartial}</td>
                <td><div style="display:flex; align-items:center; gap:8px;">
                  <select class="calificativ-input" data-elev="${e.id}">
                    <option value="">—</option>
                    ${CALIFICATIVE.map(c=>`<option value="${c.cod}" title="${escapeHtml(c.label)}" ${valExist===c.cod?'selected':''}>${c.cod}</option>`).join('')}
                  </select>
                  <span class="pill pill-ok nota-calc-calif" data-nota-for="${e.id}">${notaExist!=null?notaExist:'—'}</span>
                  ${existing ? `<button class="btn btn-ghost btn-sterge-nota" data-elev="${e.id}" title="Șterge nota" style="padding:6px 10px; min-height:34px;">${ICONS.trash}</button>` : ''}
                </div></td>
                ${celulaTehnica(e.id)}
              </tr>`;
            }
            return `<tr>
              ${numarOrdine}
              <td class="student-name">${numeCuTagPartial}</td>
              <td><div style="display:flex; align-items:center; gap:8px;">
                <input type="text" inputmode="decimal" class="grade-input" data-elev="${e.id}" value="${existing ? escapeHtml(existing.valoare) : ''}" placeholder="—"/>
                ${existing ? `<button class="btn btn-ghost btn-sterge-nota" data-elev="${e.id}" title="Șterge nota" style="padding:6px 10px; min-height:34px;">${ICONS.trash}</button>` : ''}
              </div></td>
              ${celulaTehnica(e.id)}
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <p class="tab-desc" style="margin-top:10px;">✓ Salvare automată. <b>Tehnică</b> = nota ta (1-10) pentru corectitudinea execuției, dată o singură dată per probă; intră în calculul PPT.</p>
    `}
  `;
  document.getElementById('select-notare-clasa').addEventListener('change', e=>{ ui.clasaCurenta = e.target.value; ui.notareProba = null; render(); });
  const selProba = document.getElementById('select-notare-proba');
  if(selProba) selProba.addEventListener('change', e=>{ ui.notareProba = e.target.value; render(); });
  const selMoment = document.getElementById('select-notare-moment');
  if(selMoment) selMoment.addEventListener('change', e=>{ ui.notareMoment = e.target.value; render(); });
  const btnJump = document.getElementById('btn-jump-barem');
  if(btnJump) btnJump.addEventListener('click', ()=>{
    const nb = baremNou(probaSelectata.nume, 'desc');
    state.bareme.push(nb);
    ui.baremeSelectat = nb.id;
    saveState();
    currentTab = 'bareme'; render();
  });
  // notă directă / barem: salvare automată pe fiecare tastă + actualizare live a pastilei cu nota (fără să redesenăm tot tabelul, ca să nu pierdem focusul din câmp)
  main.querySelectorAll('.grade-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const val = inp.value.trim();
      const momentCurent = inp.dataset.moment || moment;
      const notaCalc = barem ? calculeazaNota(barem, inp.dataset.an, inp.dataset.sex, val) : null;
      if(barem){
        const cell = afisareDubla
          ? main.querySelector(`.nota-calc[data-nota-for="${inp.dataset.elev}"][data-moment-for="${momentCurent}"]`)
          : main.querySelector(`.nota-calc[data-nota-for="${inp.dataset.elev}"]`);
        if(cell) cell.textContent = notaCalc!=null ? notaCalc : '—';
      }
      upsertNota(inp.dataset.elev, momentCurent, val, notaCalc);
      if(afisareDubla){
        // recalculăm live pastila de Diferență, fără să redesenăm tabelul (ca să nu pierdem focusul)
        const rândCurent = inp.closest('tr');
        const inputInitial = rândCurent.querySelector('.grade-input[data-moment="initial"]');
        const inputFinal = rândCurent.querySelector('.grade-input[data-moment="final"]');
        const diffCell = rândCurent.querySelector(`[data-diff-for="${inp.dataset.elev}"]`);
        if(diffCell && inputInitial && inputFinal){
          diffCell.innerHTML = calculeazaDiferentaHTML(inputInitial.value.trim(), inputFinal.value.trim(), barem);
        }
      }
    });
  });
  // calificativ: salvare automată la fiecare selecție
  if(tipNotare==='calificativ'){
    main.querySelectorAll('.calificativ-input').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const val = sel.value;
        const notaCalc = val ? notaDinCalificativ(val) : null;
        const cell = main.querySelector(`.nota-calc-calif[data-nota-for="${sel.dataset.elev}"]`);
        if(cell) cell.textContent = notaCalc!=null ? notaCalc : '—';
        upsertNota(sel.dataset.elev, moment, val, notaCalc);
        render();
      });
    });
  }
  // Tehnică: salvare automată la fiecare modificare (fără redesenare, ca să nu pierdem focusul)
  main.querySelectorAll('.input-tehnica-notare').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const eleviId = inp.dataset.elev;
      const val = inp.value.trim();
      let rec = state.tehnicaExecutie.find(t=>t.eleviId===eleviId && t.probaId===ui.notareProba);
      if(val===''){
        if(rec) state.tehnicaExecutie = state.tehnicaExecutie.filter(t=>t!==rec);
      } else {
        const num = parseFloat(val.replace(',','.'));
        if(isNaN(num)) return;
        const valoare = Math.max(1, Math.min(10, num));
        if(rec) rec.valoare = valoare;
        else state.tehnicaExecutie.push({id:uid(), eleviId, probaId:ui.notareProba, valoare});
      }
      saveState();
    });
    // la ieșirea din câmp, afișăm valoarea efectiv salvată (limitată la 1-10)
    inp.addEventListener('change', ()=>{
      const t = gasesteTehnica(inp.dataset.elev, ui.notareProba);
      inp.value = t ? t.valoare : '';
    });
  });
  // notă directă simplă (fără barem, fără calificativ) foloseste deja listener-ul general de mai sus
  // Enter -> trece la câmpul următor, ca într-un tabel Excel (include și câmpul de Tehnică)
  const campuriNotare = Array.from(main.querySelectorAll('.grade-input[data-elev], .input-tehnica-notare[data-elev]'));
  campuriNotare.forEach((inp, idx)=>{
    inp.addEventListener('keydown', (ev)=>{
      if(ev.key==='Enter'){
        ev.preventDefault();
        const urmator = campuriNotare[idx+1];
        if(urmator){ urmator.focus(); urmator.select(); }
        else{ inp.blur(); render(); }
      }
    });
  });
  // Ștergere rapidă a unei note deja salvate, dintr-un click
  main.querySelectorAll('.btn-sterge-nota').forEach(b=>{
    b.addEventListener('click', ()=>{
      const eleviId = b.dataset.elev;
      const momentDeSters = b.dataset.moment || moment;
      if(!confirm('Ștergi nota salvată pentru acest elev, la această probă?')) return;
      state.note = state.note.filter(n=>!(n.eleviId===eleviId && n.probaId===ui.notareProba && n.moment===momentDeSters));
      saveState(); render(); showToast('Notă ștearsă.');
    });
  });
}
