            }
            return `<tr data-row-elev="${e.id}">
              <td style="color:var(--muted); text-align:center;">${idx+1}</td>
              <td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${esteScutitActiv(e)?'<span class=\"pill pill-yellow\" style=\"margin-left:6px;\">scutit</span>':''} ${cesTagHTML(e)}</td>
              <td class="stare-badge-cell">${starePillHTML(stare)}</td>
              <td style="text-align:center;">
                <input type="checkbox" class="chk-absent" data-elev="${e.id}" ${esteAbsent?'checked':''} style="width:22px; height:22px; cursor:pointer;"/>
              </td>
              <td style="max-width:150px; opacity:${esteAbsent?'0.35':'1'};">
                <select class="select-observatie" data-elev="${e.id}" ${esteAbsent?'disabled':''} style="max-width:150px;">
                  <option value="">— fără observație —</option>
                  ${toateObservatiile().map(o=>`<option value="${escapeHtml(o)}" ${nota===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
                  <option value="__custom__" ${esteCustom?'selected':''}>Altă observație...</option>
                </select>
                <input type="text" class="input-observatie-custom" data-elev="${e.id}" value="${esteCustom?escapeHtml(nota):''}" ${esteAbsent?'disabled':''}
                  style="width:100%; max-width:150px; margin-top:5px; display:${esteCustom?'block':'none'};" placeholder="scrie observația ta"/>
              </td>
              <td>${totalBadgeHTML(e.id)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    `}
  `;
  document.getElementById('select-absente-clasa').addEventListener('change', e=>{ ui.clasaCurenta = e.target.value; render(); });
  main.addEventListener('click', (ev)=>{
    const badge = ev.target.closest('.total-abs-badge');
    if(!badge) return;
    const lista = main.querySelector(`.total-abs-list[data-elev="${badge.dataset.elev}"]`);
    if(lista) lista.style.display = lista.style.display==='none' ? 'block' : 'none';
  });
  document.getElementById('input-absente-data').addEventListener('change', e=>{ ui.absenteData = e.target.value; render(); });
  const btnSariLaAzi = document.getElementById('btn-sari-la-azi');
  if(btnSariLaAzi) btnSariLaAzi.addEventListener('click', ()=>{ ui.absenteData = todayISO(); render(); });

  document.getElementById('btn-add-observatie').addEventListener('click', ()=>{
    const inp = document.getElementById('input-observatie-noua');
    const puncteInp = document.getElementById('input-observatie-noua-puncte');
    const text = inp.value.trim();
    if(!text) return showToast('Scrie observația mai întâi.');
    if(toateObservatiile().some(o=>o.toLowerCase()===text.toLowerCase())) return showToast('Există deja în listă.');
    state.observatiiCustom.push(text);
    state.puncteObservatii[text] = parseFloat(puncteInp.value) || 0;
    saveState(); render(); showToast('Observație adăugată la listă.');
  });
  document.getElementById('select-observatie-punctaj').addEventListener('change', (e)=>{
    ui.obsPunctajSelectat = e.target.value; render();
  });
  document.getElementById('btn-salveaza-puncte-obs').addEventListener('click', ()=>{
    const sel = ui.obsPunctajSelectat || '__absenta_goala__';
    const valoare = parseFloat(document.getElementById('input-puncte-selectat').value) || 0;
    if(sel==='__absenta_goala__'){ state.puncteAbsentaGoala = valoare; }
    else { state.puncteObservatii[sel] = valoare; }
    saveState(); showToast('Punctaj actualizat.');
  });
  const btnStergeObsSelectata = document.getElementById('btn-sterge-obs-selectata');
  if(btnStergeObsSelectata){
    btnStergeObsSelectata.addEventListener('click', ()=>{
      const sel = ui.obsPunctajSelectat;
      if(!confirm('Ștergi această observație din listă? (nu afectează observațiile deja salvate la elevi)')) return;
      state.observatiiCustom = state.observatiiCustom.filter(o=>o!==sel);
      delete state.puncteObservatii[sel];
      ui.obsPunctajSelectat = '__absenta_goala__';
      saveState(); render(); showToast('Observație ștearsă din listă.');
    });
  }

  function upsertAbsenta(eleviId, patch){
    let rec = state.absente.find(a=>a.eleviId===eleviId && a.data===ui.absenteData);
    if(!rec){
      rec = {id:uid(), eleviId, claseId:ui.clasaCurenta, data:ui.absenteData, stare:'prezent', nota:''};
      state.absente.push(rec);
    }
    Object.assign(rec, patch);
    if(rec.stare==='prezent' && !rec.nota){
      state.absente = state.absente.filter(a=>a!==rec);
    }
    saveState();
  }

  main.querySelectorAll('.chk-absent').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const eleviId = chk.dataset.elev;
      const stareNoua = chk.checked ? 'absent' : 'prezent';
      // absent -> observația nu se mai aplică; o golim, ca să nu rămână o valoare veche ascunsă
      upsertAbsenta(eleviId, chk.checked ? {stare: stareNoua, nota: ''} : {stare: stareNoua});
      // actualizăm doar rândul elevului (fără render() complet, ca pagina să nu sară sus)
      const row = main.querySelector(`tr[data-row-elev="${eleviId}"]`);
      if(!row) return;
      const celule = row.children;
      celule[2].innerHTML = starePillHTML(stareNoua);
      celule[5].innerHTML = totalBadgeHTML(eleviId);
      const sel = row.querySelector('.select-observatie');
      const custom = row.querySelector('.input-observatie-custom');
      sel.disabled = chk.checked;
      custom.disabled = chk.checked;
      celule[4].style.opacity = chk.checked ? '0.35' : '1';
      if(chk.checked){ sel.value = ''; custom.value = ''; custom.style.display = 'none'; }
    });
  });
  main.querySelectorAll('.select-observatie').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const eleviId = sel.dataset.elev;
      const row = main.querySelector(`tr[data-row-elev="${eleviId}"]`);
      const customInput = row.querySelector('.input-observatie-custom');
      if(sel.value==='__custom__'){
        customInput.style.display = 'block';
        customInput.focus();
        upsertAbsenta(eleviId, {nota: customInput.value.trim()});
      } else {
        customInput.style.display = 'none';
        customInput.value = '';
        upsertAbsenta(eleviId, {nota: sel.value});
      }
    });
  });
  main.querySelectorAll('.input-observatie-custom').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      upsertAbsenta(inp.dataset.elev, {nota: inp.value.trim()});
    });
  });
}

/* ================= TAB: ISTORIC ELEV ================= */
function renderIstoric(main){
  if(claseActive().length===0){
    main.innerHTML = `<h2>Istoric elev</h2>` + emptyState('Nu ai nicio clasă.', 'Adaugă mai întâi o clasă în tabul „Clase”.');
    return;
  }
  if(!ui.clasaCurenta || !claseActive().find(c=>c.id===ui.clasaCurenta)) ui.clasaCurenta = claseActive()[0].id;
  const eleviClasa = eleviDinClasa(ui.clasaCurenta);
  if(!ui.istoricElev || !eleviClasa.find(e=>e.id===ui.istoricElev)){
    ui.istoricElev = eleviClasa.length ? eleviClasa[0].id : null;
  }
  const elev = ui.istoricElev ? state.elevi.find(e=>e.id===ui.istoricElev) : null;

  main.innerHTML = `
    <h2>Istoric elev</h2>
    <p class="tab-desc">Alege clasa și elevul ca să vezi tot istoricul: absențe, observații, cu data fiecăreia și totalul cumulat.</p>
    ${bannerPracticaHTML(ui.clasaCurenta)}
    <div class="row" style="margin-bottom:16px;">
      <div class="field">
        <label>Clasă</label>
        <select id="select-istoric-clasa">
          ${claseActive().map(c=>`<option value="${c.id}" ${c.id===ui.clasaCurenta?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="min-width:220px;">
        <label>Elev</label>
        <select id="select-istoric-elev" ${eleviClasa.length===0?'disabled':''}>
          ${eleviClasa.length===0 ? '<option>Niciun elev în această clasă</option>' :
            eleviClasa.map(e=>`<option value="${e.id}" ${e.id===ui.istoricElev?'selected':''}>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</option>`).join('')}
        </select>
      </div>
      ${elev ? `<button class="btn btn-secondary" id="btn-raport-elev" style="align-self:flex-end;">🖨 Raport elev</button>` : ''}
    </div>
    ${!elev ? emptyState('Niciun elev în această clasă.', 'Adaugă elevi în tabul „Elevi”.') : (()=>{
      const inregistrari = state.absente.filter(a=>a.eleviId===elev.id).sort((a,b)=>a.data.localeCompare(b.data));
      const totalAbsente = inregistrari.filter(a=>a.stare==='absent').length;
      let cumulat = 0;
      const randuri = inregistrari.map(a=>{
        if(a.stare!=='prezent') cumulat++;
        const esteAbsent = a.stare==='absent';
        return `<tr data-istoric-id="${a.id}">
          <td>${formatDataRo(a.data)}</td>
          <td>
            <select class="istoric-stare" data-id="${a.id}">
              <option value="prezent" ${a.stare==='prezent'?'selected':''}>prezent</option>
              <option value="absent" ${esteAbsent?'selected':''}>absent</option>
            </select>
          </td>
          <td><input type="text" class="istoric-observatie" data-id="${a.id}" value="${escapeHtml(a.nota||'')}" placeholder="${esteAbsent?'— (doar la prezent) —':'—'}" ${esteAbsent?'disabled':''} style="min-width:200px;"/></td>
          <td><strong>${cumulat}</strong></td>
          <td><button class="btn btn-danger" data-del-istoric="${a.id}">${ICONS.trash}</button></td>
        </tr>`;
      }).join('');
      return `
        <div class="row" style="margin-bottom:16px; gap:10px;">
          <span class="pill pill-danger">Total absențe: ${totalAbsente}</span>
          ${esteScutitActiv(elev) ? scutirePillHTML(elev) : ''}
          ${cesTagHTML(elev)}
        </div>
        ${(()=>{ const nc = noteCurenteElev(elev.id); if(!nc.length) return ''; return `
          <h3 style="font-size:15px; color:var(--infield); margin:0 0 6px;">Note curente</h3>
          <div class="card" style="padding:0; overflow-x:auto;"><table>
            <thead><tr><th>Data</th><th>Nota</th><th>Motiv</th><th>Detalii</th></tr></thead>
            <tbody>${nc.map(n=>`<tr><td>${formatDataRo(n.data)}</td><td><strong>${n.valoare}</strong></td><td>${escapeHtml(n.motiv||'')}</td><td>${escapeHtml([n.detalii,n.obs].filter(Boolean).join(' — '))}</td></tr>`).join('')}</tbody>
          </table></div>`; })()}
        ${inregistrari.length===0 ? emptyState('Niciun eveniment înregistrat.', 'Absențele și observațiile pentru acest elev vor apărea aici, pe măsură ce le adaugi în tabul „Absențe”.') : `
        <p class="tab-desc" style="margin-top:-6px;">Poți corecta direct aici starea sau observația unei zile trecute, sau șterge complet o înregistrare greșită.</p>
        <div class="card" style="padding:0; overflow-x:auto;">
          <table>
            <thead><tr><th>Data</th><th>Stare</th><th>Observație</th><th>Total absențe până la această dată</th><th></th></tr></thead>
            <tbody>${randuri}</tbody>
          </table>
        </div>`}
      `;
    })()}
  `;
  document.getElementById('select-istoric-clasa').addEventListener('change', e=>{
    ui.clasaCurenta = e.target.value; ui.istoricElev = null; render();
  });
  const selElev = document.getElementById('select-istoric-elev');
  if(selElev) selElev.addEventListener('change', e=>{ ui.istoricElev = e.target.value; render(); });

  main.querySelectorAll('.istoric-stare').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const rec = state.absente.find(a=>a.id===sel.dataset.id);
      if(!rec) return;
      if(sel.value==='prezent' && !rec.nota){
        // fără observație și fără absență -> înregistrarea nu mai are rost, o ștergem
        state.absente = state.absente.filter(a=>a.id!==rec.id);
      } else {
        rec.stare = sel.value;
        if(sel.value==='absent') rec.nota = ''; // absent -> observația nu se mai aplică
      }
      saveState(); render(); showToast('Actualizat.');
    });
  });
  main.querySelectorAll('.istoric-observatie').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const rec = state.absente.find(a=>a.id===inp.dataset.id);
      if(!rec) return;
      const val = inp.value.trim();
      if(rec.stare==='prezent' && !val){
        state.absente = state.absente.filter(a=>a.id!==rec.id);
      } else {
        rec.nota = val;
      }
      saveState(); render(); showToast('Actualizat.');
    });
  });
  main.querySelectorAll('[data-del-istoric]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('Ștergi complet această înregistrare (absență/observație)?')) return;
      state.absente = state.absente.filter(a=>a.id!==b.dataset.delIstoric);
      saveState(); render(); showToast('Înregistrare ștearsă.');
    });
  });
  const btnRaportElev = document.getElementById('btn-raport-elev');
  if(btnRaportElev) btnRaportElev.addEventListener('click', ()=>genereazaRaportElev(elev.id));
}

/* ================= RAPORT INDIVIDUAL PE ELEV (printabil) ================= */
function genereazaRaportElev(eleviId){
  const e = state.elevi.find(el=>el.id===eleviId);
  if(!e) return;
  const clasa = state.clase.find(c=>c.id===e.claseId);
  const probeElev = state.probe.filter(p=>probaSeAplicaClasei(p, e.claseId)).sort((a,b)=>a.data.localeCompare(b.data));

  const randuriNote = probeElev.map(p=>{
    const rec = notaPentruSinteza(e.id, p.id);
    if(!rec) return `<tr><td>${escapeHtml(p.nume)}</td><td>—</td><td>—</td><td>—</td></tr>`;
    const eticheta = rec.moment==='final' ? 'Finală' : 'Inițială';
    return `<tr>
      <td>${escapeHtml(p.nume)}</td>
      <td>${eticheta}</td>
      <td>${escapeHtml(String(rec.valoare))}</td>
      <td>${rec.notaCalculata!=null ? rec.notaCalculata : '—'}</td>
    </tr>`;
  }).join('');

  const inregistrari = state.absente.filter(a=>a.eleviId===e.id).sort((a,b)=>a.data.localeCompare(b.data));
  const totalAbsenteElev = inregistrari.filter(a=>a.stare==='absent').length;
  const randuriAbsente = inregistrari.map(a=>`<tr>
    <td>${formatDataRo(a.data)}</td>
    <td>${labelStare(a.stare)}</td>
    <td>${escapeHtml(a.nota || '—')}</td>
  </tr>`).join('');

  const imc = (e.inaltime && e.greutate) ? (e.greutate / ((e.inaltime/100)*(e.inaltime/100))).toFixed(1) : '—';
  const catIMC = imc!=='—' ? categorieIMC(parseFloat(imc), claseAn(e.claseId), e.sex) : null;

  const html = `<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8">
<title>Raport ${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} — Catalog EFS</title>
<style>
  body{font-family: Arial, sans-serif; color:#1a1a1a; padding:24px; max-width:900px; margin:0 auto;}
  h1{font-size:22px; margin-bottom:2px;}
  .sub{color:#555; margin-bottom:24px; font-size:13px;}
  .info{display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; margin-bottom:20px; font-size:14px;}
  .info b{color:#22402C;}
  h2{font-size:16px; margin-top:28px; border-bottom:2px solid #22402C; padding-bottom:4px; color:#22402C;}
  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px;}
  th,td{border:1px solid #ccc; padding:6px 8px; text-align:left;}
  th{background:#f0efe9;}
  .btn-print{
    position:fixed; top:16px; right:16px; background:#C1440E; color:#fff; border:none;
    padding:10px 18px; border-radius:6px; font-weight:700; cursor:pointer; font-size:14px;
  }
  @media print{ .btn-print{ display:none; } body{ padding:0; } }
</style>
</head>
<body>
  <button class="btn-print" onclick="window.print()">🖨 Printează / Salvează PDF</button>
  <h1>Raport individual — ${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</h1>
  <div class="sub">Generat la ${formatDataRo(todayISO())}, ora ${new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}</div>

  <div class="info">
    <div><b>Cod unic:</b> ${escapeHtml(e.codUnic||'—')}</div>
    <div><b>Clasă:</b> ${escapeHtml(clasa ? clasa.nume : '—')}</div>
    <div><b>Sex:</b> ${e.sex==='M'?'Băiat':'Fată'}</div>
    <div><b>Data nașterii:</b> ${e.dataNasterii ? formatDataRo(e.dataNasterii) : '—'}</div>
    <div><b>Înălțime / Greutate:</b> ${e.inaltime||'—'} cm / ${e.greutate||'—'} kg</div>
    <div><b>IMC:</b> ${imc}${catIMC ? ' — '+catIMC.eticheta : ''}</div>
    <div><b>Scutire medicală:</b> ${esteScutitActiv(e) ? (e.scutireTip==='partiala' ? 'Parțială' : e.scutireTip==='temporara' ? 'Temporară' : 'Totală anuală') : 'Nu'}</div>
    <div><b>CES:</b> ${e.ces ? `Da${e.cesDetalii ? ' — '+escapeHtml(e.cesDetalii) : ''}` : 'Nu'}</div>
  </div>

  <h2>Note pe probe</h2>
  ${probeElev.length===0 ? '<p>Nicio probă înregistrată pentru clasa acestui elev.</p>' : `
  <table>
    <thead><tr><th>Probă</th><th>Moment</th><th>Rezultat</th><th>Notă</th></tr></thead>
    <tbody>${randuriNote}</tbody>
  </table>`}

  <h2>Absențe și observații (Total: ${totalAbsenteElev})</h2>
  ${inregistrari.length===0 ? '<p>Niciun eveniment înregistrat.</p>' : `
  <table>
    <thead><tr><th>Data</th><th>Stare</th><th>Observație</th></tr></thead>
    <tbody>${randuriAbsente}</tbody>
  </table>`}
</body></html>`;

  const w = window.open('', '_blank');
  if(!w){ showToast('Permite ferestrele pop-up ca să vezi raportul.'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

              <td>${formatDataRo(p.start)}</td>

          ${claseActive().map(c=>`<option value="${c.id}" ${c.id===ui.clasaCurenta?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
        </select>
      </div>
    </div>

          <label>Până la</label>
          <input type="date" id="input-practica-end" value="${todayISO()}"/>
        </div>
        <div class="field" style="flex:1; min-width:200px;">
          <label>Motiv / agent economic (opțional)</label>
          <input type="text" id="input-practica-motiv" placeholder="ex: SC Exemplu SRL"/>
        </div>
        <button class="btn btn-primary" id="btn-add-practica">+ Adaugă perioadă</button>
      </div>

    ${perioade.length===0 ? emptyState('Nicio perioadă de practică pentru această clasă.', 'Adaugă una mai sus.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>De la</th><th>Până la</th><th>Motiv</th><th>Stare</th><th></th></tr></thead>
        <tbody>
          ${perioade.map(p=>{
            let stare;
            if(azi<p.start) stare = '<span class="pill pill-blue">urmează</span>';
            else if(azi>p.end) stare = '<span class="pill pill-ghost">încheiată</span>';
            else stare = '<span class="pill pill-yellow">activă acum</span>';
            return `<tr>
              <td>${formatDataRo(p.start)}</td>
              <td>${formatDataRo(p.end)}</td>
              <td>${escapeHtml(p.nume) || '—'}</td>
              <td>${stare}</td>
              <td><button class="btn btn-danger" data-del-practica="${p.id}">${ICONS.trash}</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`}
  `;
  document.getElementById('select-practica-clasa').addEventListener('change', e=>{
    ui.clasaCurenta = e.target.value; render();
  });
  main.querySelectorAll('[data-sari-la-clasa]').forEach(a=>{
    a.addEventListener('click', (ev)=>{
      ev.preventDefault();
      ui.clasaCurenta = a.dataset.sariLaClasa; render();
    });
  });
  document.getElementById('btn-add-practica').addEventListener('click', ()=>{
    const start = document.getElementById('input-practica-start').value;
    const end = document.getElementById('input-practica-end').value;
    const nume = document.getElementById('input-practica-motiv').value.trim();
    if(!start || !end) return showToast('Completează ambele date.');
    if(end<start) return showToast('Data „până la” nu poate fi înainte de „de la”.');
    clasa.practica.push({id:uid(), start, end, nume});
    saveState(); render(); showToast('Perioadă adăugată.');
  });
  main.querySelectorAll('[data-del-practica]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('Ștergi această perioadă de practică?')) return;
      clasa.practica = clasa.practica.filter(p=>p.id!==b.dataset.delPractica);
      saveState(); render(); showToast('Perioadă ștearsă.');
    });
  });
}

// mută scutirea curentă a elevului în istoricul lui (folosit când i se trece o scutire nouă)
function arhiveazaScutire(e){
  if(!Array.isArray(e.istoricScutiri)) e.istoricScutiri = [];
  e.istoricScutiri.push({tip:e.scutireTip, subTip:e.scutireSubTip||null, start:e.scutireStart||null, end:e.scutireEnd||null, motiv:e.motivScutire||'', inlocuitaLa:todayISO()});
}
function descriereScutire(x){
  const fel = x.tip==='partiala'?'Parțială':x.tip==='temporara'?`Temporară (${x.subTip==='partiala'?'parțială':'totală'})`:'Totală anuală';
  const per = x.start&&x.end ? `, ${formatDataRo(x.start)}–${formatDataRo(x.end)}` : '';
  return fel+per;
}
function istoricScutiriHTML(e){
  const ist = e.istoricScutiri||[];
  if(!ist.length) return '';
  return `<div style="margin-top:6px; font-size:12px; color:var(--muted);"><b>Scutiri anterioare:</b>${ist.map(x=>`<div>• ${escapeHtml(descriereScutire(x))}${x.motiv?` — ${escapeHtml(x.motiv)}`:''}</div>`).join('')}</div>`;
}
function renderScutiri(main){
  const scutiti = state.elevi.filter(e=>e.scutit && e.scutireTip);
  if(!ui.clasaCurenta || !claseActive().find(c=>c.id===ui.clasaCurenta)){
    ui.clasaCurenta = claseActive().length ? claseActive()[0].id : null;
  }
  if(!ui.scutireTipNou) ui.scutireTipNou = 'totala_anuala';
  // în listă apar TOȚI elevii clasei: unui elev i se poate trece o scutire nouă (ex.: după ce i-a expirat cea veche);
  // scutirea anterioară nu se pierde, trece în istoricul elevului
  const eleviNescutitiClasa = ui.clasaCurenta ? eleviDinClasa(ui.clasaCurenta) : [];
  const etichetaScutire = e => !(e.scutit && e.scutireTip) ? '' : (esteScutitActiv(e) ? ' — are scutire activă' : ' — scutire expirată');
  const eleviCes = state.elevi.filter(e=>e.ces);
  const eleviNeCesClasa = ui.clasaCurenta ? eleviDinClasa(ui.clasaCurenta).filter(e=>!e.ces) : [];
  main.innerHTML = `
    <h2>Scutiri medicale</h2>
    <p class="tab-desc">Vezi toți elevii scutiți, indiferent de clasă, și gestionează scutirile. Gestionarea se face doar aici.</p>
    <div class="card">
      <div class="row">
        <div class="field" style="min-width:180px;">
          <label>Clasă</label>
          <select id="select-scutire-clasa" ${claseActive().length===0?'disabled':''}>
            ${claseActive().length===0 ? '<option>Nicio clasă</option>' :
              claseActive().map(c=>`<option value="${c.id}" ${c.id===ui.clasaCurenta?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:220px;">
          <label>Elev</label>
          <select id="select-scutire-elev" ${eleviNescutitiClasa.length===0?'disabled':''}>
            <option value="">${eleviNescutitiClasa.length===0 ? 'Niciun elev disponibil' : 'Alege un elev...'}</option>
            ${eleviNescutitiClasa.map(e=>`<option value="${e.id}" ${ui.scutireElevSel===e.id?'selected':''}>${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}${etichetaScutire(e)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:200px;">
          <label>Fel de scutire</label>
          <select id="select-scutire-tip">
            <option value="totala_anuala" ${ui.scutireTipNou==='totala_anuala'?'selected':''}>Totală anuală</option>
            <option value="partiala" ${ui.scutireTipNou==='partiala'?'selected':''}>Parțială</option>
            <option value="temporara" ${ui.scutireTipNou==='temporara'?'selected':''}>Temporară</option>
          </select>
        </div>
      </div>
      ${ui.scutireTipNou==='temporara' ? `
      <div class="row" style="margin-top:10px;">
        <div class="field" style="min-width:160px;">
          <label>Fel (în perioada temporară)</label>
          <select id="select-scutire-subtip">
            <option value="totala">Totală</option>
            <option value="partiala">Parțială</option>
          </select>
        </div>
        <div class="field">
          <label>De la</label>
          <input type="date" id="input-scutire-start" value="${todayISO()}"/>
        </div>
        <div class="field">
          <label>Până la</label>
          <input type="date" id="input-scutire-end" value="${todayISO()}"/>
        </div>
      </div>
      ` : ''}
      <div class="row" style="margin-top:10px;">
        <div class="field" style="flex:1; min-width:220px;">
          <label>Motiv scutire</label>
          <input type="text" id="input-scutire-motiv" placeholder="ex: scutire medicală pe semestrul I"/>
        </div>
        <button class="btn btn-primary" id="btn-add-scutire">+ Adaugă scutirea</button>
      </div>
    </div>
    ${scutiti.length===0 ? emptyState('Niciun elev scutit momentan.', 'Adaugă o scutire folosind formularul de mai sus.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Elev</th><th>Clasă</th><th>Fel</th><th>Motiv</th><th></th></tr></thead>
        <tbody>
          ${scutiti.map(e=>`
            <tr>
              <td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${cesTagHTML(e)}</td>
              <td>${escapeHtml(claseNume(e.claseId))}</td>
              <td>${scutirePillHTML(e)}</td>
              <td>${escapeHtml(e.motivScutire) || '—'}${istoricScutiriHTML(e)}</td>
              <td style="white-space:nowrap;"><button class="btn btn-secondary" data-scutirenoua="${e.id}">+ Scutire nouă</button> <button class="btn btn-ghost" data-unscutire="${e.id}">Anulează scutirea</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`}

    <h2 style="margin-top:28px;">Elevi cu CES</h2>
    <p class="tab-desc">Cerințe educaționale speciale — elevul <b>nu e scutit</b>, primește notă normal, dar apare marcat cu o pastilă mov în toate secțiunile, ca să-l tratezi diferit la oră.</p>
    <div class="card">
      <div class="row">
        <div class="field" style="min-width:220px;">
          <label>Elev (din clasa aleasă mai sus)</label>
          <select id="select-ces-elev" ${eleviNeCesClasa.length===0?'disabled':''}>
            <option value="">${eleviNeCesClasa.length===0 ? 'Niciun elev disponibil' : 'Alege un elev...'}</option>
            ${eleviNeCesClasa.map(e=>`<option value="${e.id}">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="flex:1; min-width:220px;">
          <label>Detalii (opțional)</label>
          <input type="text" id="input-ces-detalii" placeholder="ex: cerință de ritm propriu, sarcini adaptate"/>
        </div>
        <button class="btn btn-primary" id="btn-add-ces">+ Marchează CES</button>
      </div>
    </div>
    ${eleviCes.length===0 ? emptyState('Niciun elev cu CES momentan.', 'Adaugă unul folosind formularul de mai sus.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Elev</th><th>Clasă</th><th>Detalii</th><th></th></tr></thead>
        <tbody>
          ${eleviCes.map(e=>`
            <tr>
              <td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${cesTagHTML(e)}</td>
              <td>${escapeHtml(claseNume(e.claseId))}</td>
              <td>${escapeHtml(e.cesDetalii) || '—'}</td>
              <td><button class="btn btn-ghost" data-unces="${e.id}">Anulează CES</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`}
  `;
  document.getElementById('select-scutire-clasa').addEventListener('change', e=>{
    ui.clasaCurenta = e.target.value; render();
  });
  document.getElementById('select-ces-elev') && document.getElementById('btn-add-ces').addEventListener('click', ()=>{
    const id = document.getElementById('select-ces-elev').value;
    const detalii = document.getElementById('input-ces-detalii').value.trim();
    if(!id) return showToast('Alege un elev.');
    const e = state.elevi.find(e=>e.id===id);
    e.ces = true; e.cesDetalii = detalii;
    saveState(); render(); showToast('Elev marcat CES.');
  });
  main.querySelectorAll('[data-unces]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const e = state.elevi.find(e=>e.id===b.dataset.unces);
      if(!confirm(`Anulezi marcajul CES pentru ${e.nume} ${e.prenume}?`)) return;
      e.ces = false; e.cesDetalii = '';
      saveState(); render(); showToast('Marcaj CES anulat.');
    });
  });
  // elevul ales rămâne ales și după ce schimbi felul scutirii
  document.getElementById('select-scutire-elev').addEventListener('change', e=>{ ui.scutireElevSel = e.target.value || null; });
  document.getElementById('select-scutire-tip').addEventListener('change', e=>{
    ui.scutireTipNou = e.target.value; render();
  });
  document.getElementById('btn-add-scutire').addEventListener('click', ()=>{
    const id = document.getElementById('select-scutire-elev').value;
    const motiv = document.getElementById('input-scutire-motiv').value.trim();
    const tip = ui.scutireTipNou;
    if(!id) return showToast('Alege un elev.');
    const e = state.elevi.find(e=>e.id===id);
    let subTip=null, start=null, end=null;
    if(tip==='temporara'){
      subTip = document.getElementById('select-scutire-subtip').value;
      start = document.getElementById('input-scutire-start').value;
      end = document.getElementById('input-scutire-end').value;
      if(!start || !end) return showToast('Completează perioada (de la - până la).');
      if(end<start) return showToast('Data „până la” nu poate fi înainte de „de la”.');
    }
    // elevul are deja o scutire: cea veche trece în istoric, nu se pierde
    if(e.scutit && e.scutireTip){
      if(esteScutitActiv(e) && !confirm(`${e.nume} ${e.prenume} are o scutire activă. Scutirea nouă o înlocuiește, iar cea veche trece în istoricul elevului. Continui?`)) return;
      arhiveazaScutire(e);
    }
    e.scutit = true;
    e.scutireTip = tip;
    e.motivScutire = motiv;
    ui.scutireElevSel = null;
    if(tip==='temporara'){
      e.scutireSubTip = subTip; e.scutireStart = start; e.scutireEnd = end;
    } else {
      e.scutireSubTip = null; e.scutireStart = null; e.scutireEnd = null;
    }
    saveState(); render(); showToast('Scutire înregistrată.');
  });
  // „+ Scutire nouă” din tabel: alege clasa și elevul în formular și duce pagina sus, la formular
  main.querySelectorAll('[data-scutirenoua]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const e = state.elevi.find(e=>e.id===b.dataset.scutirenoua);
      ui.clasaCurenta = e.claseId; ui.scutireElevSel = e.id; render();
      const sel = document.getElementById('select-scutire-elev');
      if(sel){ sel.scrollIntoView({behavior:'smooth', block:'center'}); sel.focus(); }
      showToast('Completează scutirea nouă în formular.');
    });
  });
  main.querySelectorAll('[data-unscutire]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const e = state.elevi.find(e=>e.id===b.dataset.unscutire);
      e.scutit = false; e.motivScutire = ''; e.scutireTip = null; e.scutireSubTip = null; e.scutireStart = null; e.scutireEnd = null;
      saveState(); render(); showToast('Scutire anulată.');
    });
  });
}

function seteazaStareSync(s){ sync.stare=s; if(s==='sincronizat') sync.ultimaSinc=new Date(); actualizeazaSyncBtn(); }
function textSync(){ return ({neconectat: sync.disponibil?'☁ Conectează':'', trimite:'☁ Se trimite…', sincronizat:'☁ Sincronizat', offline:'☁ Fără internet', eroare:'⚠ Sincronizare', asteapta:'☁ Se conectează…'})[sync.stare]||''; }
function actualizeazaSyncBtn(){ const sb=document.getElementById('sync-ind'); if(!sb) return; const t=textSync(); sb.textContent=t; sb.style.display=t?'':'none'; sb.className='sync-btn'+(sync.stare==='eroare'?' err':sync.stare==='sincronizat'?' ok':''); }
function areDate(){ return (state.clase||[]).length>0 || (state.elevi||[]).length>0; }
function cand(ms){ return ms?new Date(ms).toLocaleString('ro-RO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'; }

function incarcaScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function initSync(){
  if(!location.protocol.startsWith('http')) return;

    const b=`https://www.gstatic.com/firebasejs/${FB_VER}/`;

function laDeconectare(){ if(sync.unsub){ sync.unsub(); sync.unsub=null; } sync.uid=null; sync.email=''; seteazaStareSync('neconectat'); render(); }
async function laConectare(u){

}

/* ---- îmbinare automată (3 căi): ce ai schimbat aici + ce s-a schimbat în cont, fără întrebări ---- */
const BAZA_KEY='catalog_efs_sync_baza_v1';
function eg(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
function esteObj(x){ return x && typeof x==='object' && !Array.isArray(x); }
function merge3(b,l,r,localMaiNou){
  if(eg(l,r)) return l;
  if(eg(l,b)) return r;
  if(eg(r,b)) return l;
  if(l===undefined) return r;   // șters aici, modificat în cont -> păstrăm modificarea
  if(r===undefined) return l;
  if(Array.isArray(l) && Array.isArray(r)){
    const ba=Array.isArray(b)?b:[];
    const cuId=a=>a.every(x=>esteObj(x) && typeof x.id==='string');
    if(cuId(l) && cuId(r) && cuId(ba)){
      const mb=new Map(ba.map(x=>[x.id,x])), ml=new Map(l.map(x=>[x.id,x])), mr=new Map(r.map(x=>[x.id,x]));
      const ids=[...ml.keys(), ...[...mr.keys()].filter(i=>!ml.has(i))];
      const out=[];
      ids.forEach(i=>{ const v=merge3(mb.get(i), ml.get(i), mr.get(i), localMaiNou); if(v!==undefined) out.push(v); });
      return out;
    }
    // liste simple / fără id: mulțime (adăugări de ambele părți, ștergeri de ambele părți)
    const k=x=>JSON.stringify(x);
    const sb=new Set(ba.map(k)), sl=new Set(l.map(k)), sr=new Set(r.map(k));
    const out=[]; const vazut=new Set();
    [...l,...r].forEach(x=>{ const c=k(x); if(vazut.has(c)) return; vazut.add(c);
      const inB=sb.has(c), inL=sl.has(c), inR=sr.has(c);
      if(inL && inR) out.push(x);
      else if(inL && !inB) out.push(x);        // adăugat aici
      else if(inR && !inB) out.push(x);        // adăugat în cont
      // altfel: șters pe una din părți
    });
    return out;
  }
  if(esteObj(l) && esteObj(r)){
    const bb=esteObj(b)?b:{}, out={};
    new Set([...Object.keys(l),...Object.keys(r)]).forEach(c=>{
      const v=merge3(bb[c], l[c], r[c], localMaiNou); if(v!==undefined) out[c]=v;
    });
    return out;
  }
  return localMaiNou ? l : r;   // aceeași valoare modificată pe ambele: cea mai recentă
}
function salveazaBaza(json){ try{ localStorage.setItem(BAZA_KEY, json); }catch(e){} }
function citesteBaza(){ try{ const j=localStorage.getItem(BAZA_KEY); return j?JSON.parse(j):null; }catch(e){ return null; } }
// modificări și aici, și în cont: le îmbinăm automat, apoi trimitem rezultatul
async function imbinaAutomat(m){
  try{
    const remote=await citesteCont(m);
    try{ localStorage.setItem('catalog_efs_copie_inlocuita', JSON.stringify({salvat:Date.now(), state})); }catch(e){}
    const baza=citesteBaza()||{};
    const localMaiNou=(syncLocal.modificat||0) >= (m.actualizat||0);
    const imbinat=merge3(baza, JSON.parse(JSON.stringify(state)), remote, localMaiNou);
    sync.suprim=true;
    state=Object.assign(JSON.parse(JSON.stringify(STARE_IMPLICITA)), imbinat); migreazaDate();
    saveStateNow();
    sync.suprim=false;
    syncLocal.baza=m.versiune; syncLocal.dirty=true; syncLocal.uid=sync.uid; syncLocal.partiAnterioare=m.parti||1; salveazaSyncLocal();
    await urca();
    renderPastrand(); showToast('Datele de pe cele două dispozitive au fost îmbinate ✓');
  }catch(e){ sync.suprim=false; console.error(e); seteazaStareSync('eroare'); }
}
// (varianta veche, cu întrebare — nu se mai folosește)
function conflict(m){
  const b=smModal(`<h3>Modificări pe două dispozitive</h3>
    <p>Pe acest dispozitiv ai modificări care n-au ajuns încă în cont (ultima: <b>${cand(syncLocal.modificat)}</b>), iar între timp în cont au intrat modificări de pe alt dispozitiv (<b>${cand(m.actualizat)}</b>).</p>
    <p style="font-size:13px; color:var(--muted);">Varianta pe care n-o alegi se păstrează ca fișier de siguranță (o găsești apăsând butonul ☁ de sus), ca să nu pierzi nimic.</p>
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
      <button class="btn btn-primary" id="cf-local">Păstrează ce am pe acest dispozitiv</button>
      <button class="btn btn-secondary" id="cf-cont">Ia ce e în cont</button>
    </div>`);
  b.querySelector('#cf-local').onclick=async()=>{ smClose(); try{ const vechi=await citesteCont(m); localStorage.setItem('catalog_efs_copie_inlocuita', JSON.stringify({salvat:Date.now(), state:vechi})); }catch(e){} await urca(); asculta(); render(); showToast('Modificările de pe acest dispozitiv au fost trimise ✓'); };
  b.querySelector('#cf-cont').onclick=async()=>{ smClose(); pastreazaCopie(); try{ await descarca(m); }catch(e){ seteazaStareSync('eroare'); } asculta(); render(); showToast('Datele din cont au fost aduse ✓'); };
}
function asculta(){
  if(sync.unsub) sync.unsub();
  sync.unsub=refMeta().onSnapshot(snap=>{
    if(!snap.exists) return;
    const m=snap.data();
    if(m.versiune===syncLocal.baza){ if(!syncLocal.dirty && !sync.inLucru) seteazaStareSync('sincronizat'); return; }
    if(m.dispozitiv===syncLocal.deviceId || sync.inLucru) return;
    if(syncLocal.dirty){ imbinaAutomat(m); return; }
    descarca(m).then(()=>{ renderPastrand(); showToast('Actualizat cu ce ai trecut pe celălalt dispozitiv ✓'); }).catch(e=>{ console.error(e); seteazaStareSync('eroare'); });
  }, e=>{ console.warn(e); seteazaStareSync('offline'); });
}
async function urca(){
  if(!sync.uid || !sync.db) return;
  if(sync.inLucru){ sync.iarDupa=true; return; }
  sync.inLucru=true; sync.iarDupa=false; seteazaStareSync(navigator.onLine===false?'offline':'trimite');
  const json=JSON.stringify(state), parti=[];
  const jsonUrcat=json;
  for(let i=0;i<json.length;i+=PARTE) parti.push(json.slice(i,i+PARTE));
  if(!parti.length) parti.push('{}');
  const versiune=Date.now().toString(36)+'-'+String(syncLocal.deviceId).slice(-5);
  const col=refMeta().parent, b=sync.db.batch();
  parti.forEach((p,i)=>b.set(col.doc('p'+i), {s:p}));
  for(let i=parti.length; i<Math.max(parti.length, syncLocal.partiAnterioare||0); i++) b.delete(col.doc('p'+i));
  b.set(refMeta(), {versiune, parti:parti.length, actualizat:Date.now(), dispozitiv:syncLocal.deviceId, marime:json.length});
  try{
    await b.commit();
    syncLocal.baza=versiune; syncLocal.partiAnterioare=parti.length; syncLocal.uid=sync.uid;
    if(!sync.iarDupa) syncLocal.dirty=false;
    if(!sync.iarDupa) salveazaBaza(jsonUrcat);
    salveazaSyncLocal(); seteazaStareSync('sincronizat');
  }catch(e){ console.error(e); seteazaStareSync(e&&e.code==='permission-denied'?'eroare':'offline'); }
  sync.inLucru=false;
  if(sync.iarDupa){ sync.iarDupa=false; urca(); }
}
async function citesteCont(m){
  const col=refMeta().parent;
  const docs=await Promise.all(Array.from({length:m.parti||1},(_,i)=>col.doc('p'+i).get()));
  return JSON.parse(docs.map(d=>d.exists?d.data().s:'').join('')||'{}');
}
async function descarca(m){
  const p=await citesteCont(m);
  sync.suprim=true;
  state=Object.assign(JSON.parse(JSON.stringify(STARE_IMPLICITA)), p); migreazaDate(); saveStateNow();
  sync.suprim=false;
  syncLocal.baza=m.versiune; syncLocal.dirty=false; syncLocal.uid=sync.uid; syncLocal.partiAnterioare=m.parti||1; salveazaSyncLocal();
  salveazaBaza(JSON.stringify(state));
  seteazaStareSync('sincronizat');
}
function marcheazaModificat(){
  if(sync.suprim) return;
  syncLocal.dirty=true; syncLocal.modificat=Date.now(); salveazaSyncLocal();
  if(sync.uid){ clearTimeout(sync.t); sync.t=setTimeout(urca, 1500); }
}
window.addEventListener('online', ()=>{ if(sync.uid){ if(sync.stare!=='sincronizat') laConectare(sync.auth.currentUser||{uid:sync.uid, email:sync.email}); } });

      <p style="font-size:13px; color:var(--muted);">Fiecare cont își vede doar datele lui.${areDate()?' Datele de pe acest dispozitiv se urcă în cont la prima conectare (sau alegi ce păstrezi, dacă în cont există deja date).':''}</p>
      <div class="row" style="justify-content:flex-end; gap:8px;"><button class="btn btn-ghost" id="mc-x">Nu acum</button><button class="btn btn-primary" id="mc-in">Intră cu Google</button></div>`);

    ${sync.stare==='offline'?'<p style="font-size:13px; color:var(--muted);">Nu e internet acum. Ce scrii se păstrează pe acest dispozitiv și se trimite singur când revine conexiunea.</p>':''}
