<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Catalog EFS</title>
<meta name="author" content="Daniel Botezatu">
<meta name="copyright" content="© 2026 Daniel Botezatu — CC BY-NC-ND 4.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22402C">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catalog EFS">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="xlsx.full.min.js"></script>
<style>
  :root{
    --track:#C1440E;
    --track-dark:#9A350A;
    --infield:#22402C;
    --infield-dark:#182E20;
    --chalk:#F6F4EE;
    --card:#FFFFFF;
    --ink:#1E211D;
    --muted:#6E7268;
    --border:#E2DECF;
    --yellow:#E3A23C;
    --danger:#B23A32;
    --ok:#3D7A4E;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--chalk);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',system-ui,sans-serif;
    text-transform:uppercase;
    letter-spacing:0.02em;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  /* ---------- HEADER ---------- */
  header{
    background:var(--infield);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    flex-shrink:0;
    border-bottom:4px solid var(--track);
  }
  header .title{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  header h1{
    margin:0;
    font-size:22px;
    color:#fff;
  }
  header .subtitle{
    font-size:13px;
    color:#C9D6C7;
    font-family:'Inter',sans-serif;
    text-transform:none;
    letter-spacing:0;
  }
  header .date{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    color:#E3D9C4;
    text-transform:capitalize;
  }
  /* ---------- LAYOUT ---------- */
  .body-wrap{
    flex:1;
    display:flex;
    overflow:hidden;
  }
  nav.sidebar{
    width:190px;
    background:var(--infield-dark);
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    padding:10px 0;
    overflow-y:auto;
  }
  nav.sidebar button{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    border:none;
    background:transparent;
    color:#CFE0CC;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:600;
    padding:14px 18px;
    cursor:pointer;
    text-align:left;
    border-left:4px solid transparent;
  }
  nav.sidebar button svg{flex-shrink:0;width:20px;height:20px;}
  nav.sidebar button.active{
    background:var(--infield);
    color:#fff;
    border-left:4px solid var(--track);
  }
  nav.sidebar button:not(.active):hover{
    background:rgba(255,255,255,0.06);
  }
  main{
    flex:1;
    overflow-y:auto;
    padding:22px 26px 80px;
  }
  main h2{
    font-size:22px;
    margin:0 0 4px;
    color:var(--infield);
  }
  .tab-desc{
    color:var(--muted);
    font-size:14px;
    margin:0 0 20px;
  }
  /* ---------- BOTTOM TAB BAR (narrow screens) ---------- */
  nav.bottombar{
    display:none;
  }
  @media (max-width:760px){
    nav.sidebar{display:none;}
    .body-wrap{flex-direction:column;}
    main{padding:16px 14px 90px;}
    nav.bottombar{
      display:flex;
      position:fixed;
      bottom:0; left:0; right:0;
      background:var(--infield-dark);
      border-top:3px solid var(--track);
      z-index:20;
    }
    nav.bottombar button{
      flex:1 1 0%;
      min-width:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:3px;
      background:transparent;
      border:none;
      color:#CFE0CC;
      font-size:12px;
      font-weight:600;
      padding:8px 2px 10px;
    }
    nav.bottombar button span{
      max-width:100%;
      overflow:hidden;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:2;
      line-clamp:2;
      text-align:center;
      line-height:1.15;
      word-break:break-word;
      overflow-wrap:anywhere;
      hyphens:auto;
    }
    nav.bottombar button svg{width:20px;height:20px;}
    nav.bottombar button.active{color:#fff;}
    nav.bottombar button.active svg{stroke:var(--track);}
  }
  /* ---------- MOD COMPACT PE ECRAN ÎN PORTRET (tabletă) — mai mulți elevi vizibili pe pagină ---------- */
  @media (orientation: portrait){
    header{padding:8px 14px;}
    header h1{font-size:17px;}
    header .subtitle{display:none;}
    header .date{display:none;}
    main{padding:10px 12px 80px;}
    main h2{font-size:17px; margin-bottom:2px;}
    .tab-desc{font-size:12px; margin-bottom:10px;}
    .card{padding:10px; margin-bottom:10px;}
    .row{gap:6px;}
    input[type=text], input[type=date], input[type=number], select{
      min-height:36px; padding:7px 9px; font-size:14px;
    }
    button.btn{min-height:36px; padding:8px 12px; font-size:13px;}
    table th{padding:5px 6px; font-size:11px;}
    table td{padding:5px 6px; font-size:13px;}
    nav.sidebar button{padding:9px 14px; font-size:13px;}
    nav.sidebar{width:150px;}
    input.grade-input{width:78px; min-height:34px; padding:5px 7px; font-size:14px;}
  }
  /* ---------- GENERIC UI ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em;}
  input[type=text], input[type=date], input[type=number], select{
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:10px 12px;
    border:1.5px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    min-height:44px;
  }
  input:focus, select:focus{outline:2px solid var(--track); outline-offset:1px;}
  button.btn{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14px;
    padding:11px 18px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    min-height:44px;
    white-space:nowrap;
  }
  button.btn-primary{background:var(--track); color:#fff;}
  button.btn-primary:hover{background:var(--track-dark);}
  button.btn-secondary{background:#fff; color:var(--infield); border:1.5px solid var(--infield);}
  button.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger); padding:8px 12px; font-size:13px; min-height:36px;}
  button.btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--border); padding:8px 12px; font-size:13px; min-height:36px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{
    text-align:left;
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
    border-bottom:2px solid var(--border);
    padding:8px 8px;
  }
  td{padding:9px 8px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
  }
  .empty .display{font-size:17px; color:var(--infield); margin-bottom:6px;}
  .pill{
    display:inline-block;
    padding:3px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
  }
  .pill-yellow{background:#FBEBD3; color:#8A5A16;}
  .pill-danger{background:#F6DCDA; color:var(--danger);}
  .pill-ok{background:#DCEBDF; color:var(--ok);}
  .pill-blue{background:#D9E6F5; color:#1D5A9E;}
  .pill-ghost{background:#EDEBE3; color:var(--muted);}
  .pill-purple{background:#EAE0F5; color:#6B3FA0;}
  .class-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px;}
  .class-card{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    border-top:4px solid var(--infield);
  }
  .class-card h3{margin:0 0 4px; font-size:18px; color:var(--infield);}
  .class-card .count{color:var(--muted); font-size:13px; margin-bottom:12px;}
  .class-card .actions{display:flex; gap:8px;}
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--infield);
    color:#fff;
    padding:10px 20px;
    border-radius:30px;
    font-size:14px;
    font-weight:600;
    box-shadow:0 6px 18px rgba(0,0,0,0.2);
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  input.grade-input{width:100px; text-align:center;}
  .student-name{font-weight:600;}
  .exempt-note{font-style:italic; color:var(--yellow); font-size:13px;}
  select.absence-select{min-width:170px;}
  .sync-btn{background:transparent; border:1px solid #4A5A68; color:#D9DEE3; border-radius:8px; padding:6px 10px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit;}
  .sync-btn.ok{border-color:#3D7A4E; color:#BFE3C8;} .sync-btn.err{border-color:#B23A32; color:#F6C9C5;}
  @media (max-width:760px){ .sync-btn{padding:5px 7px; font-size:11px;} }
  .settings-btn{
    background:transparent;
    border:none;
    color:#C9D6C7;
    cursor:pointer;
    padding:6px;
  }
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
  }
  .modal{
    background:#fff; border-radius:12px; padding:24px;
    width:min(420px,90vw);
    max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px);
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  }
  .modal h3{margin-top:0; color:var(--infield);}
  .modal .row{margin-bottom:14px;}
  .top-actions{display:flex; justify-content:flex-end; gap:8px; margin-bottom:14px;}
  .count-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:22px; height:22px; padding:0 6px;
    border-radius:11px; background:var(--track); color:#fff;
    font-size:12px; font-weight:700;
  }
  /* ---------- TELEFON (iPhone / Android) — ecran îngust ---------- */
  html{-webkit-text-size-adjust:100%;}
  #app{height:100vh; height:100dvh;}
  @media (max-width:600px){
    /* iOS mărește automat pagina când atingi un câmp cu font sub 16px — le facem 16px */
    input[type=text], input[type=date], input[type=number], input[type=search], select, textarea,
    input.grade-input, input.calificativ-input, select.calificativ-input{font-size:16px !important;}
    header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px; }
    header .title h1{font-size:16px;}
    #save-indicator{display:none;}
    header .btn-primary{padding:6px 10px !important;}
    main{padding:10px 10px calc(90px + env(safe-area-inset-bottom));}
    /* 18 taburi nu încap pe un telefon: bara de jos devine derulabilă lateral */
    nav.bottombar{
      overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
      padding-bottom:env(safe-area-inset-bottom); scrollbar-width:none;
    }
    nav.bottombar::-webkit-scrollbar{display:none;}
    nav.bottombar button{flex:0 0 68px; padding:8px 2px 10px;}
    nav.bottombar button span{font-size:11px;}
    .card{padding:10px;}
    .modal{width:calc(100vw - 24px); padding:16px;}
    .modal div[style*="max-height:220px"]{max-height:none !important; overflow:visible !important;}
  }
  /* ---------- ORAR TABEL + ORA CURENTĂ + STARE NOTARE ---------- */
  table.orar-grid{border-collapse:collapse; width:100%;}
  table.orar-grid th, table.orar-grid td{border:1px solid var(--border); padding:4px 5px; text-align:center;}
  table.orar-grid th.ora-col{text-align:left; white-space:nowrap; background:var(--chalk);}
  table.orar-grid th.ora-col small{display:block; font-weight:400; color:var(--muted); font-size:11px;}
  table.orar-grid select{min-height:34px; padding:4px 6px; width:100%; min-width:74px; font-weight:700;}
  .orar-azi-col{background:#FFF9E5;}
  table.orar-grid td.orar-now{background:#FFE08A; box-shadow:inset 0 0 0 3px var(--track);}
  table.orar-grid th.orar-now{background:var(--track); color:#fff;}
  table.orar-grid th.orar-now small{color:#fff;}
  .card-ora.ora-acum{box-shadow:0 0 0 3px var(--track); background:#FFF9E5;}
  #azi-acum{background:var(--infield); color:#fff; border-color:var(--infield); font-size:15px;}
  .stare-cell{text-align:center; font-weight:700; cursor:pointer; white-space:nowrap; user-select:none;}
  td.stare-na{color:var(--muted); cursor:default; font-weight:400;}
  .stare-zero{background:#F3E1DF; color:#8A2A22;}
  .stare-partial{background:#FBEBD3; color:#8A5A10;}
  .stare-aproape{background:#E3EFDD; color:#2C5A2C;}
  .stare-fin{background:#2E7D32; color:#fff;}
  .legenda-stare{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 10px; font-size:12px;}
  .legenda-stare .stare-cell{padding:2px 8px; border-radius:10px; cursor:default;}
  #lbl-clasa-notata{display:flex; align-items:center; gap:10px; padding:10px 12px; border:2px solid var(--border); border-radius:10px; margin-bottom:12px; background:#fff; font-weight:600; cursor:pointer;}
  #lbl-clasa-notata.notata-ok{background:#E3EFDD; border-color:#2E7D32; color:#1B5E20;}
  #lbl-clasa-notata input{width:24px; height:24px; flex-shrink:0;}
  /* ---------- ECHIPE REPREZENTATE ---------- */
  .echipa-card h3{margin:0;}
  .echipa-head{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  table.echipa-tbl input{min-height:32px; padding:4px 6px; font-size:14px;}
  table.echipa-tbl td{vertical-align:middle;}
  .pill-cat{display:inline-block; padding:2px 9px; border-radius:10px; font-weight:700; font-size:12px; background:var(--infield); color:#fff;}
  .pill-cat.u16{background:#C1440E;}
  .add-elev-list label{display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--border); cursor:pointer;}
  .add-elev-list label.deja{opacity:.5; cursor:default;}
  .add-elev-list input[type=checkbox]{width:22px; height:22px; flex-shrink:0;}
.rand-inactiv td{background:#fff4d6 !important;}
.rand-inactiv .student-name{color:#7a5200;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CATALOG EFS — catalog personal pentru profesorul de educație fizică
   Stocare persistentă locală (localStorage), 100% pe dispozitiv, fără internet.
   ============================================================ */

/* © 2026 Daniel Botezatu — Catalog EFS
   Licență: Creative Commons Atribuire-Necomercial-FărăDerivate 4.0 (CC BY-NC-ND 4.0)
   https://creativecommons.org/licenses/by-nc-nd/4.0/deed.ro
   Utilizare gratuită, cu menționarea autorului. Se interzic vânzarea, utilizarea comercială,
   modificarea și redistribuirea aplicației sau a unor părți din ea, inclusiv eliminarea mențiunii de autor.
   Concepută de Daniel Botezatu pentru nevoile unui profesor de educație fizică și sport; realizată cu asistență AI (Claude, Anthropic). */
const AUTOR_APP = {nume:'Daniel Botezatu', an:'2026', licenta:'CC BY-NC-ND 4.0', url:'https://creativecommons.org/licenses/by-nc-nd/4.0/deed.ro'};
function autorHTML(){ return `<span class="autor-app"> · © ${AUTOR_APP.an} ${AUTOR_APP.nume}</span>`; }
// mențiunea de autor nu se poate șterge din aplicație: dacă dispare din pagină, se repune
setInterval(()=>{ const st=document.querySelector('header .subtitle'); if(st && !st.querySelector('.autor-app')) st.insertAdjacentHTML('beforeend',autorHTML()); }, 5000);
const STORAGE_KEY = 'catalog_efs_state_v1';
const UI_STORAGE_KEY = 'catalog_efs_ui_v1';

let state = {
  settings: { titlu: 'Catalogul meu EFS', anScolar: '2026-2027', urmatorulCodElev: 1, taburiAscunse: [], ultimulExport: null },
  clase: [],      // {id, nume, an: 'IX'|'X'|'XI'|'XII'}
  elevi: [],      // {id, claseId, nume, prenume, sex, scutit, motivScutire}
  probe: [],      // {id, nume, claseId ('all' sau id clasă), data}
  note: [],       // {id, eleviId, probaId, valoare, notaCalculata, data}
  absente: [],    // {id, eleviId, claseId, data, stare} stare: 'prezent'|'absent'
  bareme: [],     // {id, nume, directie:'desc'|'asc', praguri:{IX:{M:{9..4},F:{9..4}}, X:{...}, XI:{...}, XII:{...}}}
  observatiiCustom: [],  // observații suplimentare adăugate de profesor, pe lângă cele predefinite
  echipe: [],        // {id, eleviId, categorie:'U16'|'U18', sport, pozitie, tricou, aviz, acord, obs} — elevi în echipele reprezentative
  meciuriEchipe: [], // {id, categorie, sport, data, eveniment, rezultat, obs}
  sporturiEchipe: ['Fotbal','Futsal','Handbal','Baschet','Volei','Atletism','Tenis de masă'],
  noteCurente: [],   // {id, eleviId, claseId, data, valoare, motiv, detalii, obs} — note curente, în afara probelor
  notareFinalizata: [], // {claseId, probaId} — clasa bifată ca „notată” la o probă
  module: [],     // {id, nume, start, end} — perioadele anului școlar (5 module), pentru calculul Participării active (PPP)
  puncteObservatii: {},  // { "textul observației": puncte de scăzut din 10 } — editabil de profesor
  puncteAbsentaGoala: 2,  // puncte scăzute pentru fiecare absență (punctaj fix, uniform — observația nu se mai aplică la absență)
  pppPonderi: { performanta: 40, progres: 25, tehnica: 35, participare: 20, participareActiva: false },  // procentele din formula PPP, editabile
  tehnicaExecutie: [],  // {id, eleviId, probaId, valoare} — nota de corectitudine tehnică, dată manual de profesor, o dată per probă
  orar: [],  // {id, zi:'LU'..'VI', ora: number, claseId} — orarul săptămânal fix, pentru tot anul
  planificari: [],  // {id, an:'IX'..'XII', data, tema, recAfara, recInterior, recMixt} — planificarea pe lecție, pe an de studiu + dată
  pppAfisareCatalog: true  // în tabul PPP arată și nota rotunjită pentru catalog (comutator)
};

const STARE_IMPLICITA = JSON.parse(JSON.stringify(state)); // valorile de pornire, pentru datele aduse din cont
const ANI = ['IX','X','XI','XII'];

let currentTab = 'clase';
let ui = {
  clasaCurenta: null,
  notareProba: null,
  absenteData: todayISO(),
  baremeSelectat: null, baremeAn: 'IX',
  sintezaTipRaport: 'simplu',
  istoricElev: null,
  pppProba: null,
  combinatModul: null, combinatProbe: [], combinatSursa: 'performanta',
  orarZi: 'LU',
  planificareAn: 'IX', planificareClasa: null,
  obsPunctajSelectat: '__absenta_goala__',
};

function todayISO(){
  // data locală (nu UTC), ca după miezul nopții ora României să nu arate încă ziua precedentă
  const d = new Date();
  const z = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
}
const ZILE = ['LU','MA','MI','JO','VI'];
const ZILE_NUME = {LU:'Luni', MA:'Marți', MI:'Miercuri', JO:'Joi', VI:'Vineri', SA:'Sâmbătă', DU:'Duminică'};
// ziua săptămânii pentru o dată ISO (YYYY-MM-DD) -> 'LU'..'DU'
function ziDinData(dataISO){
  const d = new Date(dataISO + 'T12:00:00'); // ora 12 ca să evităm probleme de fus orar la miezul nopții
  const idx = d.getDay(); // 0=duminică, 1=luni, ... 6=sâmbătă
  return ['DU','LU','MA','MI','JO','VI','SA'][idx];
}
function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// numele elevilor se afișează mereu cu majuscule, indiferent cum le tastezi

/* ---------------- STORAGE ----------------
   Salvare 100% locală, în browserul dispozitivului (localStorage).
   Nu are nevoie de internet — funcționează și fără semnal, pe teren.
   Singura limită: datele rămân pe DISPOZITIVUL pe care le-ai introdus.
   Pentru a le muta pe alt dispozitiv (laptop <-> tabletă), folosește
   Setări -> Exportă backup / Importă backup.
------------------------------------------------ */
async function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){
    console.log('Nicio dată salvată anterior pe acest dispozitiv, pornim de la zero.');
  }
  migreazaDate();
  loadUIState();
}
// ține minte tab-ul curent și selecțiile (clasă/elev/probă) din fiecare secțiune,

function loadUIState(){
  try{
    const raw = localStorage.getItem(UI_STORAGE_KEY);

      const parsed = JSON.parse(raw);
      if(parsed.currentTab) currentTab = parsed.currentTab;
      if(parsed.ui) ui = Object.assign(ui, parsed.ui);
    }
  }catch(e){ /* nimic salvat încă, pornim cu valorile implicite */ }
  // data la Absențe se actualizează mereu la ziua curentă la o deschidere nouă a aplicației,
  // indiferent pe ce dată ai rămas ultima oară
  ui.absenteData = todayISO();
}
function saveUIState(){

}
// aduce datele mai vechi la formatele noi (probe cu o singură clasă -> listă de clase; tip de notare implicit; note cu moment implicit)
function migreazaDate(){
  (state.probe || []).forEach(p=>{
    if(!p.claseIds){
      p.claseIds = p.claseId ? [p.claseId] : ['all'];
    }
    if(!p.tipNotare) p.tipNotare = 'nota';
  });
  (state.elevi || []).forEach(e=>{
    if(e.inaltime===undefined) e.inaltime = null;
    if(e.greutate===undefined) e.greutate = null;
    // scutire veche (doar boolean + motiv) -> se consideră "totală anuală" implicit
    if(e.scutit && !e.scutireTip) e.scutireTip = 'totala_anuala';
    if(e.scutireTip===undefined) e.scutireTip = null;
    if(e.situatie===undefined) e.situatie = null;
    if(e.scutireSubTip===undefined) e.scutireSubTip = null;
    if(e.scutireStart===undefined) e.scutireStart = null;
    if(e.scutireEnd===undefined) e.scutireEnd = null;
    if(!Array.isArray(e.istoricScutiri)) e.istoricScutiri = []; // scutirile anterioare ale elevului (nu se șterg)
    if(e.dataNasterii===undefined) e.dataNasterii = null;
    if(e.ces===undefined) e.ces = false;
    if(e.cesDetalii===undefined) e.cesDetalii = '';
    if(!e.codUnic) e.codUnic = genereazaCodElev();
    // numele elevilor se afișează mereu cu majuscule — trecem automat și numele mai vechi
    if(e.nume) e.nume = capitalizeazaNume(e.nume);
    if(e.prenume) e.prenume = capitalizeazaNume(e.prenume);
  });
  (state.note || []).forEach(n=>{
    if(!n.moment) n.moment = 'initial';
  });
  (state.clase || []).forEach(c=>{
    if(!c.practica) c.practica = [];
    if(c.arhivata===undefined) c.arhivata = false;
    if(!c.anScolar) c.anScolar = state.settings.anScolar;
  });
  (state.bareme || []).forEach(b=>{
    if(!b.categorie) b.categorie = 'Altele';
  });
  if(!state.settings.anScolar) state.settings.anScolar = '2026-2027';
  // o singură dată (cererea lui Daniel, 23.10.2026): clasele X D și XI I nu mai are ore la ele.
  // Se ARHIVEAZĂ (datele rămân, se pot restaura din „Arhivă”) și se scot din orar.
  if(!state.settings.arhivatXD_XI_I){
    const tinta = c => /^\s*X\s*[-.]?\s*D\s*$/i.test(c.nume||'') || /^\s*XI\s*[-.\s]\s*I\s*$/i.test(c.nume||'');
    const ids = (state.clase||[]).filter(tinta).map(c=>c.id);
    (state.clase||[]).forEach(c=>{ if(ids.includes(c.id)) c.arhivata = true; });
    if(state.orar) state.orar = state.orar.filter(o=>!ids.includes(o.claseId));
    state.settings.arhivatXD_XI_I = true;
  }
  if(!state.settings.urmatorulCodElev) state.settings.urmatorulCodElev = 1;
  if(!state.observatiiCustom) state.observatiiCustom = [];
  if(!state.orar) state.orar = [];
  // „Motivat” a fost scos ca distincție separată — orice absență veche (motivată sau nu) devine „absent”,
  // cu punctaj uniform; observațiile scrise rămân neatinse, ca istoric
  (state.absente||[]).forEach(a=>{
    if(a.stare==='motivat' || a.stare==='nemotivat') a.stare = 'absent';
  });
  if(!state.planificari) state.planificari = [];
  // migrare: intrările vechi erau legate de an, nu de clasă — le păstrăm needitate, dar de-acum tabul Planificare scrie direct cu claseId
  if(!state.settings.taburiAscunse) state.settings.taburiAscunse = [];
  if(state.settings.ultimulExport===undefined) state.settings.ultimulExport = null;
  if(!state.module) state.module = [];
  if(!state.noteCurente) state.noteCurente = [];
  if(!state.echipe) state.echipe = [];
  if(!state.meciuriEchipe) state.meciuriEchipe = [];
  if(!state.sporturiEchipe || !state.sporturiEchipe.length) state.sporturiEchipe = ['Fotbal','Futsal','Handbal','Baschet','Volei','Atletism','Tenis de masă'];
  if(state.settings.echipeLimite===undefined) state.settings.echipeLimite = {U16:null, U18:null};
  if(state.settings.scoalaTabel===undefined) state.settings.scoalaTabel = 'Liceul Tehnologic „Al. Vlahuță” Șendriceni';
  if(state.settings.profesorTabel===undefined) state.settings.profesorTabel = 'Daniel Botezatu';
  if(!state.notareFinalizata) state.notareFinalizata = [];
  if(!state.pppPonderi) state.pppPonderi = { performanta: 40, progres: 25, tehnica: 35, participare: 20, participareActiva: false };
  if(state.pppPonderi.tehnica===undefined) state.pppPonderi.tehnica = 35;
  if(state.pppPonderi.participareActiva===undefined) state.pppPonderi.participareActiva = false;
  if(!state.tehnicaExecutie) state.tehnicaExecutie = [];
  if(state.pppAfisareCatalog===undefined) state.pppAfisareCatalog = true;
  if(state.puncteAbsentaGoala===undefined || state.puncteAbsentaGoala===null) state.puncteAbsentaGoala = 2;
  if(!state.puncteObservatii) state.puncteObservatii = {};
  // punctaje implicite pentru cele 5 observații predefinite — se completează doar dacă lipsesc,
  // ca să nu suprascrie o valoare pe care profesorul a modificat-o deja
  const impliciteObs = {
    'A întârziat la oră': 0.5,
    'Nu s-a prezentat la oră în echipament sportiv': 1,
    'Nu participă la ore din motive medicale': 0,
    'Refuză participarea la oră': 3,
    'Nu respectă sarcinile date de profesor': 3,
  };
  Object.keys(impliciteObs).forEach(k=>{
    if(state.puncteObservatii[k]===undefined) state.puncteObservatii[k] = impliciteObs[k];
  });
  (state.observatiiCustom || []).forEach(o=>{
    if(state.puncteObservatii[o]===undefined) state.puncteObservatii[o] = 1;
  });
}
// modulul (din cele 5 perioade ale anului) în care cade o dată — folosit pentru Participarea activă (PPP)
function moduleDupaData(data){
  if(!data) return null;
  return state.module.find(m=>data>=m.start && data<=m.end) || null;
}
// nota de Participare activă (0-10) a unui elev, pentru modulul respectiv:
// pleacă de la 10 și scade punctele fiecărei observații înregistrate în acel interval
// sub numele elevului în PPT: absența din ziua probei + absențele din modulul probei
function absentePPTHTML(e, probaId){
  const pr = state.probe.find(x=>x.id===probaId);
  if(!pr) return '';
  const modul = state.module.find(m=>pr.data>=m.start && pr.data<=m.end) || null;
  const absente = state.absente.filter(a=>a.eleviId===e.id && a.stare==='absent').map(a=>a.data).sort();
  const inProba = absente.includes(pr.data);
  const inModul = modul ? absente.filter(d=>d>=modul.start && d<=modul.end) : [];
  const fmt = d=>formatDataRo(d).slice(0,5);
  let out = '';
  const azi = todayISO();
  if(absente.includes(azi) && azi!==pr.data) out += `<div style="font-size:12px; font-weight:700; color:var(--danger); margin-top:2px;">● Absent azi (${formatDataRo(azi)})</div>`;
  if(inProba) out += `<div style="font-size:12px; font-weight:700; color:var(--danger); margin-top:2px;">● Absent în ziua probei (${formatDataRo(pr.data)})</div>`;
  if(inModul.length) out += `<div style="font-size:12px; color:var(--muted); margin-top:1px;">Absențe în ${escapeHtml(modul.nume)}: <b>${inModul.length}</b> (${inModul.map(fmt).join(', ')})</div>`;
  return out;
}
function calculeazaParticipare(eleviId, modul){
  if(!modul) return null;
  const inregistrari = state.absente.filter(a=>a.eleviId===eleviId && a.data>=modul.start && a.data<=modul.end);
  let puncteScazute = 0;
  inregistrari.forEach(a=>{
    if(a.stare==='absent'){
      // absența costă mereu punctajul fix — observația (dacă a mai rămas una veche) nu se mai aplică la absență
      puncteScazute += state.puncteAbsentaGoala;
    } else if(a.nota && a.nota.trim() && state.puncteObservatii[a.nota]!==undefined){
      // observația contează doar la elevul prezent
      puncteScazute += state.puncteObservatii[a.nota];
    }
  });
  return Math.max(0, 10 - puncteScazute);
}
// calculul complet PPP pentru un elev, la o probă: Performanță 50% + Progres 30% + Participare 20%
// rotunjire pentru catalog: de la ,50 în sus se urcă (9,50 → 10; 9,49 → 9); se pornește de la valoarea afișată (2 zecimale)
function notaPentruCatalog(nota){
  return Math.floor(nota + 0.5 + 1e-9);
}
function gasesteTehnica(eleviId, probaId){
  return state.tehnicaExecutie.find(t=>t.eleviId===eleviId && t.probaId===probaId) || null;
}
function calculeazaPPP(eleviId, probaId){
  const recInitial = state.note.find(n=>n.eleviId===eleviId && n.probaId===probaId && n.moment==='initial');
  const recFinal = state.note.find(n=>n.eleviId===eleviId && n.probaId===probaId && n.moment==='final');
  const notaRec = (rec)=>{
    if(!rec) return null;
    if(rec.notaCalculata!=null) return rec.notaCalculata;
    const v = parseFloat(String(rec.valoare).replace(',','.'));
    return (!isNaN(v) && v>=1 && v<=10) ? v : null;
  };
  const nInitial = notaRec(recInitial);
  const nFinal = notaRec(recFinal);
  const performanta = nFinal!=null ? nFinal : nInitial; // cea mai recentă disponibilă
  if(performanta==null) return null; // nu are nicio notă la această probă
  const progres = (nFinal!=null && nInitial!=null && nFinal>nInitial) ? 10 : performanta;
  const recPentruModul = recFinal || recInitial;
  const modul = moduleDupaData(recPentruModul.data);
  const participare = modul ? calculeazaParticipare(eleviId, modul) : null;
  const tehnicaRec = gasesteTehnica(eleviId, probaId);
  const tehnica = tehnicaRec ? tehnicaRec.valoare : null;
  const p = state.pppPonderi;
  if(tehnica==null) return { performanta, progres, participare, tehnica: null, modul, notaFinala: null }; // lipsește tehnica -> nu putem calcula nota finală
  let notaFinala = performanta*(p.performanta/100) + progres*(p.progres/100) + tehnica*(p.tehnica/100);
  if(p.participareActiva) notaFinala += (participare!=null ? participare : performanta)*(p.participare/100);
  return { performanta, progres, participare, tehnica, modul, notaFinala: Math.round(notaFinala*100)/100 };
}
// generează un cod unic secvențial pentru un elev nou, legat de anul școlar curent (ex: EFS2026-001)

  const nr = state.settings.urmatorulCodElev || 1;

  return `EFS${anStart}-${String(nr).padStart(3,'0')}`;
}

// scutirea e activă azi? (o scutire temporară expiră automat singură, elevul redevine apt)
function esteScutitActiv(e){
  if(!e.scutit || !e.scutireTip) return false;
  if(e.scutireTip==='temporara'){
    if(!e.scutireStart || !e.scutireEnd) return true;
    const azi = todayISO();
    return azi>=e.scutireStart && azi<=e.scutireEnd;
  }
  return true; // totală anuală sau parțială -> activă până e anulată manual
}
// scutirea PARȚIALĂ (permanentă sau temporară) nu blochează notarea — elevul poate fi notat
// la probele pe care profesorul consideră că le poate efectua. Doar scutirea TOTALĂ blochează.
function blocheazaNotarea(e){
  if(esteInactiv(e)) return true;
  if(!esteScutitActiv(e)) return false;
  if(e.scutireTip==='partiala') return false;
  if(e.scutireTip==='temporara' && e.scutireSubTip==='partiala') return false;
  return true;
}
function scutirePartialaActiva(e){
  return esteScutitActiv(e) && !blocheazaNotarea(e);
}

function cesTagHTML(e){

function scutirePillHTML(e){
  if(!e.scutit || !e.scutireTip) return '—';
  const activa = esteScutitActiv(e);
  if(e.scutireTip==='totala_anuala'){
    return activa ? '<span class="pill pill-danger">Scutit — Totală anuală</span>' : '—';
  }
  if(e.scutireTip==='partiala'){
    return activa ? '<span class="pill pill-blue">Scutit — Parțială</span>' : '—';
  }
  if(e.scutireTip==='temporara'){
    const fel = e.scutireSubTip==='partiala' ? 'parțială' : 'totală';
    if(activa){
      return `<span class="pill pill-yellow">Scutit — Temporară (${fel}), ${formatDataRo(e.scutireStart)}–${formatDataRo(e.scutireEnd)}</span>`;
    }
    return `<span class="pill pill-ghost">Temporară expirată (${formatDataRo(e.scutireStart)}–${formatDataRo(e.scutireEnd)}) — apt</span>`;
  }
  return '—';
}

/* ---------------- EXPORT / IMPORT (sincronizare manuală între dispozitive) ---------------- */
// întoarce 'share' dacă s-a folosit meniul de distribuire, 'download' dacă a mers pe descărcarea clasică,
// sau 'cancel' dacă persoana a închis meniul de distribuire fără să aleagă nimic
async function exportBackup(){
  const stamp = todayISO();
  const filename = `catalog-efs-backup-${stamp}.json`;
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});

  // pe tabletă/telefon: încercăm să deschidem meniul de distribuire (ca la o poză pe WhatsApp),
  // ca să poți alege direct Google Drive, într-un singur tap
  try{
    const file = new File([blob], filename, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Backup Catalog EFS'});
      return 'share';
    }
  }catch(e){
    // dacă persoana anulează meniul de distribuire (apasă înapoi), nu mai descărcăm și fișierul
    // clasic, ca să nu pară că s-a întâmplat de două ori
    if(e && e.name === 'AbortError') return 'cancel';
    // orice altă eroare -> trecem la descărcarea clasică, mai jos
  }

  // pe laptop, sau dacă distribuirea nu e disponibilă: descărcarea clasică, în Descărcări
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  return 'download';
}

const NUME_FICTIVE = ['Popa','Ionescu','Dumitru','Stan','Rusu','Marin','Toma','Preda','Lungu','Barbu','Munteanu','Constantin','Stoica','Matei','Dinu','Florea','Cristea','Radu','Sima','Voicu','Ene','Tudor','Nistor','Pavel','Iacob','Moldovan','Ilie','Vasile','Lazar','Ungureanu','Crețu','Mocanu','Neagu','Oprea','Serban','Zamfir','Badea','Cojocaru','Diaconu','Grigore'];

function anonimizeazaStare(sursa){
  const st = JSON.parse(JSON.stringify(sursa));
  const nrN = NUME_FICTIVE.length;
  const harta = {};                       // nume real -> nume fictiv (pentru textele libere)
  const folosite = new Set();
  (st.elevi||[]).forEach((e,i)=>{
    const nr = i;
    let nume = NUME_FICTIVE[(nr*7+3) % nrN], pren;
    const lista = e.sex==='F' ? PRENUME_F : PRENUME_M;
    pren = lista[(nr*3+1) % lista.length];
    let k = 0; while(folosite.has(nume+' '+pren)){ k++; pren = lista[(nr*3+1+k) % lista.length]; }
    folosite.add(nume+' '+pren);
    [e.nume, e.prenume].forEach((t,j)=>{ String(t||'').split(/[\s-]+/).filter(x=>x.length>2).forEach(x=>{ harta[x.toLowerCase()] = j===0 ? nume : pren; }); });
    e.nume = nume.toUpperCase(); e.prenume = pren.toUpperCase();
    if(e.codUnic) e.codUnic = 'EFS2026-'+String(100+nr);
    if(e.dataNasterii && /^\d{4}-\d{2}-\d{2}$/.test(e.dataNasterii)){          // păstrăm anul (pentru U16/U18), schimbăm ziua și luna
      const a = e.dataNasterii.slice(0,4), m = ((+e.dataNasterii.slice(5,7)+nr*5) % 12)+1, z = ((+e.dataNasterii.slice(8,10)+nr*7) % 28)+1;
      e.dataNasterii = `${a}-${String(m).padStart(2,'0')}-${String(z).padStart(2,'0')}`;
    }
    if(e.motivScutire) e.motivScutire = 'motiv medical';
    if(e.cesDetalii) e.cesDetalii = 'detalii CES';
    if(e.situatieNota) e.situatieNota = 'la altă școală';
  });
  const curata = t => {
    let x = String(t||'');
    Object.keys(harta).forEach(k=>{ x = x.replace(new RegExp('(^|[^\\p{L}])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}])','giu'), (m0,p1)=>p1+harta[k]); });
    return x;
  };
  (st.noteCurente||[]).forEach(n=>{ n.motiv = curata(n.motiv); n.detalii = curata(n.detalii); n.obs = curata(n.obs); });
  (st.absente||[]).forEach(a=>{ if(a.nota) a.nota = curata(a.nota); });
  (st.echipe||[]).forEach(m=>{ m.obs = curata(m.obs); if(m.pozitie) m.pozitie = curata(m.pozitie); });
  (st.meciuriEchipe||[]).forEach(m=>{ m.eveniment = curata(m.eveniment); m.rezultat = curata(m.rezultat); m.obs = curata(m.obs); });
  if(st.observatiiCustom) st.observatiiCustom = st.observatiiCustom.map(curata);
  // clase: nume fictive (an + literă), școala fictivă
  const perAn = {};
  (st.clase||[]).forEach(c=>{ const i = perAn[c.an] = (perAn[c.an]||0)+1; c.nume = `${c.an} ${'ABCDEFGH'[(i-1)%8]}`; });
  st.settings = st.settings || {};
  st.settings.scoalaTabel = 'Liceul Tehnologic „Exemplu”';
  st.settings.titlu = 'Catalog EFS';
  st.settings.anonimizat = true;
  return st;
}
async function exportAnonimizat(){
  const copie = anonimizeazaStare(state);
  const filename = `catalog-efs-anonimizat-${todayISO()}.json`;
  const blob = new Blob([JSON.stringify(copie, null, 2)], {type:'application/json'});
  try{
    const file = new File([blob], filename, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Catalog EFS — export anonimizat'}); return 'share'; }
  }catch(e){ if(e && e.name === 'AbortError') return 'cancel'; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  return 'download';
}
function importBackupFile(file, onDone){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('format invalid');
      if(parsed.settings && parsed.settings.anonimizat && !confirm('Fișierul acesta conține date INVENTATE (export anonimizat pentru carte). Dacă îl imporți, datele reale de pe acest dispozitiv se înlocuiesc și, cu sincronizarea pornită, se înlocuiesc și în cont. Sigur continui?')){ onDone(null); return; }
      state = Object.assign({settings:{titlu:'Catalogul meu EFS'}, clase:[], elevi:[], probe:[], note:[], absente:[], bareme:[], observatiiCustom:[]}, parsed);
      migreazaDate();
      saveState();
      onDone(true);
    }catch(e){
      onDone(false);
    }
  };
  reader.onerror = () => onDone(false);
  reader.readAsText(file);
}

function dataNastereAfisare(iso){ if(!iso) return ''; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso); return m?`${m[3]}.${m[2]}.${m[1]}`:''; }
function formateazaCifreData(v){
  const c=String(v).replace(/\D/g,'').slice(0,8);
  if(c.length<=2) return c;
  if(c.length<=4) return c.slice(0,2)+'.'+c.slice(2);
  return c.slice(0,2)+'.'+c.slice(2,4)+'.'+c.slice(4);
}
function parseazaDataNastere(v){
  const t=String(v).trim(); if(!t) return {gol:true};
  let z,l,a;
  const sep=/^(\d{1,2})[.\/\-\s](\d{1,2})[.\/\-\s](\d{2}|\d{4})$/.exec(t);
  if(sep){ z=+sep[1]; l=+sep[2]; a=sep[3]; }
  else { const c=t.replace(/\D/g,''); if(c.length===8){ z=+c.slice(0,2); l=+c.slice(2,4); a=c.slice(4); } else if(c.length===6){ z=+c.slice(0,2); l=+c.slice(2,4); a=c.slice(4); } else return {eroare:true}; }
  if(a.length===2){ const n=+a; a=String(n<=30?2000+n:1900+n); }
  a=+a;
  const d=new Date(a,l-1,z);
  if(!(a>=1990 && a<=2030) || d.getFullYear()!==a || d.getMonth()!==l-1 || d.getDate()!==z) return {eroare:true};
  return {iso:`${a}-${String(l).padStart(2,'0')}-${String(z).padStart(2,'0')}`};
}

}

const PROGRAM_ORE_IMPLICIT = [['07:40','08:30'],['08:35','09:25'],['09:30','10:20'],['10:30','11:20'],['11:25','12:15'],['12:20','13:10'],['13:15','14:05']];
function programOre(){

function minuteDinOra(hhmm){ const [h,m] = String(hhmm).split(':').map(Number); return h*60+(m||0); }
// unde suntem acum: {zi, ora, inOra:true/false (false = pauză), interval:[a,b]} sau null în afara orelor
function oraCurenta(){
  const d = new Date();
  const zi = ziDinData(todayISO());
  const min = d.getHours()*60 + d.getMinutes();
  const prog = programOre();
  for(let i=0;i<prog.length;i++){
    const a = minuteDinOra(prog[i][0]), b = minuteDinOra(prog[i][1]);
    if(min>=a && min<=b) return {zi, ora:i+1, inOra:true, interval:prog[i]};
    if(min<a) return {zi, ora:i+1, inOra:false, interval:prog[i]}; // pauză sau înainte de prima oră: urmează ora i+1
  }
  return {zi, ora:null, inOra:false, interval:null}; // după ultima oră
}

    <p class="tab-desc" style="margin-top:0;">Cifrele arată elevii notați din totalul celor care pot fi notați. Apasă pe o celulă ca să marchezi clasa ca <b>notată</b> la proba respectivă (devine verde cu ✔) sau ca să renunți la bifă.</p>
    <div class="legenda-stare"><span class="stare-cell stare-zero">nenotat</span><span class="stare-cell stare-partial">în curs</span><span class="stare-cell stare-aproape">toți notați</span><span class="stare-cell stare-fin">✔ bifat notată</span></div>` +
  module.map(m=>{
    const probe = state.probe.filter(pr=>pr.data>=m.start && pr.data<=m.end).sort((a,b)=>a.data.localeCompare(b.data));
    const clase = claseActive();
    const esteCurent = azi>=m.start && azi<=m.end;
    let corp;
    if(!probe.length) corp = '<div style="color:var(--muted); font-size:14px;">Nicio probă cu data în acest modul.</div>';
    else if(!clase.length) corp = '<div style="color:var(--muted); font-size:14px;">Nicio clasă.</div>';
    else{
      corp = `<div style="overflow-x:auto;"><table>
        <thead><tr><th>Clasă</th>${probe.map(pr=>`<th title="${formatDataRo(pr.data)}">${escapeHtml(pr.nume)}</th>`).join('')}<th>Gata</th></tr></thead>
        <tbody>${clase.map(c=>{
          let aplicabile = 0, gata = 0;
          const celule = probe.map(pr=>{
            if(!probaSeAplicaClasei(pr, c.id)) return '<td class="stare-cell stare-na">—</td>';
            aplicabile++;
            if(statusProba(c.id, pr.id).fin) gata++;
            return celulaStareNotareHTML(c.id, pr.id);
          }).join('');
          return `<tr><td><strong>${escapeHtml(c.nume)}</strong></td>${celule}<td>${aplicabile?`${gata}/${aplicabile}`:'—'}</td></tr>`;
        }).join('')}</tbody></table></div>`;
    }
    return `<div class="card"${esteCurent?' style="border-left:4px solid var(--track);"':''}>
      <div style="font-weight:700; color:var(--infield); margin-bottom:8px;">${escapeHtml(m.nume)} <span style="font-weight:400; color:var(--muted); font-size:13px;">(${formatDataRo(m.start)} – ${formatDataRo(m.end)})${esteCurent?' · modulul curent':''}</span></div>
      ${corp}
    </div>`;
  }).join('');
}

function verificaSchimbareaZilei(){
  const azi = todayISO();
  if(azi !== ultimaZiCunoscuta){
    // a trecut cel puțin o zi (ex. tableta a rămas deschisă peste noapte) —
    // aducem data din Absențe automat pe ziua nouă
    ultimaZiCunoscuta = azi;
    ui.absenteData = azi;
    ui.curenteData = azi; ui.curenteDetalii = null;
  }
}
// re-randare care păstrează poziția în pagină (pentru schimbări făcute în timpul lucrului)
function renderPastrand(){
  const m=document.getElementById('main'); const t=m?m.scrollTop:0;
  render();
  const m2=document.getElementById('main'); if(m2) m2.scrollTop=t;
}
function render(){
  verificaSchimbareaZilei();
  // dacă tab-ul curent a fost ascuns între timp, trecem pe primul tab vizibil
  if(!tabsVizibile().find(t=>t.id===currentTab)){
    currentTab = tabsVizibile().length ? tabsVizibile()[0].id : 'dashboard';
  }
  const app = document.getElementById('app');
  const _bb = app.querySelector('nav.bottombar');
  const _bbScroll = _bb ? _bb.scrollLeft : 0;
  app.innerHTML = `
    <header>
      <div class="title">
        <h1 id="titlu-app">${escapeHtml(state.settings.titlu)}</h1>
        <span class="subtitle">Educație fizică și sport${autorHTML()}</span>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="date" id="save-indicator" style="min-width:110px; text-align:right;">${ultimaSalvare ? ('Salvat ' + ultimaSalvare.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',second:'2-digit'})) : ''}</span>
        <button class="sync-btn" id="sync-ind" data-sync="info" style="display:none;"></button>
        <button class="btn btn-primary" id="btn-save-now" style="padding:8px 14px; min-height:36px; display:flex; align-items:center; gap:6px;">${ICONS.save} Salvează</button>
        <button class="settings-btn" id="btn-settings" title="Setări">${ICONS.gear}</button>
      </div>
    </header>
    <div class="body-wrap">
      <nav class="sidebar">
        ${tabsVizibile().map(t=>`<button data-tab="${t.id}" class="${currentTab===t.id?'active':''}">${ICONS[t.id]}<span>${t.label}</span></button>`).join('')}
      </nav>
      <main id="main"></main>
    </div>
    <nav class="bottombar">
      ${tabsVizibile().map(t=>`<button data-tab="${t.id}" class="${currentTab===t.id?'active':''}">${ICONS[t.id]}<span>${t.label}</span></button>`).join('')}
    </nav>
  `;
  // bara de jos (telefon): păstrăm poziția derulării și ținem tabul activ în câmpul vizual
  const _nb = app.querySelector('nav.bottombar');
  if(_nb){
    _nb.scrollLeft = _bbScroll;
    const _act = _nb.querySelector('button.active');
    if(_act){
      const st = _act.offsetLeft, en = st + _act.offsetWidth;
      if(st < _nb.scrollLeft) _nb.scrollLeft = st - 8;
      else if(en > _nb.scrollLeft + _nb.clientWidth) _nb.scrollLeft = en - _nb.clientWidth + 8;
    }
  }
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.addEventListener('click', ()=>{ currentTab = b.dataset.tab; ui.aziFisa = null; if(currentTab==='curente'){ ui.curenteData = todayISO(); ui.curenteDetalii = null; } render(); });
  });
  if(typeof actualizeazaSyncBtn==='function') actualizeazaSyncBtn();
  document.getElementById('btn-settings').addEventListener('click', openSettingsModal);
  document.getElementById('btn-save-now').addEventListener('click', ()=>{
    const ok = saveStateNow();
    updateSaveIndicator();
    showToast(ok ? 'Salvat ✓' : 'Nu am putut salva.');
  });
  renderTab();
  aplicaOraCurenta();
  saveUIState();
}

/* ================= TAB: ARHIVĂ ================= */
function renderArhiva(main){
  const arhivate = state.clase.filter(c=>c.arhivata);
  main.innerHTML = `
    <h2>Arhivă</h2>
    <p class="tab-desc">Clasele arhivate nu mai apar în selectoare, dar datele lor (elevi, note, absențe) rămân intacte — le poți restaura oricând.</p>
    ${arhivate.length===0 ? emptyState('Nicio clasă arhivată.', 'Arhivezi o clasă din tabul „Clase”, cu butonul 📦 Arhivează.') : `
    <div class="class-grid">
      ${arhivate.map(c=>{
        const nr = eleviDinClasa(c.id).length;
        return `<div class="class-card">
          <h3>${escapeHtml(c.nume)}</h3>
          <div class="count">${nr} elev${nr===1?'':'i'} · an școlar ${escapeHtml(c.anScolar||'—')}</div>
          <div class="actions">
            <button class="btn btn-secondary" data-restaureaza="${c.id}">↩ Restaurează</button>
            <button class="btn btn-danger" data-del-arhivata="${c.id}">${ICONS.trash} Șterge definitiv</button>
          </div>
        </div>`;
      }).join('')}
    </div>`}
  `;
  main.querySelectorAll('[data-restaureaza]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const c = state.clase.find(c=>c.id===b.dataset.restaureaza);
      c.arhivata = false;
      saveState(); render(); showToast('Clasă restaurată.');
    });
  });
  main.querySelectorAll('[data-del-arhivata]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.delArhivata;
      const c = state.clase.find(c=>c.id===id);
      if(!confirm(`Ștergi definitiv clasa „${c.nume}” și tot ce ține de ea (elevi, note, absențe)? Nu se poate anula.`)) return;
      const eleviIds = state.elevi.filter(e=>e.claseId===id).map(e=>e.id);
      state.clase = state.clase.filter(c=>c.id!==id);
      state.elevi = state.elevi.filter(e=>e.claseId!==id);
      state.probe.forEach(p=>{ p.claseIds = (p.claseIds||[]).filter(cid=>cid!==id); });
      state.note = state.note.filter(n=>!eleviIds.includes(n.eleviId));
      state.noteCurente = (state.noteCurente||[]).filter(n=>!eleviIds.includes(n.eleviId));
      state.echipe = (state.echipe||[]).filter(m=>!eleviIds.includes(m.eleviId));
      state.absente = state.absente.filter(a=>!eleviIds.includes(a.eleviId));
      saveState(); render(); showToast('Clasă ștearsă definitiv.');
    });
  });
}

/* ================= TAB: DASHBOARD ================= */
function renderDashboard(main){
  const totalElevi = state.elevi.length;
  const totalClase = claseActive().length;
  const totalNote = state.note.length;
  const noteNumerice = state.note.map(n=>{
    if(n.notaCalculata!=null) return n.notaCalculata;
    const v = parseFloat(String(n.valoare).replace(',','.'));
    return (!isNaN(v) && v>=1 && v<=10) ? v : null;
  }).filter(v=>v!=null);
  const mediaGenerala = noteNumerice.length ? (noteNumerice.reduce((a,b)=>a+b,0)/noteNumerice.length).toFixed(2) : '0.0';
  const totalAbsente = state.absente.filter(a=>a.stare!=='prezent').length;
  const totalScutiti = state.elevi.filter(e=>esteScutitActiv(e)).length;

  function card(titlu, valoare, sub, culoare){
    return `<div class="class-card" style="border-top-color:${culoare};">
      <div style="font-size:13px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.03em;">${titlu}</div>
      <div class="display" style="font-size:34px; margin:8px 0 4px; color:var(--infield);">${valoare}</div>
      <div style="font-size:12px; color:var(--muted);">${sub}</div>
    </div>`;
  }

  main.innerHTML = `
    <h2>Dashboard</h2>
    <p class="tab-desc">O privire de ansamblu peste tot catalogul — toate clasele active, an școlar ${escapeHtml(state.settings.anScolar)}.</p>
    <div class="class-grid">
      ${card('Total elevi', totalElevi, 'Elevi înregistrați', 'var(--infield)')}
      ${card('Total clase', totalClase, 'Clase active', '#3D7A4E')}
      ${card('Total note', totalNote, 'Note introduse', 'var(--track)')}
      ${card('Medie generală', mediaGenerala, 'Media tuturor notelor', '#1D5A9E')}
      ${card('Total absențe', totalAbsente, 'Absențe înregistrate', 'var(--danger)')}
      ${card('Elevi scutiți', totalScutiti, 'Scutire medicală activă acum', '#1D5A9E')}
    </div>
    <div class="row" style="margin-top:18px;">
      <button class="btn btn-secondary" id="btn-excel-tot-catalogul">📊 Excel — tot catalogul</button>
    </div>
  `;
  document.getElementById('btn-excel-tot-catalogul').addEventListener('click', genereazaRaportExcelGeneral);
}

    <p class="tab-desc">Împarte anul școlar pe module (ex: 5 module a ~7 săptămâni). Aplicația folosește aceste perioade ca să știe ce notă de Participare activă (PPT) se aplică unei probe, în funcție de data ei.</p>
    <div class="card">
      <div class="row">
        <div class="field" style="flex:1; min-width:160px;">
          <label>Nume modul</label>
          <input type="text" id="input-modul-nume" placeholder="ex: Modulul 1"/>
        </div>
        <div class="field">
          <label>De la</label>
          <input type="date" id="input-modul-start" value="${todayISO()}"/>
        </div>
        <div class="field">
          <label>Până la</label>
          <input type="date" id="input-modul-end" value="${todayISO()}"/>
        </div>
        <button class="btn btn-primary" id="btn-add-modul">+ Adaugă modul</button>
      </div>
    </div>
    ${module.length===0 ? emptyState('Niciun modul definit.', 'Adaugă cele 5 module ale anului școlar mai sus.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Modul</th><th>De la</th><th>Până la</th><th>Stare</th><th></th></tr></thead>
        <tbody>
          ${module.map(m=>{
            let stare;
            if(azi<m.start) stare = '<span class="pill pill-blue">urmează</span>';
            else if(azi>m.end) stare = '<span class="pill pill-ghost">încheiat</span>';
            else stare = '<span class="pill pill-yellow">activ acum</span>';
            return `<tr>
              <td class="student-name">${escapeHtml(m.nume)}</td>
              <td>${formatDataRo(m.start)}</td>
              <td>${formatDataRo(m.end)}</td>
              <td>${stare}</td>
              <td><button class="btn btn-danger" data-del-modul="${m.id}">${ICONS.trash}</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`}
  `;
  document.getElementById('btn-add-modul').addEventListener('click', ()=>{
    const nume = document.getElementById('input-modul-nume').value.trim();
    const start = document.getElementById('input-modul-start').value;
    const end = document.getElementById('input-modul-end').value;
    if(!nume) return showToast('Scrie numele modulului.');
    if(!start || !end) return showToast('Completează ambele date.');
    if(end<start) return showToast('Data „până la” nu poate fi înainte de „de la”.');
    state.module.push({id:uid(), nume, start, end});
    saveState(); render(); showToast('Modul adăugat.');
  });
  main.insertAdjacentHTML('beforeend', stareNotarePeModuleHTML());
  main.querySelectorAll('[data-del-modul]').forEach(b=>{
    b.addEventListener('click', ()=>{
      if(!confirm('Ștergi acest modul?')) return;
      state.module = state.module.filter(m=>m.id!==b.dataset.delModul);
      saveState(); render(); showToast('Modul șters.');
    });
  });
}

            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    `}
  `;
  document.getElementById('select-ppp-clasa').addEventListener('change', e=>{ ui.clasaCurenta = e.target.value; ui.pppProba = null; render(); });
  const selProba = document.getElementById('select-ppp-proba');
  if(selProba) selProba.addEventListener('change', e=>{ ui.pppProba = e.target.value; render(); });

  document.getElementById('chk-participare-activa').addEventListener('change', (e)=>{
    document.getElementById('input-pondere-participare').disabled = !e.target.checked;
    actualizeazaSumaInfo();
  });

  document.getElementById('chk-afisare-catalog').addEventListener('change', (e)=>{
    state.pppAfisareCatalog = e.target.checked; saveState(); render();
  });

  function actualizeazaSumaInfo(){
    const activaParticiparea = document.getElementById('chk-participare-activa').checked;
    const s = (parseFloat(document.getElementById('input-pondere-performanta').value)||0)
            + (parseFloat(document.getElementById('input-pondere-progres').value)||0)
            + (parseFloat(document.getElementById('input-pondere-tehnica').value)||0)
            + (activaParticiparea ? (parseFloat(document.getElementById('input-pondere-participare').value)||0) : 0);
    const info = document.getElementById('suma-ponderi-info');
    info.textContent = `Total: ${s}%`;
    info.style.color = s===100 ? 'var(--ok)' : 'var(--danger)';
  }
  ['input-pondere-performanta','input-pondere-progres','input-pondere-tehnica','input-pondere-participare'].forEach(id=>{
    document.getElementById(id).addEventListener('input', actualizeazaSumaInfo);
  });
  actualizeazaSumaInfo();
  document.getElementById('btn-salveaza-ponderi').addEventListener('click', ()=>{
    const perf = parseFloat(document.getElementById('input-pondere-performanta').value)||0;
    const prog = parseFloat(document.getElementById('input-pondere-progres').value)||0;
    const tehn = parseFloat(document.getElementById('input-pondere-tehnica').value)||0;
    const part = parseFloat(document.getElementById('input-pondere-participare').value)||0;
    const participareActiva = document.getElementById('chk-participare-activa').checked;
    const suma = perf+prog+tehn+(participareActiva?part:0);
    if(suma!==100) return showToast('Procentele componentelor active trebuie să însumeze 100%.');
    state.pppPonderi = { performanta:perf, progres:prog, tehnica:tehn, participare:part, participareActiva };
    saveState(); render(); showToast('Procente salvate.');
  });

  main.querySelectorAll('.input-tehnica').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const eleviId = inp.dataset.elev;
      const val = inp.value.trim();
      let rec = state.tehnicaExecutie.find(t=>t.eleviId===eleviId && t.probaId===ui.pppProba);
      if(val===''){
        if(rec) state.tehnicaExecutie = state.tehnicaExecutie.filter(t=>t!==rec);
      } else {
        const valoare = Math.max(1, Math.min(10, parseFloat(val.replace(',','.'))||1));
        if(rec){ rec.valoare = valoare; } else {
          state.tehnicaExecutie.push({id:uid(), eleviId, probaId:ui.pppProba, valoare});
        }
      }
      saveState(); render();
    });
  });
}

/* ================= TAB: COMBINAT (media mai multor probe într-o singură notă, doar de vizualizare) ================= */
function renderCombinat(main){
  if(claseActive().length===0){
    main.innerHTML = `<h2>Combinat</h2>` + emptyState('Nu ai nicio clasă.', 'Adaugă mai întâi o clasă în tabul „Clase”.');
    return;
  }
  if(!ui.clasaCurenta || !claseActive().find(c=>c.id===ui.clasaCurenta)) ui.clasaCurenta = claseActive()[0].id;
  const moduleClasa = [...state.module].sort((a,b)=>a.start.localeCompare(b.start));
  if(ui.combinatModul && !moduleClasa.find(m=>m.id===ui.combinatModul)) ui.combinatModul = null;

  // probele clasei, eventual filtrate la modulul ales (după data probei)
  const toateProbeleClasei = state.probe.filter(p=>probaSeAplicaClasei(p, ui.clasaCurenta));
  const modulAles = ui.combinatModul ? moduleClasa.find(m=>m.id===ui.combinatModul) : null;
  const probeDisponibile = (modulAles
    ? toateProbeleClasei.filter(p=>p.data>=modulAles.start && p.data<=modulAles.end)
    : toateProbeleClasei
  ).sort((a,b)=>a.data.localeCompare(b.data));

  // dacă s-a schimbat clasa/modulul, scoatem din selecție probele care nu mai sunt disponibile
  ui.combinatProbe = ui.combinatProbe.filter(id=>probeDisponibile.find(p=>p.id===id));
  const lista = eleviDinClasa(ui.clasaCurenta);

  main.innerHTML = `
    <h2>Combinat</h2>
    <p class="tab-desc">Alege două sau mai multe probe din același modul și vezi media lor, pe loc — nu se salvează nicio combinație, e doar o vedere rapidă pentru catalog.</p>
    <div class="row" style="margin-bottom:16px;">
      <div class="field">
        <label>Clasă</label>
        <select id="select-combinat-clasa">
          ${claseActive().map(c=>`<option value="${c.id}" ${c.id===ui.clasaCurenta?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Modul</label>
        <select id="select-combinat-modul">
          <option value="">Toate (fără filtru)</option>
          ${moduleClasa.map(m=>`<option value="${m.id}" ${m.id===ui.combinatModul?'selected':''}>${escapeHtml(m.nume)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Sursa notei</label>
        <select id="select-combinat-sursa">
          <option value="performanta" ${ui.combinatSursa==='performanta'?'selected':''}>Doar Performanța (barem)</option>
          <option value="ppt" ${ui.combinatSursa==='ppt'?'selected':''}>Nota PPT completă</option>
        </select>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:700; color:var(--infield); margin-bottom:8px;">Probe de combinat</div>
      ${probeDisponibile.length===0 ? `<div class="tab-desc" style="margin:0;">Nicio probă disponibilă ${modulAles?'în acest modul':''} pentru această clasă.</div>` : `
      <div style="display:flex; flex-wrap:wrap; gap:6px 16px;">
        ${probeDisponibile.map(p=>`
          <label style="display:flex; align-items:center; gap:7px; font-size:14px; cursor:pointer;">
            <input type="checkbox" class="chk-combinat-proba" value="${p.id}" ${ui.combinatProbe.includes(p.id)?'checked':''} style="width:18px; height:18px;"/>
            ${escapeHtml(p.nume)} <span style="color:var(--muted); font-size:12px;">(${formatDataRo(p.data)})</span>
          </label>
        `).join('')}
      </div>`}
    </div>
    ${ui.combinatProbe.length<2 ? emptyState('Bifează cel puțin două probe.', 'Media apare automat de îndată ce ai două sau mai multe bifate.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Nr.</th><th>Elev</th>${ui.combinatProbe.map(id=>{const p=probeDisponibile.find(pp=>pp.id===id); return `<th>${escapeHtml(p?p.nume:'—')}</th>`;}).join('')}<th>Notă combinată</th></tr></thead>
        <tbody>
          ${lista.map((e,idx)=>{
            if(blocheazaNotarea(e)){
              return `<tr ${esteInactiv(e)?'class="rand-inactiv"':''}><td style="color:var(--muted); text-align:center;">${idx+1}</td><td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${cesTagHTML(e)}${situatieElevHTML(e)}</td><td colspan="${ui.combinatProbe.length+1}">${motivBlocareHTML(e)}</td></tr>`;
            }
            const valori = []; // {nume, valoare}
            const celule = ui.combinatProbe.map(probaId=>{
              const p = probeDisponibile.find(pp=>pp.id===probaId);
              const r = calculeazaPPP(e.id, probaId);
              let v = null;
              if(r){
                if(ui.combinatSursa==='performanta') v = r.performanta;
                else v = r.notaFinala; // null dacă lipsește Tehnica
              }
              const absP = p && state.absente.some(a=>a.eleviId===e.id && a.data===p.data && a.stare==='absent');
              const tagAbs = absP ? `<div style="font-size:11px; font-weight:700; color:var(--danger);">● Absent ${formatDataRo(p.data).slice(0,5)}</div>` : '';
              if(v!=null){ valori.push({nume: p?p.nume:'—', valoare: v}); return v.toFixed(2)+tagAbs; }
              return '<span style="color:var(--muted);">—</span>'+tagAbs;
            });
            let notaCombinataHTML;
            if(valori.length===0){
              notaCombinataHTML = '<span style="color:var(--muted); font-size:12px;">fără notă la nicio probă</span>';
            } else {
              const medie = valori.reduce((a,b)=>a+b.valoare,0)/valori.length;
              const incompleta = valori.length < ui.combinatProbe.length;
              notaCombinataHTML = `<strong class="pill pill-ok" style="font-size:14px;">${medie.toFixed(2)}</strong>`
                + (incompleta ? `<br><span style="font-size:11px; color:var(--muted);">doar din ${valori.map(v=>escapeHtml(v.nume)).join(' + ')}</span>` : '');
            }
            return `<tr>
              <td style="color:var(--muted); text-align:center;">${idx+1}</td>
              <td class="student-name">${escapeHtml(e.nume)} ${escapeHtml(e.prenume)} ${cesTagHTML(e)}${absentAziHTML(e)}</td>
              ${celule.map(c=>`<td>${c}</td>`).join('')}
              <td>${notaCombinataHTML}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    `}
  `;
  document.getElementById('select-combinat-clasa').addEventListener('change', e=>{ ui.clasaCurenta = e.target.value; ui.combinatProbe = []; render(); });
  document.getElementById('select-combinat-modul').addEventListener('change', e=>{ ui.combinatModul = e.target.value || null; render(); });
  document.getElementById('select-combinat-sursa').addEventListener('change', e=>{ ui.combinatSursa = e.target.value; saveState(); render(); });
  main.querySelectorAll('.chk-combinat-proba').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      if(chk.checked){ if(!ui.combinatProbe.includes(chk.value)) ui.combinatProbe.push(chk.value); }
      else { ui.combinatProbe = ui.combinatProbe.filter(id=>id!==chk.value); }
      saveState(); render();
    });
  });
}

/* ================= TAB: ORAR (fix, pe toată anul — zi + oră + clasă) ================= */
function renderOrar(main){
  const prog = programOre();
  const maxOra = Math.max(prog.length, ...state.orar.map(o=>o.ora||0));
  const ore = Array.from({length:maxOra}, (_,i)=>i+1);
  const optiuniClase = (selId)=>{
    const lista = claseActive();
    const extra = (selId && !lista.find(c=>c.id===selId)) ? state.clase.find(c=>c.id===selId) : null;
    const toate = extra ? [...lista, extra] : lista;
    return `<option value="">—</option>` + toate.map(c=>`<option value="${c.id}" ${c.id===selId?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')
      + ((selId && !state.clase.find(c=>c.id===selId)) ? `<option value="${selId}" selected>(clasă ștearsă)</option>` : '');
  };
  main.innerHTML = `
    <h2>Orar</h2>
    <p class="tab-desc">Orarul tău fix, pe tot anul. Alege clasa în fiecare celulă; ora în care ești acum se colorează automat. Îl folosește și tabul „Azi”.</p>
    ${claseActive().length===0 ? emptyState('Nicio clasă adăugată.', 'Adaugă clase în tabul „Clase”, apoi completează orarul.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="orar-grid">
        <thead><tr><th class="ora-col">Ora</th>${ZILE.map(z=>`<th data-orar-zi-th="${z}">${ZILE_NUME[z]}</th>`).join('')}</tr></thead>
        <tbody>
          ${ore.map(n=>`<tr>
            <th class="ora-col" data-orar-ora-th="${n}">${n}${prog[n-1]?`<small>${prog[n-1][0]}–${prog[n-1][1]}</small>`:''}</th>
            ${ZILE.map(z=>{
              const o = state.orar.find(x=>x.zi===z && x.ora===n);
              return `<td data-orar-cell data-zi="${z}" data-ora="${n}"><select class="orar-select" data-zi="${z}" data-ora="${n}">${optiuniClase(o?o.claseId:null)}</select></td>`;
            }).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`}
    <details class="card" style="margin-top:12px;">
      <summary style="cursor:pointer; font-weight:700; color:var(--infield);">Programul orelor (intervale)</summary>
      <p class="tab-desc" style="margin-top:8px;">Intervalele sunt cele din orarul școlii 2026-2027. Le poți modifica dacă se schimbă.</p>
      <div style="display:grid; grid-template-columns:auto 1fr 1fr; gap:6px 8px; align-items:center; max-width:360px;">
        ${prog.map((iv,i)=>`<span><b>${i+1}</b></span><input type="time" class="input-prog-start" data-i="${i}" value="${iv[0]}"/><input type="time" class="input-prog-end" data-i="${i}" value="${iv[1]}"/>`).join('')}
      </div>
      <div style="margin-top:10px;"><button class="btn btn-secondary" id="btn-salveaza-program">Salvează programul</button></div>
    </details>
  `;
  main.querySelectorAll('.orar-select').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const zi = sel.dataset.zi, ora = parseInt(sel.dataset.ora,10);
      state.orar = state.orar.filter(o=>!(o.zi===zi && o.ora===ora));
      if(sel.value) state.orar.push({id:uid(), zi, ora, claseId:sel.value});
      saveState(); showToast(sel.value ? 'Orar actualizat.' : 'Oră eliberată.');
      aplicaOraCurenta();
    });
  });
  const btnProg = document.getElementById('btn-salveaza-program');
  if(btnProg) btnProg.addEventListener('click', ()=>{
    const nou = programOre().map((iv,i)=>{
      const a = main.querySelector(`.input-prog-start[data-i="${i}"]`).value || iv[0];
      const b = main.querySelector(`.input-prog-end[data-i="${i}"]`).value || iv[1];
      return [a,b];
    });
    state.settings.programOre = nou;
    saveState(); render(); showToast('Program salvat.');
  });
}

/* ================= TAB: PLANIFICARE (teme + recomandări, pe clasă + dată) ================= */
function renderPlanificare(main){
  const claseAn = claseActive().filter(c=>c.an===ui.planificareAn);
  if(!ui.planificareClasa || !claseAn.find(c=>c.id===ui.planificareClasa)){
    ui.planificareClasa = claseAn.length ? claseAn[0].id : null;
  }
  const planClasa = ui.planificareClasa ? state.planificari.filter(p=>p.claseId===ui.planificareClasa).sort((a,b)=>a.data.localeCompare(b.data)) : [];
  const clasaAleasa = claseAn.find(c=>c.id===ui.planificareClasa);
  main.innerHTML = `
    <h2>Planificare lecții</h2>
    <p class="tab-desc">Tema principală + recomandări pentru fiecare lecție, pe clasă și dată. Tabul „Azi” o caută automat, după clasa pe care o ai la oră — clase diferite din același an pot avea planificări diferite (zile diferite, practică comasată diferită).</p>

    <div class="row" style="margin-bottom:12px; gap:6px;">
      ${ANI.map(a=>`<button class="btn ${a===ui.planificareAn?'btn-primary':'btn-ghost'}" data-plan-an-tab="${a}">Clasa a ${a}-a</button>`).join('')}
    </div>
    <div class="row" style="margin-bottom:16px;">
      <div class="field" style="min-width:180px;">
        <label>Clasă</label>
        <select id="select-plan-clasa" ${claseAn.length===0?'disabled':''}>
          ${claseAn.length===0 ? '<option>Nicio clasă în acest an</option>' :
            claseAn.map(c=>`<option value="${c.id}" ${c.id===ui.planificareClasa?'selected':''}>${escapeHtml(c.nume)}</option>`).join('')}
        </select>
      </div>
    </div>

    ${claseAn.length===0 ? emptyState('Nicio clasă activă pentru acest an.', 'Adaugă una în tabul „Clase”.') : `
    <div class="card">
      <div style="font-weight:700; color:var(--infield); margin-bottom:8px;">Adaugă o lecție — clasa ${escapeHtml(clasaAleasa?clasaAleasa.nume:'')}</div>
      <div class="row">
        <div class="field"><label>Dată</label><input type="date" id="input-plan-data" value="${todayISO()}"/></div>
        <div class="field" style="flex:1; min-width:220px;"><label>Temă principală</label><input type="text" id="input-plan-tema" placeholder="ex: Pasarea cu interiorul labei piciorului"/></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <div class="field" style="flex:1; min-width:180px;"><label>Recomandare — afară</label><input type="text" id="input-plan-afara" placeholder="opțional"/></div>
        <div class="field" style="flex:1; min-width:180px;"><label>Recomandare — în clasă/sală</label><input type="text" id="input-plan-interior" placeholder="opțional"/></div>
        <div class="field" style="flex:1; min-width:180px;"><label>Recomandare — colectiv mixt</label><input type="text" id="input-plan-mixt" placeholder="opțional"/></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn btn-primary" id="btn-add-plan">+ Adaugă lecție</button>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:700; color:var(--infield); margin-bottom:8px;">Import în masă — clasa ${escapeHtml(clasaAleasa?clasaAleasa.nume:'')}</div>
      <p class="tab-desc" style="margin-top:-4px;">O lecție pe linie, separată prin <code>|</code>: <code>DATA(AAAA-LL-ZZ)|TEMĂ|AFARĂ|INTERIOR|MIXT</code> — ultimele trei pot rămâne goale. Se adaugă doar la clasa aleasă mai sus.</p>
      <textarea id="input-plan-import" rows="5" style="width:100%; font-family:'Inter',sans-serif; font-size:13px; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px;"
        placeholder="2026-10-06|Pasarea cu interiorul labei piciorului|Teren mare, distanță 15m||Perechi mixte, atenție la forță
2026-10-13|Conducerea mingii cu schimbare de direcție|||"></textarea>
      <div class="row" style="margin-top:10px;">
        <button class="btn btn-secondary" id="btn-import-plan">Importă liniile de mai sus</button>
      </div>
    </div>

    ${planClasa.length===0 ? emptyState(`Nicio lecție pentru clasa ${escapeHtml(clasaAleasa?clasaAleasa.nume:'')}.`, 'Adaugă una sau importă mai multe, mai sus.') : `
    <div class="card" style="padding:0; overflow-x:auto;">
      <table>
        <thead><tr><th>Dată</th><th>Temă</th><th>Afară</th><th>Interior</th><th>Mixt</th><th></th></tr></thead>
        <tbody>
          ${planClasa.map(p=>`
            <tr>
              <td style="white-space:nowrap;">${formatDataRo(p.data)}</td>
              <td class="student-name">${escapeHtml(p.tema)}</td>
              <td style="font-size:12px;">${escapeHtml(p.recAfara)||'—'}</td>
              <td style="font-size:12px;">${escapeHtml(p.recInterior)||'—'}</td>
              <td style="font-size:12px;">${escapeHtml(p.recMixt)||'—'}</td>
              <td><button class="btn btn-danger" data-del-plan="${p.id}">${ICONS.trash}</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>`}
    `}
  `;
  main.querySelectorAll('[data-plan-an-tab]').forEach(b=>{
    b.addEventListener('click', ()=>{ ui.planificareAn = b.dataset.planAnTab; ui.planificareClasa = null; render(); });
  });
  const selClasa = document.getElementById('select-plan-clasa');
  if(selClasa) selClasa.addEventListener('change', e=>{ ui.planificareClasa = e.target.value; render(); });
  const btnAddPlan = document.getElementById('btn-add-plan');
  if(btnAddPlan) btnAddPlan.addEventListener('click', ()=>{
    const data = document.getElementById('input-plan-data').value;
    const tema = document.getElementById('input-plan-tema').value.trim();
    const recAfara = document.getElementById('input-plan-afara').value.trim();
    const recInterior = document.getElementById('input-plan-interior').value.trim();
    const recMixt = document.getElementById('input-plan-mixt').value.trim();
    if(!data) return showToast('Alege o dată.');
    if(!tema) return showToast('Scrie tema principală.');
    const existent = state.planificari.find(p=>p.claseId===ui.planificareClasa && p.data===data);
    if(existent) return showToast('Există deja o lecție la această dată pentru această clasă — șterge-o întâi dacă vrei s-o înlocuiești.');
    state.planificari.push({id:uid(), claseId:ui.planificareClasa, data, tema, recAfara, recInterior, recMixt});
    saveState(); render(); showToast('Lecție adăugată.');
  });
  const btnImportPlan = document.getElementById('btn-import-plan');
  if(btnImportPlan) btnImportPlan.addEventListener('click', ()=>{
    const raw = document.getElementById('input-plan-import').value;
    const linii = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    if(linii.length===0) return showToast('Lipește cel puțin o linie.');
    let adaugate = 0, sarite = 0;
    linii.forEach(linie=>{
      const parti = linie.split('|').map(s=>s.trim());
      const [data, tema, recAfara='', recInterior='', recMixt=''] = parti;
      if(!data || !/^\d{4}-\d{2}-\d{2}$/.test(data) || !tema){ sarite++; return; }
      const existent = state.planificari.find(p=>p.claseId===ui.planificareClasa && p.data===data);
      if(existent){ sarite++; return; }
      state.planificari.push({id:uid(), claseId:ui.planificareClasa, data, tema, recAfara, recInterior, recMixt});
      adaugate++;
    });
    saveState(); render();
    showToast(`${adaugate} lecții importate${sarite?`, ${sarite} sărite (format greșit sau dată deja existentă)`:''}.`);
  });
  main.querySelectorAll('[data-del-plan]').forEach(b=>{
    b.addEventListener('click', ()=>{
      state.planificari = state.planificari.filter(p=>p.id!==b.dataset.delPlan);
      saveState(); render(); showToast('Lecție ștearsă.');
    });
  });
}

/* ================= TAB: AZI (combină Orar + Planificare + Practică comasată) ================= */
// câte zile au trecut de la ultimul export de backup (null dacă nu s-a făcut niciodată)
function zileDeLaUltimulExport(){
  if(!state.settings.ultimulExport) return null;
  const azi = new Date(todayISO()+'T12:00:00');
  const ultim = new Date(state.settings.ultimulExport+'T12:00:00');
  return Math.round((azi - ultim) / (1000*60*60*24));
}
function renderAzi(main){

    ${bannerSync()}
    ${(!sync.uid && (zileExport===null || zileExport>=pragAtentionare)) ? `
      <div class="card" style="background:#FBEBD3; border-color:#E3A23C; display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap;">
        <div>💾 ${zileExport===null ? '<strong>N-ai făcut niciodată export de backup.</strong> Dacă pierzi tableta, pierzi tot.' : `<strong>Ultimul backup a fost acum ${zileExport} zile.</strong> Riști să pierzi ce ai adăugat de atunci, dacă se întâmplă ceva cu tableta.`}</div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;"><button class="btn btn-primary" id="btn-azi-export" style="white-space:nowrap;">Exportă backup</button><button class="btn btn-secondary" id="btn-azi-excel" style="white-space:nowrap;">📊 Exportă Excel</button></div>
      </div>
    ` : ''}
    ${esteWeekend ? emptyState('E weekend — nicio oră programată.', 'Orarul se aplică doar Luni-Vineri.') :
      state.orar.length===0 ? emptyState('N-ai completat încă Orarul.', 'Du-te în tabul „Orar” și adaugă zilele și orele tale.') :
      oreAzi.length===0 ? emptyState(`Nicio oră trecută pentru ${ZILE_NUME[ziAzi]} în Orar.`, 'Adaugă-le în tabul „Orar”.') : `
    <div style="display:flex; flex-direction:column; gap:12px;">
      ${oreAzi.map(o=>{
        const clasa = state.clase.find(c=>c.id===o.claseId);
        if(!clasa) return `<div class="card" style="border-left:4px solid var(--danger);"><strong>Ora ${o.ora}</strong> — clasă ștearsă din Orar</div>`;
        const practica = practicaActiva(clasa.id);
        const plan = state.planificari.find(p=>p.claseId===clasa.id && p.data===azi);
        let continut;
        if(practica){
          continut = `<div style="margin-top:8px; padding:10px; background:#FBEBD3; border-radius:8px;">🧳 <strong>Clasa e în practică comasată</strong> (${formatDataRo(practica.start)} – ${formatDataRo(practica.end)})${practica.nume?' — '+escapeHtml(practica.nume):''}. Nu ai lecție propriu-zisă azi cu ei.</div>`;
        } else if(plan){
          const recs = [];
          if(plan.recAfara) recs.push(`<div><b>Afară:</b> ${escapeHtml(plan.recAfara)}</div>`);
          if(plan.recInterior) recs.push(`<div><b>În clasă/sală:</b> ${escapeHtml(plan.recInterior)}</div>`);
          if(plan.recMixt) recs.push(`<div><b>Colectiv mixt:</b> ${escapeHtml(plan.recMixt)}</div>`);
          continut = `<div style="margin-top:8px;"><div style="font-size:16px; font-weight:700; color:var(--infield);">${escapeHtml(plan.tema)}</div>${recs.length?`<div style="margin-top:6px; font-size:14px; display:flex; flex-direction:column; gap:3px;">${recs.join('')}</div>`:''}</div>`;
        } else {
          continut = `<div style="margin-top:8px; color:var(--muted); font-size:14px;">Nicio planificare pentru azi, la clasa ${escapeHtml(clasa.nume)}. <a href="#" data-mergi-planificare="${clasa.an}" data-mergi-planificare-clasa="${clasa.id}" style="color:var(--track);">Adaugă una →</a></div>`;
        }
        return `<div class="card card-ora" data-fisa-clasa="${clasa.id}" data-fisa-ora="${o.ora}" style="border-left:4px solid var(--track); cursor:pointer;">
          <div style="display:flex; justify-content:space-between; align-items:baseline;">
            <span style="font-family:'Oswald',sans-serif; font-size:13px; color:var(--muted); text-transform:uppercase;">Ora ${o.ora}</span>
            <span style="font-weight:700; font-size:17px;">${escapeHtml(clasa.nume)}</span>
          </div>
          ${continut}
          <div style="margin-top:10px; text-align:right; font-size:13px; font-weight:700; color:var(--track);">Deschide fișa orei ›</div>
        </div>`;
      }).join('')}

  main.querySelectorAll('.card-ora').forEach(card=>{

      ui.aziFisa = {claseId:card.dataset.fisaClasa, ora:card.dataset.fisaOra, data:azi};

    });
  });

    a.addEventListener('click', (ev)=>{
      ev.preventDefault();
      ui.planificareAn = a.dataset.mergiPlanificare;
